  toast('Moved to tomorrow');
  openDailyReviewEditor(dateStr);
}


/* ============ DAY SUMMARY ============
   A plain-English wrap-up of a day built only from real data: routine,
   each task's requirements, tasks ticked without finishing, reminders,
   Top 3, main focus and learning. Read-only — it never changes data. */
function buildDaySummary(dateStr){
  const stats = computeDailyReviewStats(dateStr);
  const all = stats.routineCompleted.concat(stats.routineMissed);
  const total = stats.routineTotal || all.length;
  const doneN = stats.routineCompleted.length;
  const pct = total ? Math.round(doneN/total*100) : 0;
  const reqRows = [];
  all.forEach(it=>{
    const st = reqStatus(it, dateStr); if(!st) return;
    reqRows.push({title: plainTitle(it.title), met: st.met, done: !!it.done, forced: !!it.forcedDone,
      detail: st.rows.filter(r=>!r.optional).map(r=>(r.ok?'✓ ':'✗ ')+(r.type==='number'||r.type==='timer' ? (r.label? r.label+': ' : '')+r.short : (r.detail && r.ok ? (r.label||'')+(r.detail!=='Done' && r.type!=='check' ? ': '+r.detail : '') : (r.label||r.short)))).join(' · ')});
  });
  const reqMet = reqRows.filter(r=>r.met).length;
  const forced = all.filter(it=>it.done && it.forcedDone).map(it=>plainTitle(it.title));
  const missed = stats.routineMissed.map(it=>plainTitle(it.title));
  const mf = state.mainFocus && state.mainFocus.date===dateStr ? state.mainFocus : null;
  let verdict;
  if(!total) verdict = 'No routine was set for this day.';
  else if(pct>=90 && !forced.length) verdict = 'Strong day. You did what you said you would.';
  else if(pct>=90) verdict = 'Strong day, but a few things were ticked without being fully finished.';
  else if(pct>=70) verdict = 'Solid day with a couple of gaps.';
  else if(pct>=40) verdict = 'Mixed day. Some wins, some slips.';
  else verdict = 'Tough day. Reset and go again tomorrow.';
  const lines = [];
  lines.push(`Routine: ${doneN} of ${total} done (${pct}%).`);
  if(reqRows.length) lines.push(`Requirements fully met on ${reqMet} of ${reqRows.length} tasks.`);
  if(forced.length) lines.push(`Ticked without finishing: ${forced.join(', ')}.`);
  if(missed.length) lines.push(`Not done: ${missed.join(', ')}.`);
  const kcal = dayCalories(all);
  if(kcal.goal) lines.push(`Calories: ${kcal.eaten.toLocaleString()} / ${kcal.goal.toLocaleString()} kcal (${Math.round(kcal.eaten/kcal.goal*100)}%).`);
  if(stats.remindersTotal) lines.push(`Reminders: ${stats.remindersCompleted.length} of ${stats.remindersTotal} done.`);
  if(stats.top3Total) lines.push(`Top 3: ${stats.top3Completed.length} of ${stats.top3Total} done.`);
  if(mf) lines.push(`Main focus "${mf.text}": ${mf.done?'done':'not done'}.`);
  if(stats.learningItem) lines.push(`Learning: ${stats.learningDone ? 'done'+(stats.learningSkill?' ('+stats.learningSkill.name+')':'') : 'missed'}.`);
  return {pct, verdict, lines, reqRows, forced, missed, text: verdict+' '+lines.join(' ')};
}
function daySummaryHtml(dateStr, opts){
  opts = opts || {};
  const S = buildDaySummary(dateStr);
  return `<div class="dsum">
    <div class="dsum-top"><span class="dsum-pct">${S.pct}<small>%</small></span><span class="dsum-verdict">${escapeHtml(S.verdict)}</span></div>
    <ul class="dsum-lines">${S.lines.map(l=>`<li>${escapeHtml(l)}</li>`).join('')}</ul>
    ${!opts.short && S.reqRows.length ? `<div class="dsum-h">Requirements</div>${S.reqRows.map(r=>`<div class="dsum-req ${r.met?'ok':(r.forced?'forced':'')}"><b>${r.met?'✓':(r.forced?'!':'✗')} ${escapeHtml(r.title)}</b><span>${escapeHtml(r.detail)}${r.forced?' · ticked without finishing':''}</span></div>`).join('')}` : ''}
  </div>`;
}

function openTop3PlannerFromReview(){
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate()+1);
  const tk = isoDate(tomorrow);

  if(!state.reminderTop3 || typeof state.reminderTop3 !== 'object') state.reminderTop3 = {};
  if(!Array.isArray(state.reminderTop3[tk])) state.reminderTop3[tk] = [];

  const selected = state.reminderTop3[tk].map(String);
  const reminders = Array.isArray(state.reminders) ? state.reminders.filter(r=>{
    return !r.dismissed && !(r.done || r.completed);
  }) : [];

  openSheet(`
    <div class="sheet-header">
      <button class="sheet-btn" onclick="closeSheet()">Cancel</button>
      <h2>Plan Tomorrow’s Top 3</h2>
      <button class="sheet-btn bold" onclick="saveTop3FromReview('${tk}')">Save</button>
    </div>
    <div class="sheet-body">
      <p style="margin:0 0 14px;color:var(--text-3);font-size:14px">
        Choose up to 3 reminders to appear at the top of tomorrow’s dashboard.
      </p>
      <div id="reviewTop3Options">
        ${reminders.length ? reminders.map(r=>`
          <label class="lifeos-top3-plan-row">
            <input type="checkbox" value="${escapeHtml(String(r.id))}"
              ${selected.includes(String(r.id)) ? 'checked' : ''}
              onchange="limitReviewTop3Selections(this)">
            <span class="lifeos-top3-plan-title">${escapeHtml(String(r.title || r.name || 'Reminder'))}</span>
          </label>
        `).join('') : `
          <div class="empty">No available reminders.</div>
        `}
      </div>
      <button type="button" class="btn-primary" style="width:100%;margin-top:16px"
        onclick="saveTop3FromReview('${tk}')">Save Top 3</button>
    </div>
  `);
}

function limitReviewTop3Selections(input){
  const checked = document.querySelectorAll('#reviewTop3Options input[type="checkbox"]:checked');
  if(checked.length > 3){
    input.checked = false;
    toast('Choose up to 3 reminders');
  }
}

function saveTop3FromReview(dateKey){
  if(!state.reminderTop3 || typeof state.reminderTop3 !== 'object') state.reminderTop3 = {};
  state.reminderTop3[dateKey] = Array.from(
    document.querySelectorAll('#reviewTop3Options input[type="checkbox"]:checked')

  saveState();
  closeSheet();
  toast('Tomorrow’s Top 3 saved');
}

function saveDailyReviewEditor(dateStr){
  setTimeout(()=>{ const n = reviewStreakDays(); if(dateStr===todayISO() && n>=2){ toast(n+'-day review streak. Keep it going.'); celebrate(60,false); } }, 450);
  const stats = computeDailyReviewStats(dateStr);
  state.dailyReviews[dateStr] = {
    wentWell: document.getElementById('drWell').value.trim(),
    couldBeBetter: document.getElementById('drBetter').value.trim(),
    biggestWin: document.getElementById('drWin').value.trim(),
    tomorrowFocus: document.getElementById('drTomorrow').value.trim(),
    onePercent: (document.getElementById('drOnePct')||{value:''}).value.trim(),
    summaryText: buildDaySummary(dateStr).text,
    rating: window.__drRating || 0,
    rescheduledReminderIds: Array.from(reviewRescheduledIds || []),
    stats: {
      routineCompleted: stats.routineCompleted.length,
      routineTotal: stats.routineTotal,
      routineCompletedItems: stats.routineCompleted.map(it=>it.title),
      routineMissedItems: stats.routineMissed.map(it=>it.title),
      remindersCompleted: stats.remindersCompleted.length,
      remindersTotal: stats.remindersTotal,
      remindersCompletedItems: stats.remindersCompleted.map(r=>({id:r.id,title:r.title})),
      remindersMissedItems: stats.remindersMissed.map(r=>({id:r.id,title:r.title})),
      top3Total: stats.top3Total,
      top3Completed: stats.top3Completed.length,
      top3Items: stats.top3Items.map(r=>({id:r.id,title:r.title,done:!!(r.done||r.completed)})),
      learningDone: stats.learningDone,
      learningSkillName: stats.learningSkill ? stats.learningSkill.name : null,
      learningProgressLabel: stats.learningProgressLabel,
      lifeFocusName: stats.lifeFocus ? stats.lifeFocus.name : null,
      ecomFocusName: stats.ecomFocus ? stats.ecomFocus.name : null,
      overallPct: stats.overallPct
    },
    updatedAt: Date.now()
  };
  saveState(); closeSheet(); render(); toast('Review saved');
}

      <div class="field"><label>Sessions completed</label><input id="skillInitialSessions" type="number" min="0" step="1" value="0"></div>
      <div class="field"><label>Notes</label><textarea id="skillNotes" placeholder="Optional"></textarea></div>
    </div>`);
}
function createSkill(){
  const name=document.getElementById('skillName').value.trim();
  if(!name){toast('Enter a skill');return;}
  const target=Math.max(1,Math.floor(Number(document.getElementById('skillTargetSessions').value)||1));
  const sessions=Math.max(0,Math.min(target,Math.floor(Number(document.getElementById('skillInitialSessions').value)||0)));
  const progress=Math.min(100,Math.round((sessions/target)*100));
  state.skills.push({id:uid(),name,category:document.getElementById('skillCategory').value.trim()||'General',progress,sessions,sessionsCompleted:sessions,targetSessions:target,masterySessions:target,learnedDates:[],notes:document.getElementById('skillNotes').value.trim(),createdAt:Date.now()});
  saveState(); closeSheet(); renderFocus(); toast('Skill added');
}
function openSkillDetail(id){
  const sk=state.skills.find(x=>x.id===id); if(!sk)return;
  if(window.ensureSkillModel) window.ensureSkillModel(sk);
  const target=Math.max(1,Math.floor(Number(sk.targetSessions)||1));
  const sessions=Math.max(0,Math.min(target,Math.floor(Number(sk.sessionsCompleted ?? sk.sessions)||0)));
  const progress=Math.min(100,Math.round((sessions/target)*100));
  openSheet(`<div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Close</button><h2>${escapeHtml(sk.name)}</h2><button class="sheet-btn bold" style="color:var(--red)" onclick="deleteSkill('${sk.id}')">Delete</button></div>
    <div class="sheet-body">
      <div class="field"><label>Sessions needed for 100%</label><input id="skillEditTargetSessions" type="number" min="1" step="1" value="${target}"></div>
      <div class="field"><label>Sessions completed</label><input id="skillEditSessionsCompleted" type="number" min="0" step="1" value="${sessions}"></div>
      <div class="field"><label>Progress</label><div class="row-sub" id="skillEditProgressPreview">${sessions} / ${target} sessions · ${progress}%</div></div>
      <div class="field"><label>Category</label><input id="skillEditCategory" type="text" value="${escapeHtml(sk.category||'General')}"></div>
      <div class="field"><label>Notes</label><textarea id="skillEditNotes">${escapeHtml(sk.notes||'')}</textarea></div>
      <button class="btn-primary" onclick="saveSkill('${sk.id}')">Save</button>
    </div>`);
  const targetEl=document.getElementById('skillEditTargetSessions');
  const sessionsEl=document.getElementById('skillEditSessionsCompleted');
  const preview=document.getElementById('skillEditProgressPreview');
  function updatePreview(){
    const t=Math.max(1,Math.floor(Number(targetEl.value)||1));
    const s=Math.max(0,Math.min(t,Math.floor(Number(sessionsEl.value)||0)));
    sessionsEl.value=s;
    preview.textContent=s+' / '+t+' sessions · '+Math.min(100,Math.round((s/t)*100))+'%';
  }
  targetEl.addEventListener('input',updatePreview);
  sessionsEl.addEventListener('input',updatePreview);
}
function saveSkill(id){
  const sk=state.skills.find(x=>x.id===id); if(!sk)return;
  const target=Math.max(1,Math.floor(Number(document.getElementById('skillEditTargetSessions').value)||1));
  const sessions=Math.max(0,Math.min(target,Math.floor(Number(document.getElementById('skillEditSessionsCompleted').value)||0)));
  sk.targetSessions=target;
  sk.masterySessions=target;
  sk.sessionsCompleted=sessions;
  sk.sessions=sessions;
  sk.progress=Math.min(100,Math.round((sessions/target)*100));
  sk.category=document.getElementById('skillEditCategory').value.trim()||'General';
  sk.notes=document.getElementById('skillEditNotes').value.trim();
  saveState(); closeSheet(); renderFocus(); toast('Skill updated');
}
function deleteSkill(id){
  snap();
  state.skills=state.skills.filter(x=>x.id!==id);
  (state.lifeFocuses||[]).forEach(f=>(f.days||[]).forEach(d=>d.items.forEach(it=>{if(it.skillId===id){it.skillId=null;it.done=false;}})));
  saveState(); closeSheet(); renderFocus(); render(); undoToast('Skill deleted');
}
function openSkillLearningSheet(focusId,date,itemId){
  const focus=findAnyFocus(focusId); if(!focus)return;
  const day=focus.days.find(d=>d.date===date); if(!day)return;
  const item=day.items.find(i=>i.id===itemId); if(!item)return;
  if(reqBlocked(item,date)){ showTaskRequirements(focusId,date,itemId); toast('Finish the requirements first'); return; }
  const current=item.skillId||'';
  openSheet(`<div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Cancel</button><h2>Skill Learning</h2><button class="sheet-btn bold" onclick="saveSkillLearning('${focusId}','${date}','${itemId}')">Save</button></div>
    <div class="sheet-body">
      <div class="field"><label>What skill did you learn about today?</label>
        <select id="skillLearningSelect" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--sep);background:var(--card-2);color:var(--text);font-size:16px">
          <option value="">Select a skill</option>
          ${(state.skills||[]).map(sk=>`<option value="${sk.id}" ${current===sk.id?'selected':''}>${escapeHtml(sk.name)}</option>`).join('')}
        </select>
      </div>
      ${current?'<div class="row-sub">Saving a different skill will move today’s learning session to the new skill.</div>':''}
      ${!(state.skills||[]).length?'<div class="row-sub">No skills yet. Add one from Focus → Skills first.</div>':''}
    </div>`);
}
function saveSkillLearning(focusId,date,itemId){
  const focus=findAnyFocus(focusId); if(!focus)return;
  const day=focus.days.find(d=>d.date===date); if(!day)return;
  const item=day.items.find(i=>i.id===itemId); if(!item)return;
  const newId=document.getElementById('skillLearningSelect').value;
  const oldId=item.skillId||null;
  if(oldId===newId){
    item.done=!!newId;
  }else{
    if(oldId){const old=state.skills.find(sk=>sk.id===oldId);if(old){
      if(window.LifeOSUpdateSkillProgress) window.LifeOSUpdateSkillProgress(old, false);
      old.learnedDates=(old.learnedDates||[]).filter(d=>d!==date);
    }}
    item.skillId=newId||null;
    item.done=!!newId;
    if(newId){const sk=state.skills.find(sk=>sk.id===newId);if(sk){
      if(window.LifeOSUpdateSkillProgress) window.LifeOSUpdateSkillProgress(sk, true);
      sk.learnedDates=Array.from(new Set([...(sk.learnedDates||[]),date])).sort();
    }}
  }
  saveState(); closeSheet(); render(); toast(newId?'Skill logged':'Skill cleared');
}

function priorityColor(p){
  if(p==='High') return 'red';
  if(p==='Medium') return 'orange';
  return 'gray';
}

function niceTitle(t){
  t=String(t||'').trim();
  try{ return t.replace(/^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u200D|\p{Extended_Pictographic}|\p{Emoji_Modifier})*)(?=\S)/u,'$1 '); }catch(e){ return t; }
}
function firstLine(s){
  return String(s||'').split('\n').map(x=>x.trim()).find(Boolean) || '';
}
function routineRow(it, lifeFocusId, ecomFocusId, date){
  const focusId = it.category==='ecommerce' ? ecomFocusId : lifeFocusId;
  const editable = !!focusId;

  /* Whole-item checklists (e.g. Weekly Reset) */
  if(it.type==='checklist'){
    const list = it.checklist||[];
    const doneCount = list.filter(c=>c.done).length;
    const clickAttr = editable? `onclick="toggleRoutineChecklistExpand('${focusId}','${date}','${it.id}')"` : '';
    return `
      <div class="row" ${clickAttr}>
        <div class="checkbox ${it.done?'checked':''}" style="${editable?'':'opacity:.5'}">${it.done?'✓':''}</div>
        <div class="row-text">
          <div class="row-title ${it.done?'done':''}">${escapeHtml(niceTitle(it.title))}</div>
          <div class="row-sub">${list.length? doneCount+' of '+list.length+' done':''}</div>
        </div>
        <div class="chevron" style="transform:rotate(${it.expanded?90:0}deg)">›</div>
      </div>
      ${it.expanded? `<div class="sub-panel">${list.map(c=>`
        <div class="nested-row" ${editable?`onclick="event.stopPropagation();toggleChecklistChild('${focusId}','${date}','${it.id}','${c.id}')"`:''}>
          <div class="checkbox ${c.done?'checked':''}">${c.done?'✓':''}</div>
          <div class="nr-title ${c.done?'done':''}">${escapeHtml(c.title)}</div>
        </div>`).join('')}</div>`:''}
    `;
  }

  const timeLabel = showRoutineTimes ? (it.time || it.displayText || '') : '';
  const skill = it.refId==='skilllearning' && it.skillId ? state.skills.find(sk=>sk.id===it.skillId) : null;
  const rowClick = editable && it.refId==='skilllearning' ? `onclick="openSkillLearningSheet('${focusId}','${date}','${it.id}')"` : '';
  let cbOnclick = '', doneCode = '';
  if(editable){
    if(it.refId==='gym' && !it.done) doneCode = `handleGymCheckboxTap('${focusId}','${date}','${it.id}')`;
    else doneCode = `toggleRoutineItem('${focusId}','${date}','${it.id}')`;
    cbOnclick = `onclick="event.stopPropagation();${doneCode}"`;
  }
  const rowAttrs = !editable ? '' :
    `data-swipe data-swipe-right="${doneCode}" data-swipe-left="openRoutineActions('${focusId}','${date}','${it.id}')" ` +
    (it.refId==='skilllearning' ? rowClick : `onclick="${doneCode}"`);

  // One short secondary line only — long multi-line notes live in the ⋯ sheet.
  const subParts = [];
  if(timeLabel) subParts.push(timeLabel);
  if(skill) subParts.push('Learned: '+skill.name);
  const meta = [];
  if(it.carriedFrom) meta.push('↪ from '+fmtDM(it.carriedFrom));
  const loggedMin = (state.timerLogs||[]).filter(l=>l.itemDate===date && l.itemId===it.id).reduce((a,l)=>a+l.minutes,0);
  if(loggedMin) meta.push('⏱ '+fmtMins(loggedMin));

  const merged = Array.isArray(it.merged) ? it.merged : [];
  const mergedDone = merged.filter(m=>m.done).length;
  const mergedOpen = merged.length && it.mergedOpen!==false;
  const hasNotes = !!(it.note && String(it.note).trim()) || merged.length>0;
  const notesLink = editable && hasNotes ? `<button class="note-link" onclick="event.stopPropagation();openItemNotesView('${focusId}','${date}','${it.id}')">📝 View notes${merged.length? ' · 🔀 '+merged.length : ''}</button>` : '';

  return `
    <div class="row" ${rowAttrs}>
      <div class="checkbox ${it.done?'checked':''}" style="${editable?'':'opacity:.5'}" ${cbOnclick}>${it.done?'✓':''}</div>
      <div class="row-text">
        <div class="row-title ${it.done?'done':''}">${escapeHtml(niceTitle(it.title))}</div>
        ${subParts.length? `<div class="row-sub clamp">${escapeHtml(subParts.join(' · '))}</div>`:''}
        ${meta.length? `<div class="row-meta">${escapeHtml(meta.join(' · '))}</div>`:''}
        ${notesLink}
      </div>
      ${merged.length? `<button class="mini-chip ${mergedOpen?'on':''}" onclick="event.stopPropagation();toggleMergedOpen('${focusId}','${date}','${it.id}')">🔀 ${mergedDone}/${merged.length}</button>`:''}
      ${renderSubChecklistTrigger(it, focusId, date, editable)}
      ${editable? `<button class="row-more" onclick="event.stopPropagation();openRoutineActions('${focusId}','${date}','${it.id}')" aria-label="More">•••</button>`:''}
    </div>
    ${mergedOpen ? renderMergedPanel(it, focusId, date, editable) : ''}
    ${renderSubChecklistPanel(it, focusId, date, editable)}`;
}

/* What a merged item carries with it: its note and its checklist. */
function mergedContentHtml(m){
  const s=m.snapshot||{};
  const note=(s.note||'').trim();
  const list=[].concat(Array.isArray(s.subChecklist)?s.subChecklist:[], Array.isArray(s.checklist)?s.checklist:[]);
  if(!note && !list.length) return '';
  return `<div class="merged-contents">
    ${note? `<div class="merged-note">${escapeHtml(note)}</div>`:''}
    ${list.length? list.map(c=>`<div class="merged-check ${c.done?'done':''}">${c.done?'✓':'○'} ${escapeHtml(niceTitle(c.title))}</div>`).join(''):''}
  </div>`;
}
/* Items merged into a routine item show as a dropdown directly underneath it. */
function renderMergedPanel(it, focusId, date, editable){
  return `<div class="merge-panel">
    ${it.merged.map((m,i)=>`
      <div class="nested-row" ${editable?`onclick="toggleMergedChild('${focusId}','${date}','${it.id}',${i})"`:''}>
        <div class="checkbox ${m.done?'checked':''}">${m.done?'✓':''}</div>
        <div style="flex:1;min-width:0">
          <div class="nr-title ${m.done?'done':''}">${escapeHtml(niceTitle(m.title))}</div>
          ${m.fromDate? `<div class="nr-sub">Merged from ${escapeHtml(fmtDM(m.fromDate))}</div>`:''}
          ${mergedContentHtml(m)}
        </div>
        ${editable? `<button class="icon-btn" title="Split back out" onclick="event.stopPropagation();unmergeOne('${focusId}','${date}','${it.id}',${i})">↩︎</button>`:''}
      </div>`).join('')}
  </div>`;
}
function toggleMergedOpen(focusId,date,itemId){
  const it = findFocusItem(focusId,date,itemId); if(!it) return;
  it.mergedOpen = it.mergedOpen===false;
  saveState(); render();
}
function toggleMergedChild(focusId,date,itemId,i){
  const it = findFocusItem(focusId,date,itemId); if(!it || !it.merged || !it.merged[i]) return;
  it.merged[i].done = !it.merged[i].done;
  saveState(); render();
}

function toggleShowRoutineTimes(){
  showRoutineTimes = !showRoutineTimes;
  render();
}
function toggleRoutineItem(focusId, date, itemId, __confirmed){
  const focus = findAnyFocus(focusId);
  if(itemId && focus){
    const dd = focus.days.find(d=>d.date===date), cur = dd && dd.items.find(i=>i.id===itemId);
    if(cur && reqBlocked(cur,date)){
      const sheetOpen = document.getElementById('sheetBackdrop').classList.contains('open');
      if(sheetOpen) openReqSheet(focusId,date,itemId); else showTaskRequirements(focusId,date,itemId);
      toast('Finish the requirements first');
      return;
    }
  }
  if(itemId && focus){
    const day = focus.days.find(d=>d.date===date);
    const item = day && day.items.find(i=>i.id===itemId);
    if(item && item.refId==='skilllearning' && !item.done && !item.skillId && (state.skills||[]).length){ openSkillLearningSheet(focusId,date,itemId); return; }
  }
  if(!focus) return;
  const day = focus.days.find(d=>d.date===date);
  if(!day) return;
  const item = day.items.find(i=>i.id===itemId);
  if(!item) return;
  if(!item.done && !__confirmed){
    const st = reqStatus(item, date);
    if(st && !st.met){
      const missing = st.rows.filter(r=>!r.ok && !r.optional).map(r=>'• '+(r.label||'Requirement')+(r.short && r.short!==r.label ? ' ('+r.short+')' : ''));
      uiConfirm("You haven't completed:\n"+missing.join('\n')+"\n\nTick it off anyway? It'll show in your day summary as ticked without finishing.", {title:'Tick off '+plainTitle(item.title)+'?', ok:'Tick it off', cancel:'Not yet', danger:false})
        .then(ok=>{ if(ok) toggleRoutineItem(focusId, date, itemId, true); });
      return;
    }
  }
  item.done = !item.done;
  if(item.done && __confirmed) item.forcedDone = true; else delete item.forcedDone;
  if(item.done) setTimeout(()=>celebrateTick(date), 30);
  if(item.done && Array.isArray(item.merged)) item.merged.forEach(m=>{ m.done = true; });
  saveState();
  render();
}
function toggleRoutineChecklistExpand(focusId, date, itemId){
  const focus = findAnyFocus(focusId);
  if(!focus) return;
  const day = focus.days.find(d=>d.date===date);
  if(!day) return;
  const item = day.items.find(i=>i.id===itemId);
  if(!item) return;
  item.expanded = !item.expanded;
  saveState();
  render();
}
function toggleChecklistChild(focusId, date, itemId, childId){
  const focus = findAnyFocus(focusId);
  if(!focus) return;
  const day = focus.days.find(d=>d.date===date);
  if(!day) return;
  const item = day.items.find(i=>i.id===itemId);
  if(!item || !item.checklist) return;
  const c = item.checklist.find(x=>x.id===childId);
  if(!c) return;
  c.done = !c.done;
  const was = item.done;
  item.done = item.checklist.every(x=>x.done);
  saveState();
  render();
  if(item.done && !was) celebrateTick(date); else if(c.done) celebrate(14,false);
}

/* ---- Snap Fitness gate: rather than a persistent row on the routine card,
   ticking Gym done for the first time asks a quick one-off "have you
   completed Snap Fitness?" question, then ticks Gym off once answered.
   Unticking Gym (already done -> not done) skips the gate entirely. ---- */
function handleGymCheckboxTap(focusId, date, itemId){
  toggleRoutineItem(focusId, date, itemId); // Snap Fitness is now one of Gym's requirements
}
function openSnapFitnessGate(focusId, date, itemId){
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Cancel</button><h2>🏋️ Gym</h2><span style="width:40px"></span></div>

        </div>

function toggleSnapFitnessGateCheck(){

}
function confirmSnapFitnessGate(focusId, date, itemId){

/* ================================================================
   ROUTINE ITEM CHECKLISTS — an OPTIONAL sub-checklist any normal routine
   item (type:'item') can carry, fully separate from the whole-item
   type:'checklist' rows like Weekly Reset. Stored per-item as
   it.subChecklist (array of {id,title,done}, absent/empty = no checklist).
   Reuses the existing it.expanded flag (already present on every item but
   otherwise unused for type:'item') to track expand/collapse, so no new
   per-item field is needed for that. Rendered as a small, subtle trigger
   inline on the right of the routine's own row — never a separate card —
   with the expanded item list, if any, tucked in a compact panel below.
   Lives inside the same Life/Ecommerce Focus day item it belongs to, so it
   is exported/imported for free as part of the normal state — no backup
   schema changes required.
================================================================ */
function findFocusItem(focusId, date, itemId){
  const focus = findAnyFocus(focusId);
  if(!focus) return null;
  const day = focus.days.find(d=>d.date===date);
  if(!day) return null;
  return day.items.find(i=>i.id===itemId) || null;
}
function renderSubChecklistTrigger(it, focusId, date, editable){
  if(it.type==='checklist') return '';
  const list = it.subChecklist;
  if(!list || !list.length) return ''; // "Add checklist" lives in the ••• menu now
  const doneCount = list.filter(c=>c.done).length;
  return `<button class="mini-chip ${it.expanded?'on':''}" onclick="event.stopPropagation();toggleSubChecklistExpand('${focusId}','${date}','${it.id}')">☑ ${doneCount}/${list.length}</button>`;
}
function renderSubChecklistPanel(it, focusId, date, editable){
  if(it.type==='checklist') return '';
  const list = it.subChecklist;
  if(!list || !list.length || !it.expanded) return '';
  return `<div class="sub-panel">
    ${list.map(c=>`
      <div class="nested-row" ${editable?`onclick="toggleSubChecklistItem('${focusId}','${date}','${it.id}','${c.id}')"`:''}>
        <div class="checkbox ${c.done?'checked':''}">${c.done?'✓':''}</div>
        <div class="nr-title ${c.done?'done':''}">${escapeHtml(c.title)}</div>
        ${editable? `<button class="icon-btn" onclick="event.stopPropagation();editSubChecklistItem('${focusId}','${date}','${it.id}','${c.id}')">✎</button><button class="icon-btn danger" onclick="event.stopPropagation();deleteSubChecklistItem('${focusId}','${date}','${it.id}','${c.id}')">✕</button>` : ''}
      </div>`).join('')}
    ${editable? `<div class="nested-actions">
      <button class="nested-link" onclick="addSubChecklistItem('${focusId}','${date}','${it.id}')">+ Add item</button>
      <button class="nested-link danger" onclick="removeSubChecklist('${focusId}','${date}','${it.id}')">Remove</button>
    </div>` : ''}
  </div>`;
}
function addSubChecklist(focusId,date,itemId){
  const it = findFocusItem(focusId,date,itemId);
  if(!it) return;
  it.subChecklist = [];
  it.expanded = true;
  saveState();
  addSubChecklistItem(focusId,date,itemId);
}
function removeSubChecklist(focusId,date,itemId){
  const it = findFocusItem(focusId,date,itemId);
  if(!it) return;
  snap();
  delete it.subChecklist;
  saveState(); render(); undoToast('Checklist removed');
}
function toggleSubChecklistExpand(focusId,date,itemId){
  const it = findFocusItem(focusId,date,itemId);
  if(!it) return;
  it.expanded = !it.expanded;
  saveState(); render();
}
async function addSubChecklistItem(focusId,date,itemId){
  const it = findFocusItem(focusId,date,itemId);
  if(!it) return;
  const title = await uiPrompt('Add checklist item', '', {placeholder:'e.g. Pack lunch', ok:'Add'});
  if(!title || !title.trim()) return;
  if(!Array.isArray(it.subChecklist)) it.subChecklist = [];
  it.subChecklist.push({id:uid(), title:title.trim(), done:false});
  it.expanded = true;
  saveState(); render();
}
async function editSubChecklistItem(focusId,date,itemId,childId){
  const it = findFocusItem(focusId,date,itemId);
  if(!it || !Array.isArray(it.subChecklist)) return;
  const c = it.subChecklist.find(x=>x.id===childId);
  if(!c) return;
  const title = await uiPrompt('Edit item', c.title);
  if(title===null || !title.trim()) return;
  c.title = title.trim();
  saveState(); render();
}
function deleteSubChecklistItem(focusId,date,itemId,childId){
  const it = findFocusItem(focusId,date,itemId);
  if(!it || !Array.isArray(it.subChecklist)) return;
  snap();
  it.subChecklist = it.subChecklist.filter(x=>x.id!==childId);
  saveState(); render(); undoToast('Item deleted');
}
function toggleSubChecklistItem(focusId,date,itemId,childId){
  const it = findFocusItem(focusId,date,itemId);
  if(!it || !Array.isArray(it.subChecklist)) return;
  const c = it.subChecklist.find(x=>x.id===childId);
  if(!c) return;
  c.done = !c.done;
  saveState(); render();
}

/* ================================================================
   TODAY'S LIST — ONE list of multiple items per date, fully separate
   from routines/focuses/reminders/goals. Stored in state.todaysLists
   keyed by the date the LIST belongs to. The ENTIRE list (never an
   individual item) can be inserted into a day's routine as a single
   collapsible dropdown block — insertRoutine holds that placement
   (date/position/time/duration) as one record per list. Insertion is
   applied as a read-time overlay (applyTodaysListOverlay), so it never
   edits a Focus's persisted day items — the permanent routine and its
   times/order are never touched.
================================================================ */
let todaysListViewDate = todayISO();
let tlItemEditor = null;       // in-progress single item/reminder editor
let tlListInsertFlow = null;   // in-progress "insert whole list" wizard state
let tlExpandedState = {};      // UI-only: which dropdowns are expanded (by list date), not persisted

function ensureTodaysList(dateStr){
  if(!state.todaysLists || typeof state.todaysLists!=='object') state.todaysLists = {};
  if(!state.todaysLists[dateStr]) state.todaysLists[dateStr] = { date:dateStr, items:[], insertRoutine:null };
  return state.todaysLists[dateStr];
}
/* Splices ONE dropdown pseudo-item per inserted Today's List into an
   already-computed routine array. excludeListDate hides a list's own
   existing placement from its own position-picker preview. */
function applyTodaysListOverlay(routineItems, dateStr, excludeListDate){
  const lists = Object.values(state.todaysLists||{}).filter(l=> l.insertRoutine && l.insertRoutine.date===dateStr && l.date!==excludeListDate);
  if(!lists.length) return routineItems;
  const items = routineItems.slice();
  lists.forEach(list=>{
    const pseudo = { __todaysList:true, listDate:list.date, id:'tl_'+list.date, refId:'tl_'+list.date };
    const anchor = list.insertRoutine.insertAfter;
    let idx;
    if(anchor==='__START__') idx=0;
    else if(anchor==='__END__') idx=items.length;
    else {
      const found = items.findIndex(it=> it.refId===anchor && !it.__todaysList);
      idx = found>-1 ? found+1 : items.length;
    }
    items.splice(idx,0,pseudo);
  });
  return items;
}
function computeTimeRangeLabel(time, duration){
  if(!time) return '';
  if(!duration) return time;
  const start = timeToMinutes(time);
  const end = start + (parseInt(duration,10)||0);
  const h = Math.floor((end%1440)/60), m = end%60;
  const endStr = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  return time+' – '+endStr+' ('+duration+' min)';
}
/* Collapsible dropdown row rendered inline in a day's routine — matches the
   look of the existing checklist-type routine row (chevron + expand panel).
   Ticking an item here only updates Today's List; it never touches normal
   routine completion data. */
function todaysListRoutineRow(pseudo){
  const list = state.todaysLists[pseudo.listDate];
  if(!list) return '';
  const items = (list.items||[]).slice().sort((a,b)=>a.order-b.order);
  const doneCount = items.filter(i=>i.done).length;
  const expanded = !!tlExpandedState[pseudo.listDate];
  const timeLabel = showRoutineTimes ? computeTimeRangeLabel(list.insertRoutine.time, list.insertRoutine.duration) : '';
  return `
    <div class="row" style="cursor:pointer" onclick="toggleTlDropdown('${pseudo.listDate}')">
      <div class="row-text">
        <div class="row-title">📋 Today's List</div>
        <div class="row-sub">${timeLabel? escapeHtml(timeLabel)+' · ':''}${items.length? doneCount+'/'+items.length+' completed' : 'No items yet'}</div>
      </div>
      <div class="chevron" style="transform:rotate(${expanded?90:0}deg)">›</div>
    </div>
    ${expanded? `<div style="padding:0 16px 10px">${
      items.length ? items.map(it=>`
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--sep)" onclick="event.stopPropagation();toggleTlItemDone('${pseudo.listDate}','${it.id}')">
          <div class="checkbox ${it.done?'checked':''}">${it.done?'✓':''}</div>
          <div class="row-text">
            <div class="row-title ${it.done?'done':''}">${it.kind==='reminder'?'🔔 ':''}${escapeHtml(it.title)}</div>
            ${it.note? `<button class="note-link" onclick="event.stopPropagation();openTodaysListNote('${pseudo.listDate}','${it.id}')">📝 View notes</button>` : ''}
          </div>
          ${it.kind==='reminder' && it.priority? `<span class="pill ${priorityColor(it.priority)}">${it.priority}</span>` : ''}
        </div>`).join('')
      : `<div class="row-sub" style="padding:8px 0">No items yet — open Today's List on the Goals page to add some.</div>`
    }</div>` : ''}
  `;
}
function toggleTlDropdown(dateStr){
  tlExpandedState[dateStr] = !tlExpandedState[dateStr];
  render();
}
function toggleTlItemDone(dateStr, itemId){
  const list = state.todaysLists[dateStr];
  if(!list) return;
  const it = list.items.find(x=>x.id===itemId);
  if(!it) return;
  it.done = !it.done;
  saveState();
  render();
}
function moveTodaysListItem(dateStr, itemId, dir){
  const list = state.todaysLists[dateStr];
  if(!list) return;
  const items = list.items.slice().sort((a,b)=>a.order-b.order);
  const idx = items.findIndex(t=>t.id===itemId);
  const n = idx+dir;
  if(n<0||n>=items.length) return;
  [items[idx],items[n]] = [items[n],items[idx]];
  items.forEach((t,i)=>t.order=i);
  saveState();
  render();
}

/* ---- Insert the WHOLE list into a day's routine as one dropdown block ---- */
function describeInsertAnchor(ins){
  if(!ins) return '';
  if(ins.insertAfter==='__START__') return 'At the very start';
  if(ins.insertAfter==='__END__') return 'At the end';
  const base = getBaseMergedRoutineForDate(ins.date);
  const item = base.find(it=>it.refId===ins.insertAfter);
  return item? ('After '+item.title) : 'Custom position';
}
function getMergedRoutineWithTodaysList(dateStr, excludeListDate){
  return applyTodaysListOverlay(getBaseMergedRoutineForDate(dateStr), dateStr, excludeListDate);
}
function startInsertIntoRoutine(listDate){
  const list = state.todaysLists[listDate];
  const existing = list && list.insertRoutine;
  tlListInsertFlow = {
    listDate,
    date: existing ? existing.date : listDate,
    insertAfter: existing ? existing.insertAfter : null,
    time: existing ? existing.time : '',
    duration: existing ? existing.duration : ''
  };
  renderTlInsertDateStep();
}
function renderTlInsertDateStep(){

function tlPickInsertDate(dateStr){
  if(!dateStr) return;

function renderTlInsertPositionStep(){
  const dateStr = tlListInsertFlow.date;

  const dt = new Date(dateStr+'T00:00:00');

    <div class="sheet-body">
      <div class="hint">Where do you want to put Today's List?</div>
      ${rows.join('')}
    </div>

function tlConfirmInsertPosition(anchor){
  tlListInsertFlow.insertAfter = anchor;
  renderTlInsertTimeStep();

function renderTlInsertTimeStep(){
  const f = tlListInsertFlow;
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="renderTlInsertPositionStep()">Back</button><h2>Time & Duration</h2><button class="sheet-btn bold" onclick="tlSaveInsertion()">Save</button></div>
    <div class="sheet-body">
      <div class="hint">Today's List is treated as one scheduled block — you don't need to schedule each item inside it.</div>
      <div class="field"><label>Start Time (optional)</label><input type="time" id="tlInsertTime" value="${f.time||''}"></div>
      <div class="field"><label>Duration in minutes (optional)</label><input type="number" min="0" step="5" id="tlInsertDuration" value="${f.duration||''}"></div>
    </div>

function tlSaveInsertion(){
  const f = tlListInsertFlow;
  f.time = document.getElementById('tlInsertTime').value || '';
  f.duration = document.getElementById('tlInsertDuration').value ? parseInt(document.getElementById('tlInsertDuration').value,10) : '';
  const conflict = tlCheckConflict();
  if(conflict){ renderTlConflictSheet(conflict); return; }
  tlFinalizeInsertion();
}
function tlCheckConflict(){
  const f = tlListInsertFlow;
  if(!f.time || !f.duration) return null;
  const start = timeToMinutes(f.time);
  const end = start + (parseInt(f.duration,10)||0);
  const routine = getBaseMergedRoutineForDate(f.date);
  for(const it of routine){
    if(!it.time) continue;
    const t = timeToMinutes(it.time);
    if(t>=start && t<end) return it;
  }
  return null;
}
function renderTlConflictSheet(conflictItem){
  openSheet(`
    <div class="sheet-header"><span style="width:40px"></span><h2>⚠️ Scheduling Conflict</h2><span style="width:40px"></span></div>
    <div class="sheet-body">
      <div class="hint">Today's List overlaps with "${escapeHtml(conflictItem.title)}".</div>
      <button class="btn-primary" style="margin-bottom:8px" onclick="renderTlInsertTimeStep()">Change Time / Duration</button>
      <button class="sheet-btn" onclick="tlFinalizeInsertion()">Keep Anyway</button>
    </div>
  `);
}
function tlFinalizeInsertion(){
  const f = tlListInsertFlow;
  const list = ensureTodaysList(f.listDate);
  list.insertRoutine = { date:f.date, insertAfter:f.insertAfter, time:f.time||'', duration:f.duration||'' };
  tlListInsertFlow = null;
  saveState();
  closeSheet();
  render();
  toast("Today's List inserted into routine");
}
function removeTlInsertion(dateStr){
  const list = state.todaysLists[dateStr];
  if(list) list.insertRoutine = null;
  saveState();
  render();
  toast('Removed from routine');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- Live Today's Timetable ---- */
function fmtRange(start,end){
  const f=t=>{ let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0) hh=12; return hh+':'+String(m).padStart(2,'0')+' '+ap; };
  return f(start)+'–'+f(end);
}
function renderTodayTimetableCard(){
  const now = new Date();
  const dow = now.getDay();
  const blocks = getDaySchedule(dow);
  if(!blocks){
    return `
      <div class="section-label">Today's Timetable</div>
      <div class="card"><div class="empty"><div class="icon">🎒</div><div class="msg">No school today.</div></div></div>
    `;
  }
  const nm = nowMinutes();
  let currentIdx = -1;
  blocks.forEach((b,i)=>{
    if(nm>=timeToMinutes(b.start) && nm<timeToMinutes(b.end)) currentIdx=i;
  });
  let upNextHtml='';
  if(currentIdx>-1){
    const cur = blocks[currentIdx];
    if(cur.type==='break'){
      const next = blocks.slice(currentIdx+1).find(b=>b.type==='period');
      if(next) upNextHtml = `<div class="tt-upnext">Up Next: <b>${escapeHtml(next.subject)}</b> at ${fmtRange(next.start,next.end).split('–')[0]}</div>`;
    }
  }
  const rows = blocks.map((b,i)=>{
    const done = timeToMinutes(b.end)<=nm;
    const isCurrent = i===currentIdx;
    const cls = ['tt-row', b.type==='break'?'tt-break':'', isCurrent?'tt-current':'', (done && !isCurrent)?'tt-done':''].filter(Boolean).join(' ');
    const label = b.type==='period' ? escapeHtml(b.subject) : escapeHtml(b.label);
    return `<div class="${cls}"><div class="tt-time">${fmtRange(b.start,b.end)}</div><div class="tt-title">${label}</div></div>`;
  }).join('');
  return `
    <div class="section-label">Today's Timetable</div>
    <div class="card" id="todayTimetableCard">${rows}</div>
    ${upNextHtml}
  `;
}

    return {id:uid(),title:t,done:false};

function focusMoveItem(idx,dir){
  const day=getFdDay(); const items=day.items;
  const isEcom = isEcommerceFocusId(fdEditFocusId);
  // only reorder within the same owned group (Ecommerce items move among
  // themselves, everything else moves among itself) so the two systems
  // can't shuffle each other's items
  const group = items.map((it,i)=>i).filter(i=> isEcom ? items[i].category==='ecommerce' : items[i].category!=='ecommerce');

/* Overall + per-category completion score for a Weekly Focus. Ecommerce
   completion is pulled from whichever Ecommerce Focus day(s) fall within this
   week's Monday–Sunday range, since Ecommerce Focus is a separate, independently
   dated track (see the comment above buildLifeFocusDayItems/buildEcommerceDayItems). */
function computeWeeklyScore(focus){
  const cat = {routine:{done:0,total:0}, gym:{done:0,total:0}, school:{done:0,total:0}, ecommerce:{done:0,total:0}};
  function tally(items){
    items.forEach(it=>{
      const key = it.category==='gym' ? 'gym' : it.category==='school' ? 'school' : it.category==='ecommerce' ? 'ecommerce' : 'routine';
      if(it.type==='checklist' && Array.isArray(it.checklist) && it.checklist.length){
        cat[key].total += it.checklist.length;
        cat[key].done += it.checklist.filter(c=>c.done).length;
      } else {
        cat[key].total++;
        if(it.done) cat[key].done++;
      }
    });
  }
  focus.days.forEach(d=> tally(d.items));
  state.ecommerceFocuses.forEach(ef=>{
    (ef.days||[]).forEach(d=>{
      if(d.date>=focus.startDate && d.date<=focus.endDate) tally(d.items.filter(it=>it.category==='ecommerce'));
    });
  });
  const total = cat.routine.total+cat.gym.total+cat.school.total+cat.ecommerce.total;
  const done = cat.routine.done+cat.gym.done+cat.school.done+cat.ecommerce.done;
  const pct = t=> t.total ? Math.round(t.done/t.total*100) : null;
  return {
    overall: total ? Math.round(done/total*100) : 0,
    routine: pct(cat.routine), gym: pct(cat.gym), school: pct(cat.school), ecommerce: pct(cat.ecommerce)
  };
}

function isWeeklyResetDay(dow){ const d = Array.isArray(state.weeklyResetDays) ? state.weeklyResetDays : [0]; return d.includes(dow); }
function weeklyResetSeqItem(){
  return {refId:'weeklyreset', time:'', displayText:'', title:'📋 Weekly Reset', note:'', category:'checklist', type:'checklist',
    expanded:false, checklist:(state.weeklyResetChecklist||WEEKLY_RESET_CHECKLIST_DEFAULT).map(title=>({id:uid(), title, done:false}))};
}
function templateShowsOn(t, dow){
  if(t.hidden) return false;
  if(Array.isArray(t.repeatDays) && t.repeatDays.length && !t.repeatDays.includes(dow)) return false;
  if(t.locked==='last') return true;
  if(t.id==='mealprep') return isMealPrepDay(dow);
  const schoolDay = dow>=1 && dow<=5;
  if((t.id==='transport'||t.id==='school'||t.id==='afterschool'||t.id==='aftsmoothie') && !schoolDay) return false;
  if(t.id==='aftsmoothie' && isRugbyDay(dow)) return false;
  if(t.id==='homework' && !homeworkToday(dow)) return false;
  return true;
}
function templateRuleNote(t){
  if(t.locked==='last') return 'Always last';
  if(t.id==='mealprep') return 'Meal prep days';
  if(['transport','school','afterschool'].includes(t.id)) return 'School days only';
  if(t.id==='aftsmoothie') return 'School days, not on rugby days';
  if(t.id==='homework') return 'Wednesday and Sunday';
  return '';
}
function dayDotsHtml(fn){
  return `<span class="dd7">${DOW_ORDER_MON.map(d=>`<i class="${fn(d)?'on':''}" title="${DOW_SHORT[d]}">${DOW_SHORT[d][0]}</i>`).join('')}</span>`;
}
let routineDayFilter = null; // null = whole week, else 0-6
function setRoutineDayFilter(d){ routineDayFilter = (routineDayFilter===d) ? null : d; renderFocus(); renderSettings(); }
/* The routine as a week: every item, including the ones that only appear on some days */
function weeklyRoutineRows(active){
  const rows = [];
  const hasMealprep = active.routine.some(t=>t.id==='mealprep');
  active.routine.forEach(t=>{
    if(t.locked==='last') return;
    rows.push({kind:'t', t, days:d=>templateShowsOn(t,d)});
    if(t.id==='homework') rows.push({kind:'v', id:'weeklyreset', title:'📋 Weekly Reset', sub:'Checklist · '+(state.weeklyResetChecklist||[]).length+' items', days:d=>!t.hidden && isWeeklyResetDay(d), hold:'openWeeklyResetEdit()'});
    if(t.id==='afterschool' && isRugbyProfile()) rows.push({kind:'v', id:'rugby', title:'Rugby', sub:'Training, replaces the afternoon smoothie', days:d=>isRugbyDay(d), hold:'openRugbyEditor()'});
    if(t.id==='aftsmoothie' && !hasMealprep) rows.push({kind:'v', id:'mealprep', title:'🍱 Meal Prep', sub:'30 minutes', days:d=>isMealPrepDay(d), hold:'openMealPrepDaysEdit()'});
  });
  const last = active.routine.find(t=>t.locked==='last');
  if(last) rows.push({kind:'t', t:last, days:d=>templateShowsOn(last,d)});
  return rows;
}

function renderGoalCategoryManager(){
  openSheet(`

              <input type="text" value="${escapeHtml(c)}" style="border:none;background:transparent;font-size:15px;font-weight:500;width:100%;color:var(--text);font-family:inherit" onchange="renameGoalCategory(${i},this.value)">
            </div>
            <button class="sheet-btn" onclick="moveGoalCategory(${i},-1)">↑</button>
            <button class="sheet-btn" onclick="moveGoalCategory(${i},1)">↓</button>
            <button class="sheet-btn" style="color:var(--red)" onclick="deleteGoalCategory(${i})">Delete</button>
          </div>`).join('')}
      </div>
      <div class="field"><label>New Category</label><input type="text" id="newGoalCat" placeholder="e.g. Finance"></div>
      <button class="btn-primary" onclick="addGoalCategory()">+ Add Category</button>
    </div>
  `);
}
function renameGoalCategory(i,val){
  val=(val||'').trim(); if(!val) return;
  const old = state.goalCategories[i];
  if(old===val) return;
  state.goalCategories[i]=val;
  state.goals.forEach(g=>{ if(g.category===old) g.category=val; });
  saveState(); toast('Renamed');
}
function moveGoalCategory(i,dir){
  const n=i+dir; if(n<0||n>=state.goalCategories.length) return;
  [state.goalCategories[i],state.goalCategories[n]]=[state.goalCategories[n],state.goalCategories[i]];
  saveState(); renderGoalCategoryManager();
}
function deleteGoalCategory(i){
  if(state.goalCategories.length<=1){ toast('Keep at least one category'); return; }
  const cat = state.goalCategories[i];
  const fallback = state.goalCategories.find((c,idx)=>idx!==i);
  state.goals.forEach(g=>{ if(g.category===cat) g.category=fallback; });
  state.goalCategories.splice(i,1);
  saveState(); renderGoalCategoryManager();
}
function addGoalCategory(){
  const el=document.getElementById('newGoalCat');
  const val=(el.value||'').trim();
  if(!val) return;
  if(state.goalCategories.includes(val)){ toast('Already exists'); return; }
  state.goalCategories.push(val);
  saveState(); renderGoalCategoryManager();
}

}
function countRemindersDone(){
  return (state.reminders||[]).filter(r=>r.done).length + (state.reminders||[]).reduce((s,r)=>s+(Number(r.repeatCompletions)||0),0);

function countCompletedFocusDays(){

  (state.lifeFocuses||[]).forEach(f=>(f.days||[]).forEach(d=>{

function countRoutineRefDone(refId){

/* ---- Medal tier math ---- */
function medalTierReached(def){
  const v = def.metric();
  let reached = -1;
  for(let i=0;i<def.tiers.length;i++){ if(v>=def.tiers[i]) reached=i; }
  return reached;
}
function medalProgressInfo(def){
  const v = Math.max(0, Math.floor(def.metric())||0);
  const reached = medalTierReached(def);
  const maxed = reached === def.tiers.length-1;
  const prevThreshold = reached>=0 ? def.tiers[reached] : 0;
  const nextThreshold = maxed ? def.tiers[reached] : def.tiers[reached+1];
  const span = Math.max(1, nextThreshold - prevThreshold);
  const pct = maxed ? 100 : Math.max(0, Math.min(100, Math.round(((v-prevThreshold)/span)*100)));
  return {value:v, reached, maxed, prevThreshold, nextThreshold, pct};
}

/* ---- Weekly Present eligibility (reuses the existing week-progress data) ---- */
function computeWeeklyPresentStatus(){
  const focus = getActiveLifeFocus();
  const carry = (state.awards.weeklyPresent.carryover||[]);
  const carryTotal = carry.length, carryDone = carry.filter(c=>c.done).length;
  if(!focus) return {focusId:null, pct:0, done:carryDone, total:carryTotal, eligible:false, carryTotal, carryDone};
  let total=0, done=0;
  focus.days.forEach(d=> d.items.forEach(it=>{ total++; if(it.done) done++; }));
  // Tasks carried over from earlier weeks are added to this present's requirements.
  const fTotal = total, fDone = done;
  total += carryTotal; done += carryDone;
  return {focusId:focus.id, pct: total? Math.round(done/total*100):0, done, total, eligible: state.awards.weeklyPresent.banked ? carryDone===carryTotal : (fTotal>0 && done===total), carryTotal, carryDone};
}
/* Detects a new Life Focus week and resets the present for the new week
   without ever touching the previous week's earned rewards/history. */
function checkWeeklyPresentRollover(){
  const status = computeWeeklyPresentStatus();
  const wp = state.awards.weeklyPresent;
  if(!Array.isArray(wp.carryover)) wp.carryover = [];
  if(!Array.isArray(wp.carriedFocusIds)) wp.carriedFocusIds = [];
  if(status.focusId !== wp.focusId){
    // Week ended without the present being opened: its unfinished tasks are
    // carried over and added to the next present, so the present is never lost.
    const old = wp.focusId ? state.lifeFocuses.find(f=>f.id===wp.focusId) : null;
    if(old && !wp.opened && old.endDate < todayISO() && !wp.carriedFocusIds.includes(old.id)){
      (old.days||[]).forEach(d=>(d.items||[]).forEach(it=>{
        if(it.type==='checklist' && Array.isArray(it.checklist) && it.checklist.length){
          if(!it.checklist.every(c=>c.done)) wp.carryover.push({id:uid(), title:it.title, date:d.date, done:false});
        } else if(!it.done){
          wp.carryover.push({id:uid(), title:it.title, date:d.date, done:false});
        }
      }));
      // A fully completed week whose present was never opened stays earned.
      if(!wp.carryover.some(c=>c.date>=old.startDate && c.date<=old.endDate)) wp.banked = true;
      wp.carriedFocusIds.push(old.id);
    }
    wp.focusId = status.focusId;
    wp.opened = false;
    wp.rewardId = null;
    saveState();
    return computeWeeklyPresentStatus();
  }
  return status;
}

/* ============ MEDAL UNLOCK DETECTION + CELEBRATION ============ */
/* Compares current tier reached against the last acknowledged tier per medal.
   Only returns medals that have genuinely progressed to a new tier since the
   last time the Awards page committed an acknowledgement — so this never
   re-fires on every page view. */
function collectNewMedalUnlocks(){
  const unlocks = [];
  let changed = false;
  MEDAL_DEFS.forEach(def=>{
    const reached = medalTierReached(def);
    const ack = state.awards.medalAck.hasOwnProperty(def.key) ? state.awards.medalAck[def.key] : -1;
    if(reached > ack){
      for(let t=ack+1; t<=reached; t++) unlocks.push({def, tier:t});
      state.awards.medalAck[def.key] = reached;
      changed = true;
    }
  });
  if(changed) saveState();
  return unlocks;
}
function showMedalUnlockQueue(unlocks){
  if(!unlocks.length) return;
  const [first, ...rest] = unlocks;
  showMedalUnlockBanner(first.def, first.tier, ()=>{
    if(rest.length) showMedalUnlockQueue(rest);
  });
}

function saveRoutineItem(id){
  const t = activeRoutine().find(x=>x.id===id);
  if(!t) return;
  t.title = document.getElementById('rtTitle').value.trim();
  const val = document.getElementById('rtTime').value.trim();
  if(/^\d{1,2}:\d{2}$/.test(val)){ t.time=val; t.displayText=''; } else { t.time=''; t.displayText=val; }
  t.note = document.getElementById('rtNote').value.trim();
  t.hidden = !document.getElementById('rtHiddenToggle').classList.contains('on');
  const rd = readRoutineRepeat('rtEdit');
  if(rd) t.repeatDays = rd; else delete t.repeatDays;
  saveState(); closeSheet(); renderFocus(); renderSettings(); render(); toast('Saved');
}
function removeRoutineItem(id){
  const list = activeRoutine();
  const t = list.find(x=>x.id===id);
  if(t && t.locked==='last'){ toast('Sleep must stay the final routine item'); return; }
  getActiveProfile().routine = list.filter(t=>t.id!==id);
  saveState(); closeSheet(); renderFocus(); renderSettings(); render(); toast('Removed');
}
function moveRoutineTemplateItem(id, dir){
  const list = activeRoutine();
  const idx = list.findIndex(t=>t.id===id);
  const n = idx+dir;
  if(idx<0||n<0||n>=list.length) return;
  if(list[idx].locked==='last' || list[n].locked==='last') return; // Sleep stays last
  [list[idx],list[n]] = [list[n],list[idx]];
  saveState(); renderFocus(); renderSettings();
}

/* Saves LifeOS.html: this exact app with the given data built in. Opening that
   file (even offline, after closing everything) loads that data. */
function buildAppHtmlWithData(data){
  const shell = window.__LIFEOS_SHELL, main = document.getElementById('lifeos-main');
  if(!shell || !main) return null;
  const json = JSON.stringify(data).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  let code = main.textContent;
  code = code.replace(/^const BACKUP_DATA = .*$/m, ()=>'const BACKUP_DATA = '+json+';')
             .replace(/^const BACKUP_DATA_AT = .*$/m, ()=>'const BACKUP_DATA_AT = '+Date.now()+'; // when the data above was built into this file (0 = only used on a brand-new device)');
  const cut = shell.lastIndexOf('</body>');
  if(cut<0) return null;
  return '<!DOCTYPE html>\n'+shell.slice(0,cut)+'<script id="lifeos-main">'+code+'<\/script>\n</body></html>';
}
function downloadAppWithData(data){
  try{
    const html = buildAppHtmlWithData(data || state); if(!html) return false;
    const url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
    const a = document.createElement('a'); a.href = url; a.download = 'LifeOS.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ console.error(e); return false; }
}

function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      state = Object.assign(defaultState(), imported);
      saveState();
      applyAppearance();
      render();
      const ok = downloadAppWithData(imported);
      toast(ok ? 'Imported. Saved a copy of the app with this data built in' : 'Import successful');
    }catch(err){ toast('Invalid file'); }
  };
  reader.readAsText(file);
}
/* Additive-only merge of another LifeOS backup file's historical records
   (Life Focus days, Ecommerce Focus days, Daily Reviews) into the CURRENT
   state, for Previous Days to be able to show more history than just what's
   in the live app right now. Unlike Import Data, this never replaces or
   overwrites anything — a focus already present (matched by id) or a daily
   review already present (matched by date) is left untouched, and nothing
   outside these three fields is ever touched. */
function mergeBackupFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const other = JSON.parse(e.target.result);
      let addedFocuses=0, addedEcom=0, addedReviews=0;
      (other.lifeFocuses||[]).forEach(f=>{
        if(!state.lifeFocuses.some(x=>x.id===f.id)){ state.lifeFocuses.push(f); addedFocuses++; }
      });
      (other.ecommerceFocuses||[]).forEach(f=>{
        if(!state.ecommerceFocuses.some(x=>x.id===f.id)){ state.ecommerceFocuses.push(f); addedEcom++; }
      });
      if(other.dailyReviews){
        if(!state.dailyReviews) state.dailyReviews={};
        Object.keys(other.dailyReviews).forEach(dateKey=>{
          if(!state.dailyReviews[dateKey]){ state.dailyReviews[dateKey]=other.dailyReviews[dateKey]; addedReviews++; }
        });
      }
      saveState();
      toast(`Merged ${addedFocuses+addedEcom} focus week(s), ${addedReviews} review(s)`);
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
}

  g.progression = document.getElementById('gymProgression').value.trim();

/* ---------- date helpers (all LOCAL time; never toISOString) ---------- */
function parseISOLocal(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
/* "Monday, 12 October 2026" */
function fmtDayDate(dateStr){
  if(!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr||'';
  const d = parseISOLocal(dateStr);
  return DAY_NAMES[d.getDay()]+', '+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear();
}
/* "12 Oct" or "12 Oct 2027" */
function fmtDM(dateStr, withYear){
  const d = parseISOLocal(dateStr);
  return d.getDate()+' '+MON3[d.getMonth()]+(withYear?' '+d.getFullYear():'');
}
function addMonthsISO(s, n){
  const p = s.split('-').map(Number);
  const t = new Date(p[0], p[1]-1+n, 1);
  const dim = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(p[2], dim));
  return isoDate(t);
}
function daysBetween(a, b){
  const x = a.split('-').map(Number), y = b.split('-').map(Number);
  return Math.round((Date.UTC(y[0],y[1]-1,y[2]) - Date.UTC(x[0],x[1]-1,x[2]))/86400000);
}
function dowOf(dateStr){ return parseISOLocal(dateStr).getDay(); }

/* LifeOS 2.0 round 3 — one-time, additive migration.
   Adds the Bulking lunch task, seeds the bedtime steps, switches to the School
   routine and makes sure a Life Focus and Ecommerce Focus cover today on that
   routine. A full copy of your data is saved first (localStorage key
   "lifeos-before-v3") so this can always be undone. */
function migrateV3(){
  if(!state || state.v3Applied) return;
  try{ localStorage.setItem('lifeos-before-v3', JSON.stringify(state)); }catch(e){}
  state.v3Applied = true;
  const today = todayISO();
  const mkLunch = ()=>({refId:'lunch', id:uid(), order:0, time:'12:45', displayText:'', title:'🥪Lunch', note:'', category:'meal', done:false, type:'item', expanded:false});

  // 1) Lunch in every routine profile
  (state.profiles||[]).forEach(p=>{
    if(!Array.isArray(p.routine) || p.routine.some(t=>t.id==='lunch')) return;
    let idx = p.routine.findIndex(t=>t.time && t.time>'12:45' && t.locked!=='last' && t.id!=='sleep');
    if(idx===-1){ idx = p.routine.findIndex(t=>t.locked==='last' || t.id==='sleep'); if(idx===-1) idx = p.routine.length; }
    p.routine.splice(idx,0,{hidden:false, id:'lunch', time:'12:45', displayText:'', title:'🥪Lunch', note:'', category:'meal'});
  });

  // 2) Back to the School routine
  if((state.profiles||[]).some(p=>p.id==='school')) state.activeProfileId = 'school';

  // 3) Lunch + bedtime steps in every upcoming Life Focus day
  (state.lifeFocuses||[]).forEach(f=>(f.days||[]).forEach(day=>{
    if(day.date < today) return;
    if(!day.items.some(i=>i.refId==='lunch')) insertItemByTime(day, mkLunch());
  }));

  // 4) Life Focus covering today: rebuild today onward from the School routine, keeping what you've entered
  const KEEP = ['id','done','note','skillId','subChecklist','checklist','merged','mergedOpen','expanded','req','carriedFrom','duration'];
  const covers = f=>f.startDate<=today && f.endDate>=today;
  const knownRefs = new Set((state.profiles||[]).flatMap(p=>(p.routine||[]).map(t=>t.id)).concat(['mealprep','rugby','weeklyreset']));
  let lf = (state.lifeFocuses||[]).find(f=>f.id===state.activeLifeFocusId && covers(f)) || (state.lifeFocuses||[]).find(covers);
  if(lf){
    lf.days.forEach(day=>{
      if(day.date < today) return;
      const fresh = buildLifeFocusDayItems(day.date), old = day.items.filter(i=>i.category!=='ecommerce');
      fresh.forEach(n=>{ const o = old.find(x=>x.refId===n.refId); if(o) KEEP.forEach(k=>{ if(o[k]!==undefined) n[k]=o[k]; }); });
      const custom = old.filter(o=>!fresh.some(n=>n.refId===o.refId) && (!o.refId || !knownRefs.has(o.refId)));
      const eco = day.items.filter(i=>i.category==='ecommerce');
      day.items = fresh.concat(eco); custom.forEach(c=>insertItemByTime(day,c));
      day.items.forEach((i,idx)=>i.order=idx);
    });
    state.activeLifeFocusId = lf.id;
  } else {
    const d = new Date(today+'T00:00:00'), add = d.getDay()===0 ? 7 : 7-d.getDay();
    const end = isoDate(new Date(d.getFullYear(), d.getMonth(), d.getDate()+add));
    lf = {id:uid(), name:'School Week', description:'', startDate:today, endDate:end, days:generateLifeFocusDays(today,end)};
    state.lifeFocuses.push(lf); state.activeLifeFocusId = lf.id;
  }

  // 5) Ecommerce Focus covering today: keep your daily notes, align timing to School; otherwise create one
  const ef = (state.ecommerceFocuses||[]).find(f=>f.id===state.activeEcommerceFocusId && covers(f)) || (state.ecommerceFocuses||[]).find(covers);
  if(ef){
    const tpl = (state.profiles.find(p=>p.id==='school')||{routine:[]}).routine.find(t=>t.id==='ecommerce');
    if(tpl) ef.days.forEach(day=>{ if(day.date>=today) day.items.forEach(i=>{ if(i.category==='ecommerce'){ i.time = tpl.time||''; i.displayText = tpl.displayText||''; } }); });
    state.activeEcommerceFocusId = ef.id;
  } else {
    const end = lf.endDate;
    const nf = {id:uid(), name:'School Week', description:'', startDate:today, endDate:end, days:generateEcommerceFocusDays(today,end)};
    state.ecommerceFocuses.push(nf); state.activeEcommerceFocusId = nf.id;
  }
  saveState();
}

/* =====================  3. SCHEDULED SCHEDULE SWITCHING  ===================== */
/* Applies every switch whose date has arrived (latest wins), then removes
   those switches. Manual switching still works any time. Returns true if the
   active profile changed. */
function applyScheduledSwitches(){
  if(!state || !Array.isArray(state.scheduledSwitches) || !state.scheduledSwitches.length) return false;
  const today = todayISO();
  const due = state.scheduledSwitches.filter(s=>s.date<=today).sort((a,b)=>a.date.localeCompare(b.date));
  if(!due.length) return false;
  state.scheduledSwitches = state.scheduledSwitches.filter(s=>s.date>today);
  const valid = due.filter(s=>state.profiles.some(p=>p.id===s.profileId));
  const last = valid[valid.length-1];
  let changed = false;
  if(last && state.activeProfileId!==last.profileId){
    state.activeProfileId = last.profileId;
    changed = true;
    const p = getActiveProfile();
    setTimeout(()=>toast('Switched to '+p.icon+' '+p.label), 400);
  }
  saveState();
  return changed;
}
setInterval(()=>{ if(applyScheduledSwitches()) render(); }, 60000);

/* ---- Reminders: repeat = {type:'daily'|'weekdays'|'weekly'|'days'|'every', days:[0-6], every:n, unit:'day'|'week'|'month'} ---- */
function repeatSummary(rp){
  if(!rp) return '';
  switch(rp.type){
    case 'daily': return 'Every day';
    case 'weekdays': return 'Weekdays';
    case 'weekly': return 'Weekly';
    case 'days': return (rp.days&&rp.days.length) ? DOW_ORDER_MON.filter(d=>rp.days.includes(d)).map(d=>DOW_SHORT[d]).join(', ') : 'Every day';
    case 'every': return 'Every '+(rp.every>1? rp.every+' ':'')+rp.unit+(rp.every>1?'s':'');
  }
  return '';
}
function nextRepeatDate(dateStr, rp){
  switch(rp.type){
    case 'daily': return addDaysISO(dateStr,1);
    case 'weekdays': { let d=addDaysISO(dateStr,1); while([0,6].includes(dowOf(d))) d=addDaysISO(d,1); return d; }
    case 'weekly': return addDaysISO(dateStr,7);
    case 'days': {
      const days = (rp.days||[]).map(Number);
      if(!days.length) return addDaysISO(dateStr,1);
      let d=addDaysISO(dateStr,1), g=0;
      while(!days.includes(dowOf(d)) && g++<14) d=addDaysISO(d,1);
      return d;
    }
    case 'every': {
      const n = Math.max(1, parseInt(rp.every,10)||1);
      if(rp.unit==='month') return addMonthsISO(dateStr,n);
      return addDaysISO(dateStr, rp.unit==='week'? n*7 : n);
    }
  }
  return addDaysISO(dateStr,1);
}
/* Completing a repeating reminder rolls it forward to its next future date
   (never into the past) instead of leaving it permanently done. */
function advanceRecurringReminder(r){
  const today = todayISO();
  let next = nextRepeatDate(r.date||today, r.repeat), g=0;
  while(next<=today && g++<800) next = nextRepeatDate(next, r.repeat);
  r.date = next;
  r.done = false;
  r.repeatCompletions = (r.repeatCompletions||0)+1;
  r.lastCompletedDate = today;
  return next;
}

/* =====================  1. ROADMAP  ===================== */
function getActiveRoadmap(){
  return (state.roadmaps||[]).find(r=>r.id===state.activeRoadmapId) || null;
}
function rmFreqLabel(every, unit){
  if(every===1) return unit==='week' ? 'Weekly' : 'Monthly';
  return 'Every '+every+' '+unit+'s';
}
function rmEndFromTimeframe(start, n, unit){
  let endExclusive;
  if(unit==='day') endExclusive = addDaysISO(start, n);
  else if(unit==='week') endExclusive = addDaysISO(start, n*7);
  else if(unit==='month') endExclusive = addMonthsISO(start, n);
  else endExclusive = addMonthsISO(start, n*12);
  return addDaysISO(endExclusive, -1);
}
function rmGenerateCheckpoints(start, end, every, unit){
  const cps = [];
  const at = k => unit==='week' ? addDaysISO(start, k*every*7) : addMonthsISO(start, k*every);
  for(let k=0; k<500; k++){
    const s = at(k);
    if(s>end) break;
    let e = addDaysISO(at(k+1), -1);
    if(e>end) e = end;
    cps.push({id:uid(), startDate:s, endDate:e, label:'', goals:[], notes:''});
  }
  return cps;
}
function rmCurrentCheckpoint(rm){
  const today = todayISO();
  const idx = rm.checkpoints.findIndex(c=>today>=c.startDate && today<=c.endDate);
  if(idx>-1) return {status:'active', index:idx, cp:rm.checkpoints[idx]};
  if(today<rm.startDate) return {status:'upcoming', index:0, cp:rm.checkpoints[0]||null};
  return {status:'finished', index:rm.checkpoints.length-1, cp:rm.checkpoints[rm.checkpoints.length-1]||null};
}
function rmProgressPct(rm){
  const total = daysBetween(rm.startDate, rm.endDate)+1;
  const elapsed = daysBetween(rm.startDate, todayISO())+1;
  return Math.max(0, Math.min(100, Math.round(elapsed/total*100)));
}
function ageOn(birthISO, dateISO){
  const b=new Date(birthISO+'T00:00:00'), d=new Date(dateISO+'T00:00:00');
  let a=d.getFullYear()-b.getFullYear();
  if(d.getMonth()<b.getMonth() || (d.getMonth()===b.getMonth() && d.getDate()<b.getDate())) a--;
  return a;
}
function rmCpAge(rm, cp){
  if(!rm || !rm.birthday || !cp) return '';
  const a=ageOn(rm.birthday, cp.startDate), b=ageOn(rm.birthday, cp.endDate);
  return a===b ? 'Age '+a : 'Age '+a+'–'+b;
}
function dayDelta(a,b){ return Math.round((Date.parse(b+'T00:00:00')-Date.parse(a+'T00:00:00'))/86400000); }
function rmCpTitle(cp, i){
  return cp.label ? cp.label : 'Checkpoint '+(i+1);
}
function rmCpRange(cp){
  const sameYear = cp.startDate.slice(0,4)===cp.endDate.slice(0,4);
  return fmtDM(cp.startDate, !sameYear)+' – '+fmtDM(cp.endDate, true);
}

function rmPreset(n, unit, every, everyUnit){
  document.getElementById('rmLenN').value = n;
  document.getElementById('rmLenUnit').value = unit;
  rmSetEvery(every, everyUnit);
}
function rmSetEvery(n, unit){
  document.getElementById('rmEveryN').value = n;
  document.getElementById('rmEveryUnit').value = unit;
  rmUpdatePreview();
}
function rmReadForm(){
  const start = document.getElementById('rmStart').value;
  const n = Math.max(1, parseInt(document.getElementById('rmLenN').value,10)||0);
  const unit = document.getElementById('rmLenUnit').value;
  const every = Math.max(1, parseInt(document.getElementById('rmEveryN').value,10)||0);
  const everyUnit = document.getElementById('rmEveryUnit').value;
  if(!start || !n || !every) return null;
  const end = rmEndFromTimeframe(start, n, unit);
  const cps = rmGenerateCheckpoints(start, end, every, everyUnit);
  return {start, end, every, everyUnit, cps};
}
function rmUpdatePreview(){
  const el = document.getElementById('rmPreview');
  if(!el) return;
  const f = rmReadForm();
  el.textContent = f ? (f.cps.length+' checkpoint'+(f.cps.length===1?'':'s')+' · '+fmtDM(f.start,true)+' → '+fmtDM(f.end,true)) : '';
}
function createRoadmap(){
  const name = document.getElementById('rmName').value.trim();
  if(!name){ toast('Enter a name'); return; }
  const f = rmReadForm();
  if(!f){ toast('Check the dates and numbers'); return; }
  if(f.cps.length>=500){ toast('Too many checkpoints — use a longer interval'); return; }
  const rm = {
    id: uid(), name, description: document.getElementById('rmDesc').value.trim(),
    startDate: f.start, endDate: f.end, every: f.every, everyUnit: f.everyUnit,
    checkpoints: f.cps, createdAt: Date.now()
  };
  state.roadmaps.push(rm);
  if(!state.activeRoadmapId) state.activeRoadmapId = rm.id;
  saveState(); closeSheet(); renderGoals(); render(); toast('Roadmap created');
}

function deleteRoadmap(id){

function addRoadmapCheckpoint(rid){
  const rm=state.roadmaps.find(r=>r.id===rid); if(!rm) return;
  const last=rm.checkpoints[rm.checkpoints.length-1];
  const len = last ? daysBetween(last.startDate,last.endDate)+1 : 7;
  const s = last ? addDaysISO(last.endDate,1) : rm.startDate;
  const e = addDaysISO(s,len-1);
  rm.checkpoints.push({id:uid(), label:'', startDate:s, endDate:e, goals:[], notes:''});
  if(e>rm.endDate) rm.endDate=e;
  saveState(); renderGoals(); render(); openRoadmapDetail(rid); toast('Checkpoint added');
}

function saveRoadmapEdit(id){
  const rm = state.roadmaps.find(r=>r.id===id);
  if(!rm) return;
  const name = document.getElementById('rmEditName').value.trim();
  if(!name){ toast('Enter a name'); return; }
  const s = document.getElementById('rmEditStart').value;
  const e = document.getElementById('rmEditEnd').value;
  const b = document.getElementById('rmEditBday').value;
  if(!s || !e || e<s){ toast('Check the dates'); return; }
  snap();
  rm.name = name;
  rm.description = document.getElementById('rmEditDesc').value.trim();
  rm.birthday = b || undefined;
  const oldEnd = rm.endDate;
  if(s!==rm.startDate){
    const d = dayDelta(rm.startDate, s);
    rm.checkpoints.forEach(c=>{ c.startDate=addDaysISO(c.startDate,d); c.endDate=addDaysISO(c.endDate,d); });
    rm.startDate = s;
    rm.endDate = addDaysISO(oldEnd,d);
  }
  if(e!==oldEnd){
    rm.endDate = e;
    const last = rm.checkpoints[rm.checkpoints.length-1];
    if(last) last.endDate = e;
  }
  saveState(); renderGoals(); render(); openRoadmapDetail(id); undoToast('Roadmap saved');
}

      <div class="field"><button class="btn-danger" onclick="deleteCheckpoint('${rid}','${cid}')">Delete checkpoint</button></div>
    </div>`);
}
function setCheckpointDate(rid, cid, field, val){
  const cp = getCheckpoint(rid,cid); const rm = state.roadmaps.find(r=>r.id===rid); if(!cp||!rm||!val) return;
  if(field==='endDate' && val<cp.startDate){ toast('End must be after start'); openCheckpointEditor(rid,cid); return; }
  if(field==='startDate' && val>cp.endDate){ toast('Start must be before end'); openCheckpointEditor(rid,cid); return; }
  cp[field]=val;
  if(field==='endDate' && val>rm.endDate) rm.endDate=val;
  saveState(); renderGoals(); render(); openCheckpointEditor(rid,cid);
}
function renameCheckpointGoal(rid, cid, gid){
  const cp = getCheckpoint(rid,cid); const g = cp && cp.goals.find(x=>x.id===gid); if(!g) return;
  uiPrompt('Rename goal', g.title).then(v=>{
    if(v===null || !v.trim()) return;
    g.title = v.trim(); saveState(); render(); openCheckpointEditor(rid,cid);

function deleteCheckpoint(rid, cid){
  const rm = state.roadmaps.find(r=>r.id===rid); if(!rm) return;
  uiConfirm('Delete this checkpoint and its goals?').then(ok=>{

    snap();
    rm.checkpoints = rm.checkpoints.filter(c=>c.id!==cid);
    saveState(); renderGoals(); render(); undoToast('Checkpoint deleted'); openRoadmapDetail(rid);
  });
}
function getCheckpoint(rid, cid){
  const rm = state.roadmaps.find(r=>r.id===rid);
  return rm ? rm.checkpoints.find(c=>c.id===cid) : null;
}
function saveCheckpointField(rid, cid, field, val){
  const cp = getCheckpoint(rid,cid); if(!cp) return;

function addCheckpointGoal(rid, cid){

function toggleCheckpointGoal(rid, cid, gid, reopen){

function deleteCheckpointGoal(rid, cid, gid){

/* =====================  6. GLOBAL SEARCH  ===================== */
let gsResults = [];
function openGlobalSearch(){
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Close</button><h2>Search</h2><span style="width:40px"></span></div>
    <div class="sheet-body">
      <div class="search-bar" style="margin:0 0 12px"><span>🔍</span><input type="text" id="gsInput" placeholder="Search LifeOS" autocomplete="off" autocapitalize="off" oninput="runGlobalSearch(this.value)"></div>
      <div id="gsResults"></div>
    </div>`);
  runGlobalSearch('');
  setTimeout(()=>{ const i=document.getElementById('gsInput'); if(i) i.focus(); }, 60);
}
function gsSnippet(text, tokens){
  const t = String(text||'').replace(/\s+/g,' ').trim();
  if(!t) return '';
  const low = t.toLowerCase();
  let at = -1;
  for(const k of tokens){ const i = low.indexOf(k); if(i>-1 && (at<0 || i<at)) at = i; }
  if(at<0) return t.slice(0,70);
  const s = Math.max(0, at-25);
  return (s>0?'…':'')+t.slice(s, s+80)+(s+80<t.length?'…':'');
}
function collectSearchResults(q){
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  const hit = (...fields)=>{ const h = fields.map(f=>String(f||'')).join(' \n ').toLowerCase(); return tokens.every(t=>h.includes(t)); };
  const add = (type, icon, title, sub, go)=> out.push({type, icon, title: title||'(untitled)', sub: sub||'', go});

  (state.notes||[]).forEach(n=>{ if(hit(n.title,n.body,n.category)) add('Note','📝',n.title||'Untitled',(n.category||UNCAT)+' · '+gsSnippet(n.body,tokens),()=>gsGoNote(n.id)); });
  (state.reminders||[]).forEach(r=>{ if(hit(r.title,r.notes,r.category)) add('Reminder','🔔',r.title,[r.date?fmtDM(r.date,true):'',r.category,r.done?'Done':'',r.repeat?'🔄 '+repeatSummary(r.repeat):''].filter(Boolean).join(' · '),()=>gsGoReminder(r.id)); });
  (state.profiles||[]).forEach(p=>(p.routine||[]).forEach(t=>{ if(hit(t.title,t.note)) add('Routine','📅',t.title,p.icon+' '+p.label+(t.note?' · '+gsSnippet(t.note,tokens):''),()=>gsGoRoutine(p.id,t.id)); }));
  (state.lifeFocuses||[]).forEach(f=>{
    if(hit(f.name,f.description)) add('Life Focus','🎯',f.name,fmtDM(f.startDate,true)+' → '+fmtDM(f.endDate,true),()=>gsGoLife(f.id));
    (f.days||[]).forEach(d=>{ if(d.note && hit(d.note)) add('Life Focus Day','🎯',fmtDayDate(d.date),f.name+' · '+gsSnippet(d.note,tokens),()=>gsGoFocusDay(f.id,d.date,false)); });
  });
  (state.ecommerceFocuses||[]).forEach(f=>{
    if(hit(f.name,f.description)) add('Ecom Focus','💼',f.name,fmtDM(f.startDate,true)+' → '+fmtDM(f.endDate,true),()=>gsGoEcom(f.id));
    (f.days||[]).forEach(d=>{ if(d.note && hit(d.note)) add('Ecom Focus Day','💼',fmtDayDate(d.date),f.name+' · '+gsSnippet(d.note,tokens),()=>gsGoFocusDay(f.id,d.date,true)); });
  });
  (state.roadmaps||[]).forEach(rm=>{
    if(hit(rm.name,rm.description)) add('Roadmap','🗺️',rm.name,fmtDM(rm.startDate,true)+' → '+fmtDM(rm.endDate,true),()=>gsGoRoadmap(rm.id,null));
    rm.checkpoints.forEach((cp,i)=>{
      const gtxt = cp.goals.map(g=>g.title).join(' ');
      if(hit(cp.label,cp.notes,gtxt)) add('Roadmap Checkpoint','🗺️',rmCpTitle(cp,i),rm.name+' · '+gsSnippet(gtxt||cp.notes,tokens),()=>gsGoRoadmap(rm.id,cp.id));
    });
  });

function fmtMins(m){ m=Math.round(m||0); if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+'h'+(r?' '+r+'m':''); }
function fmtClock(ms){
  const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  const mm = h? String(m).padStart(2,'0') : String(m).padStart(2,'0');
  return (h? h+':' : '')+mm+':'+String(sec).padStart(2,'0');
}

function cloneItem(x){ return JSON.parse(JSON.stringify(x)); }
function insertItemByTime(day, it){
  let idx=-1;
  if(it.time) idx=day.items.findIndex(x=>x.time && x.time>it.time && x.refId!=='sleep' && x.locked!=='last');
  if(idx===-1){ const s=day.items.findIndex(x=>x.refId==='sleep'||x.locked==='last'); idx = s>-1 ? s : day.items.length; }
  day.items.splice(idx,0,it);
  day.items.forEach((x,i)=>{ x.order=i; });
}
function findItemLocation(focusId,date,itemId){
  const f=findAnyFocus(focusId); if(!f) return null;
  const day=f.days.find(d=>d.date===date); if(!day) return null;
  const idx=day.items.findIndex(i=>i.id===itemId); if(idx<0) return null;
  return {focus:f, day, idx, item:day.items[idx]};
}

function moveItemToNextDay(focusId,date,itemId){
  snap();
  const loc=findItemLocation(focusId,date,itemId); if(!loc) return;
  const next=addDaysISO(date,1);
  const pool = isEcommerceFocusId(focusId) ? state.ecommerceFocuses : state.lifeFocuses;
  const tf=[loc.focus].concat(pool.filter(f=>f!==loc.focus)).find(f=>f.days.some(d=>d.date===next));
  const item=loc.item;
  if(!tf){
    if(!Array.isArray(state.reminders)) state.reminders=[];
    state.reminders.push({id:uid(), title:item.title.replace(/^\s+/,''), category:'Personal', priority:'Medium', date:next, time:'', notes:'Carried over from routine ('+fmtDayDate(date)+')', done:false});
    loc.day.items.splice(loc.idx,1);
    saveState(); closeSheet(); render();
    undoToast("No routine for tomorrow yet — added as a reminder");
    return;
  }
  const nd=tf.days.find(d=>d.date===next);
  const moved=cloneItem(item);
  moved.done=false; moved.expanded=false; moved.carriedFrom=item.carriedFrom||date;
  (moved.subChecklist||[]).forEach(c=>{ c.done=false; });
  (moved.checklist||[]).forEach(c=>{ c.done=false; });
  (moved.merged||[]).forEach(m=>{ m.done=false; });
  // Keep it in the same place in tomorrow's routine: right after whatever came before it today.
  let placed=false;
  for(let k=loc.idx-1; k>=0 && !placed; k--){
    const anchor = loc.day.items[k];
    const at = nd.items.findIndex(x=>x.refId && x.refId===anchor.refId && x.refId!=='custom');
    if(at>-1){ nd.items.splice(at+1,0,moved); nd.items.forEach((x,i)=>{x.order=i;}); placed=true; }
  }
  if(!placed) insertItemByTime(nd, moved);
  loc.day.items.splice(loc.idx,1);
  saveState(); closeSheet(); render();
  undoToast('Moved to tomorrow');
}

let stepsDraft = null;

function renderStepsEditor(){
  const D = stepsDraft; if(!D) return;
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Cancel</button><h2>Checklist steps</h2><button class="sheet-btn bold" onclick="saveStepsEditor()">Save</button></div>

        <div class="se-row">

          <button type="button" class="re-ico" ${i===0?'disabled':''} onclick="stepsMove(${i},-1)" aria-label="Move up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>

function stepsMove(i,dir){ const L=stepsDraft.list, n=i+dir; if(n<0||n>=L.length) return; [L[i],L[n]]=[L[n],L[i]]; renderStepsEditor(); }
function saveStepsEditor(){
  const D = stepsDraft; if(!D) return;
  document.querySelectorAll('.se-row input').forEach((inp,i)=>{ if(D.list[i]) D.list[i].title = inp.value; });
