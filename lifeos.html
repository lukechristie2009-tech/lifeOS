 remember\n* Log into the registrar account\n* Check the domain’s expiry/renewal date\n* Make sure auto-renewal is ON if I want to keep the domain\n* Confirm the domain is registered under an email address I can access\n* Save the registrar login details somewhere safe\n* Check whether the domain is currently connected to Shopify\n* Do NOT cancel/delete the domain\n\nThe registrar is the company that actually manages the domain registration. DNS hosting can be a different company, so don’t assume they’re the same thing. (Microsoft Learn)\n\n2. Shopify Store\n\n* Check for any outstanding Shopify balance\n* Cancel Shopify subscription\n* Cancel any paid Shopify apps\n* Cancel AutoDS or other connected services\n* Cancel any other subscriptions that were only being used for the store\n* Export/save important store information\n* Download product images/videos I may want later\n* Save product descriptions\n* Save ad creatives\n* Save Meta Ads data/results\n* Save pixel/ad account information\n* Save customer/order information if legally appropriate and needed\n* Confirm there are no outstanding orders\n* Confirm there are no refunds that still need processing\n\n3. Domain + DNS\n\n* Confirm registrar\n* Confirm expiry date\n* Confirm renewal price\n* Confirm auto-renewal\n* Screenshot/save the domain settings\n* Record where the DNS is hosted\n* Remove Shopify DNS records only if they’re no longer needed\n* Keep the domain itself active\n\n4. Payments\n\n* Check Shopify Payments/other payment processor\n* Check for pending payouts\n* Check for outstanding charges\n* Check PayPal/other payment accounts\n* Remove payment methods from services I no longer use\n\n5. Advertising\n\n* Pause all Meta ads\n* Confirm campaigns are actually OFF\n* Save campaign results\n* Save winning creatives\n* Save audiences/settings that may be useful later\n* Keep the Meta Business/ad account if I may use it again\n* Don’t delete the pixel unless there’s a specific reason\n\n6. Keep For Future Relaunch\n\n* Domain\n* Brand name\n* Logo\n* Product research\n* Winning ad creatives\n* Product photos/videos\n* Store copy\n* Meta ad account\n* Pixel/data\n* Supplier information\n* Customer/order information where appropriate\n* Business notes\n* Lessons from the first attempt\n\n7. Final Shutdown\n\n* Confirm Shopify subscription is cancelled\n* Confirm paid apps are cancelled\n* Confirm no unexpected recurring charges remain\n* Confirm domain is still active\n* Confirm domain auto-renewal is enabled\n* Confirm I can still access the domain registrar\n* Save all important files/data\n* Screenshot final account/billing status\n* Check bank account for any remaining recurring charges\n\n🚨 Most Important\n\nDO NOT cancel the domain until you’ve identified the registrar and confirmed you can access the account.\n\nThe domain is worth keeping because you can shut the Shopify store down now and potentially build another store/site on the exact same domain later.","updatedAt":1787554243269,"category":"Business & Ecom"},{"id":"papx9f4v","title":"Secret banana bread","body":"🍌🍫 Protein Chocolate Banana Bread\n\nIngredients\n\n* 3 very ripe bananas\n* 2 eggs\n* 70 g butter\n* 1 tsp vanilla extract\n* 240 ml plain flour\n* 30 g chocolate protein powder\n* 1 tsp baking soda\n* 1 tsp cinnamon\n* 60 g chocolate chips\n* 60–80 ml milk\n* Baking paper\n* A little butter for greasing\n\nNo added sugar and no salt.\n\n⸻\n\n🕐 0:00 | Preheat oven\n\n* Set oven to 180°C, or 170°C fan bake.\n* Get your loaf tin and baking paper out.\n\n🕐 0:02 | Prepare the tin\n\n* Lightly butter the loaf tin.\n* Line it with baking paper, leaving some hanging over the sides.\n* Put the butter wrapper and scraps straight in the bin.\n\n🕐 0:05 | Mash bananas\n\n* Put the 3 bananas into a large mixing bowl.\n* Mash thoroughly with a fork until mostly smooth.\n\n🕐 0:08 | Add wet ingredients\n\nAdd:\n\n* 2 eggs\n* 70 g melted butter\n* 1 tsp vanilla\n\nMix until combined.\n\n🧽 0:10 | Quick clean\n\nWhile the melted butter cools slightly:\n\n* Put banana peels in the bin.\n* Put the fork in the sink.\n* Put the butter away.\n* Put the eggs/milk back in the fridge.\n* Wipe any spills off the bench.\n\n🕐 0:12 | Add dry ingredients\n\nAdd:\n\n* 240 ml plain flour\n* 30 g chocolate protein powder\n* 1 tsp baking soda\n* 1 tsp cinnamon\n\nGently fold/stir until just combined.\n\nDon’t beat the shit out of it. Stop as soon as the dry flour disappears.\n\n🕐 0:15 | Add milk + chocolate\n\nStart with 60 ml milk.\n\nFold it through.\n\nThe batter should be thick but easily spoonable, not like dough.\n\nIf it’s still really thick, add another 10–20 ml milk.\n\nThen fold in:\n\n* 60 g chocolate chips\n\nSave a small handful to sprinkle over the top if you want.\n\n🕐 0:18 | Into the tin\n\n* Pour the batter into the lined loaf tin.\n* Spread it evenly.\n* Sprinkle the extra chocolate chips over the top.\n* Put it straight into the oven.\n\n🧽 0:19–0:25 | Clean the kitchen\n\nWhile it starts baking:\n\n1. Put the mixing bowl in the sink.\n2. Wash the fork.\n3. Wash measuring cups/spoons.\n4. Wash the spatula.\n5. Wash the knife if you used one.\n6. Wipe the bench.\n7. Clean up any flour or batter.\n8. Put ingredients away.\n9. Put scraps in the bin.\n10. Leave the kitchen completely clean.\n\nYou should be finished with the hands-on work in ~20–25 minutes.\n\n🔥 45–55 min | Bake\n\nBake at:\n\n180°C conventional / 170°C fan\n\nStart checking around 45 minutes.\n\nStick a skewer or knife into the centre.\n\nYou want:\n\n* A few moist crumbs = perfect\n* Wet batter = needs longer\n* Completely dry = probably overbaked\n\nIf the top is getting very dark but the middle isn’t done, loosely cover the top with foil.\n\n❄️ After baking\n\n* Leave it in the tin for 10–15 minutes.\n* Lift it out using the baking paper.\n* Let it cool before slicing.\n* Once cool, cut it into two halves if you’re doing half a loaf per lunch.\n* Store in airtight containers.\n\nThe key changes from your last one\n\n70 g butter + 240 ml flour + 60–80 ml milk + 60 g chocolate chips should give you a noticeably softer, less compact loaf than the one you just made.\n\nAnd because you’re not adding sugar, the very ripe bananas + chocolate chips will provide most of the sweetness.\n    Calories: ~1,950 kcal\n* Protein: ~65 g\n* Carbs: ~270 g\n* Fat: ~75 g\n\nIf you eat ½ loaf per lunch\n\n* Calories: ~975 kcal\n* Protein: ~32–33 g\n* Carbs: ~135 g\n* Fat: ~37–38 g","updatedAt":1788336822134,"category":"Food & Nutrition"},{"id":"eumbdwdt","title":"Branded Ecom brainstorm","body":"🧠 ECOM BRAINSTORM\n\n🏭 Supplier\n\n* Find product on Alibaba\n* Message 5–10 suppliers\n* Ask price, MOQ, shipping + samples\n* Ask about custom branding\n* Compare suppliers\n* Order sample\n* Test product\n* Start small, scale if it sells\n\n📧 Email Marketing\n\nKEY FOCUS\n\n* Collect emails from day 1\n* Welcome flow\n* Abandoned cart\n* Browse abandonment\n* Post-purchase\n* Promotions\n* Build email list → repeat customers\n\n🛒 Brand\n\n* Product\n* Name + logo\n* Packaging\n* Store\n* UGC / content\n* Social proof\n\n📈 Growth\n\n* Meta Ads\n* Shop Campaign Ads\n* Organic content\n* Retargeting\n* Email → repeat sales\n* Scale winners","updatedAt":1788919634917,"category":"Business & Ecom"},{"id":"4ztneug6","title":"Google review customers","body":"GOOGLE REVIEW CARD TARGETS\n\nORIGINAL TARGET LIST\n1. Waves Hair Studio\n2. Treasure Sumner Nail Spa\n3. Renaissance\n4. Body Care\n5. Black Suede House of Hair\n6. Ali Barbers Hair Stylist\n7. The Port Hills Barbershop\n8. Bayside Barbers\n9. Niche Coffee + Eatery\n10. Bohemian Bakery Sumner\n11. Upshot Coffee / Roastery\n12. Sumner Beach Store Café\n13. The Emporium Eatery\n14. Joe’s Garage Sumner\n15. Coffee Culture Sumner\n16. Back Door Spa\n17. Bamboozle\n18. Clean Car Collective\n19. Espresso Hand Car Wash & Detailing - BACK ON TUESDAY FOR MANAGER\n20. 369 Car Wash & Detailing\n21. The Wizard’s Retreat\n22. Frances Nation\n\nALREADY VISITED / DONE\nNoodle Union | Ferry Road, next to Bonu Burger | DONE\n  Notes on pitch/outcome: They couldn’t understand me due to a communication barrier. Keep the opener simple, speak clearly, and check they understand before continuing.\n\nBonu Burger | Ferry Road | DONE\n  Notes on pitch/outcome: I came in too strong with the manager quote. Lesson: don’t come in too strong or immediately ask for the manager. Start with a relaxed question and let the conversation develop.\n\nEspresso Car Cleaning | Ferrymead / Ferry Road | DONE\n  Notes on pitch/outcome: They said I could come back on Tuesday when their manager is there. Follow up Tuesday and ask politely for the manager.\n\nKebab King | Ferrymead | DONE / DO NOT TARGET\n  Notes on pitch/outcome: They said they were shutting down, so there is no point pursuing a Google Review Card sale.\n\nKEEP FROM THE PREVIOUS LIST\nEspresso Garage\n  Notes on pitch/outcome: [Add notes here]\n\nGENERAL PITCH LESSONS\n- Don’t come in too strong or immediately ask for the manager.\n- Start with a relaxed, low-pressure question.\n- Speak clearly and check that the person understands.\n- If the decision-maker is away, ask when they will next be available and return at the agreed time.\n\nPOSSIBLE PITCHES\n\nPitch 1: Existing pitch\nHey, I’m Luke. I noticed you guys have a pretty good customer base, and I was just wondering, how do you guys currently get customers to leave Google reviews?\n\nPitch 2: Simple question opener\nHey, I’m not actually ordering or buying anything. I was just wondering if I could ask you a question?\nIf they say, “Sure, what’s that?”\nDo you think your store would benefit from more Google reviews?\n\nAfter each visit, record: who you spoke to, their reaction, whether the decision-maker was available, objections/questions, whether they wanted a follow-up, and what you would change next time.","updatedAt":1792230000000,"category":"Business & Ecom"},{"id":"tgq45bqj","title":"Backflip notes","body":"Full send no half shit \nDon’t step forward  \nWhen tucking grab hamstrings \nWhen grabbing hamstrings try grab closer together \nHold tuck for longer","updatedAt":1790057475291,"category":"Learning & Skills"},{"id":"fw6d8fsq","title":"Main meal prep 20 dollars","body":"Yep, if you mean the full recipe including everything shown in the photo, here’s the complete version:\n\n🍗 BBQ Cajun Chicken Meal\n\nIngredients\n\n* Chicken breast: 200 g\n* Cheese: 40 g\n* Wattie’s Burger Sauce: 30 g\n* Pita bread: 1\n* Peanuts: 30 g\n* Salt: to taste\n* Pepper: to taste\n* Cajun seasoning: to taste\n* Garlic salt: to taste\n\nMethod\n\n1. Preheat BBQ to maximum heat.\n2. Beat the chicken breast until evenly flattened.\n3. Season both sides with salt, pepper, Cajun seasoning and garlic salt.\n4. BBQ for 5 minutes on one side.\n5. Flip and BBQ for another 5 minutes.\n6. Add the cheese for the final 1–2 minutes so it melts.\n7. Check the chicken reaches 75°C internally.\n8. Remove and rest for 2–3 minutes.\n9. Add Wattie’s Burger Sauce.\n10. Serve with 1 pita and a handful of peanuts.\n\nApprox macros\n\nPer full meal:\n\n* 🔥 ~935 kcal\n* 🥩 ~86 g protein\n* 🍞 ~48 g carbs\n* 🥜 ~44 g fat\n\nIf you’re making two meals from the amount in the photo, tell me roughly how much chicken/cheese/sauce you used and I can calculate the actual macros for both containers rather than estimating.","updatedAt":1789884556375,"category":"Food & Nutrition"},{"id":"qa4qtpx4","title":"Payments income","body":"💰 Money Owed\n\n* Sarah\n    * Car: $60\n    * Work: $50\n    * Pending work: $50 (not owed yet)\n    * Currently owed: $110\n* Max\n    * $20\n\nTotal currently owed: $130\nTotal after Sarah’s pending work: $180","updatedAt":1791062542385,"category":"Money & Finance"},{"id":"nkzk9t9z","title":"Hypnosis script","body":"Right, you want the full script in the proper order: initial compliance tests → simple suggestions → stronger responses → deepening → the verbal “sleep” effect.\n\nI can give you a script that builds those stages with a willing volunteer. The rapid limp-on-command part needs supervised training, so this version uses a seated relaxation response rather than a sudden collapse.\n\nFull hypnosis practice script\n\nAllow 5 to 10 minutes. Read slowly, leave pauses, and get consent before starting.\n\nStage 1: Initial compliance and focus\n\nGoal: establish that they are following your instructions willingly.\n\n“Sit comfortably and hold your hands out in front of you, palms facing each other.\n\nGood. Now slowly bring your hands a little closer together.\n\nThat’s it. Now move them apart again.\n\nGreat. Close your eyes if you’re comfortable doing so, then open them again.\n\nGood. Just follow each instruction at your own pace.”\n\nStage 2: Simple suggestions\n\nGoal: introduce imagination and suggestion.\n\n“Hold your hands out again, palms facing each other.\n\nImagine there’s a gentle magnetic force drawing your hands together.\n\nPicture that force getting stronger. Don’t force your hands to move. Just imagine the sensation and notice what happens.\n\nPause.\n\nNow imagine your hands becoming lighter, as though they’re floating upwards.\n\nJust notice whether you experience any movement.”\n\nStage 3: Building the response\n\nGoal: encourage a comfortable, focused state.\n\n“Now let your hands rest in your lap.\n\nTake a comfortable breath in, and slowly breathe out.\n\nNotice your shoulders relaxing. Let your arms rest comfortably.\n\nWith each breath, allow yourself to become more absorbed in the sound of my voice.\n\nYou don’t have to force anything. Simply listen and imagine.\n\nIf you feel comfortable, allow your eyes to close.”\n\nStage 4: Deepening\n\nGoal: maintain attention and deepen relaxation.\n\n“I’m going to count slowly from five down to one.\n\nFive… settling into the chair.\n\nFour… letting your shoulders loosen.\n\nThree… focusing on my voice.\n\nTwo… allowing other distractions to fade into the background.\n\nOne… relaxed, comfortable, and focused on this exercise.\n\nJust remain comfortable and follow along for as long as you wish.”\n\nStage 5: Practising a verbal cue\n\nGoal: practise an agreed response to a cue without physical risk.\n\n“We’re going to practise a simple cue together.\n\nWhen I say ‘RELAX’, let your shoulders soften and your arms rest comfortably in your lap.\n\nRELAX.\n\nGood. Notice that comfortable feeling.\n\nWe’ll finish the exercise shortly.”\n\nStage 6: Ending the session\n\n“The exercise is now finished.\n\nTake a moment to notice the room around you.\n\nMove your hands and shoulders if you wish. Open your eyes whenever you’re ready.\n\nTake your time, and let me know how you’re feeling.”\n\nHow to progress towards rapid stage hypnosis\n\nThe key distinction is that following instructions, responding to imaginative suggestions and entering a focused state are different things. None guarantees that someone will respond to a rapid induction.\n\nOnce you’re comfortable delivering this script, the next step is supervised training in rapid inductions, including how to keep volunteers physically supported and respond if someone becomes uncomfortable.\n\nDon’t use an arm tug to make someone collapse. You can practise the verbal side of stage hypnosis without risking a fall, and a cue like “sleep” cannot reliably switch off someone’s awareness or bodily control.","category":"Learning & Skills","updatedAt":1791788253315},{"id":"1f3wljig","title":"Bali budget","body":"Amed, Bali: Full Conversation Summary\n\n1. The overall plan\n\nThe idea is to spend 12 months living in Amed, Bali, on a tight budget while maintaining a lifestyle built around:\n\n* 🏋️ Going to the gym every day.\n* 🏊 Swimming regularly, ideally in the ocean.\n* 🏡 Living in a private bungalow with basic amenities and good Wi-Fi.\n* 🥗 Buying affordable groceries and cooking most of your food.\n* 🛵 Having a scooter to get around.\n* 💻 Spending time every day building your e-commerce business.\n* 💰 Getting a light local job to help pay for living expenses, if legally possible.\n\nThe goal is to live somewhere warm and tropical, keep your expenses low, stay fit and have time to build your business.\n\n2. Estimated living costs\n\nThe original budget was based on a private bungalow, groceries, gym membership and scooter transport.\n\nExpense\tMonthly NZD\tAnnual NZD\nPrivate bungalow with kitchen\t$700\t$8,400\nElectricity, water and internet\t$150\t$1,800\nGroceries and drinking water\t$350\t$4,200\nGym membership\t$60\t$720\nScooter rental\t$100\t$1,200\nPetrol and basic maintenance\t$30\t$360\nLaundry, toiletries and essentials\t$60\t$720\nPhone and mobile data\t$20\t$240\nPersonal spending and unexpected costs\t$200\t$2,400\nTotal\t$1,670\t$20,040\n\nThese are planning estimates, not confirmed rental quotes or guaranteed current prices. In particular, the bungalow price needs to be verified against actual long-term rentals.\n\nA few important assumptions:\n\n* The bungalow is private, with a bathroom, kitchen and usable Wi-Fi.\n* Food is mostly groceries rather than restaurant meals.\n* The gym budget assumes a discounted longer-term membership.\n* The scooter budget assumes a relatively inexpensive long-term rental.\n\n3. How much you should save before going\n\nEstimated annual living costs\n\nNZ$20,040\n\nReturn flights\n\nPlanning estimate\n\n$900–$1,600\n\n12-month travel insurance\n\nDepends on coverage and eligibility\n\n$800–$2,000\n\nVisa and immigration\n\nDepends on the visa route\n\n$300–$1,500+\n\nDeposit and initial setup\n\n$500–$1,000\n\nEmergency / return-home reserve\n\n$2,000–$3,000\n\nRecommended savings target, allowing for some price variation\n\nNZ$25,000–$28,000+\n\nThe key distinction is that your estimated living costs are around $20,000 a year, but you should aim to have more available to cover travel, setup expenses and emergencies.\n\nI would not rely on finding a job after arriving to make the trip financially possible.\n\n4. The local job idea\n\nYou clarified that you are talking about working locally in Amed, not freelancing remotely.\n\nYou want a relatively easy job that fits around your gym, swimming and e-commerce routine.\n\nThe most relevant types of work to investigate are:\n\nCafé or restaurant assistant\n\nServing customers, clearing tables, helping with food preparation or making drinks. Some jobs involve split shifts or busy evenings, so the hours would need to suit your routine.\n\nGuesthouse assistant\n\nCleaning, laundry, preparing rooms or helping with general property tasks. Morning shifts could leave more time for your own activities.\n\nDive shop or tourism assistant\n\nBooking assistance, equipment organisation or customer service. Some roles require relevant qualifications or experience.\n\nPotential income\n\nThese are rough scenarios rather than verified offers.\n\nMonthly earnings\tPossible contribution\nNZ$250–$400\tGroceries and part of your utilities\nNZ$400–$700\tA meaningful contribution to living costs\nNZ$700–$1,000\tA large contribution towards your basic expenses\n\nAt NZ$700 per month, for example, your annual income would be NZ$8,400. If you could lawfully earn that consistently, it would reduce the amount of your own savings used for living expenses.\n\nHowever, finding a local job as a foreigner can be difficult. Amed is a relatively small tourism area, and some employers may only hire Indonesian citizens for particular positions.\n\nVisa restrictions are critical. A tourist visa does not ordinarily permit taking a paid local job. You would need to establish which work-authorised visa route is available to you before relying on local employment. The official Indonesian immigration website⁠￼ is the place to start.\n\n5. The daily lifestyle you’re aiming for\n\nAn example routine could look like this:\n\nTime\tActivity\n6:00 am\tWake up and eat breakfast\n7:00 am–11:00 am\tLocal job, if you secure a suitable morning shift\n11:00 am–12:00 pm\tSwim or relax at the beach\n12:00 pm–1:00 pm\tLunch\n1:00 pm–3:00 pm\tE-commerce work\n3:00 pm–4:30 pm\tGym\n4:30 pm onwards\tShower, dinner, more e-commerce or free time\n\nThis is only an example. The actual routine would depend on job hours, the gym’s opening times and how far your bungalow is from the beach and gym.\n\nThe main idea is to protect enough time for your business rather than allowing a job to consume the entire day.\n\n6. The main things to organise before leaving\n\n* Find a private bungalow with a kitchen, bathroom and reliable Wi-Fi.\n* Confirm whether electricity, water and internet are included in the rent.\n* Confirm gym prices and whether a long-term membership is available.\n* Check long-term scooter rental costs, licence requirements and insurance.\n* Establish which Indonesian visa permits your intended length of stay and any proposed employment.\n* Get a realistic quote for 12-month travel insurance.\n* Research actual local vacancies and whether you are eligible for those jobs.\n* Save enough to cover the year without needing job income to survive.\n* Keep emergency money separate from everyday spending.\n\n7. My overall recommendation\n\nThe plan itself is achievable in principle, but the numbers and employment assumptions need to be verified before you commit to a year abroad.\n\nI’d aim for NZ$25,000–$28,000 or more in savings, secure accommodation at a sensible monthly rate, and treat any local job income as a bonus until you know you can legally obtain suitable work.\n\nThe biggest unresolved question is your eligibility to work locally. The next step is to establish your citizenship and age at the time you plan to go, because those details affect the immigration options available.","category":"Life & Goals","updatedAt":1791881627580}],"dailyReviews":{"2026-08-03":{"wentWell":"I stood my ground  and did what I needed to do","couldBeBetter":"I could of not jerked off","biggestWin":"Was getting my work done","tomorrowFocus":"Get started and understand bio then work on ecomme // Fixed daily lesson-time skeleton (period numbers get matched against WEEKLY_TIMETABLE[dow])
function getDaySchedule(dow){
  const subjects = WEEKLY_TIMETABLE[dow];
  if(!subjects) return null;
  const blocks = [
    {type:'period', period:1, start:'08:40', end:'09:30'},
    {type:'break', label:'Walk to next class', start:'09:30', end:'09:35'},
    {type:'period', period:2, start:'09:35', end:'10:25'},
    {type:'break', label:'Morning Tea', start:'10:25', end:'10:45'},
    {type:'period', period:3, start:'10:45', end:'11:35'},
    {type:'break', label:'Walk to next class', start:'11:35', end:'11:40'},
    {type:'period', period:4, start:'11:40', end:'12:30'},
    {type:'break', label:'Lunch', start:'12:35', end:'13:35'},
    {type:'period', period:5, start:'13:35', end:'14:25'},
  ];
  if(dow===3){
    blocks.push({type:'break', label:'Dismissal', start:'14:25', end:'14:30'});
  } else {
    blocks.push({type:'break', label:'Walk to next class', start:'14:25', end:'14:30'});
    blocks.push({type:'period', period:6, start:'14:30', end:'15:20'});
  }
  let pIdx=0;
  blocks.forEach(b=>{ if(b.type==='period'){ b.subject = subjects[pIdx]||''; pIdx++; } });
  return blocks;
}

async function loadState(){
  try{
    let saved = localStorage.getItem(STORE_KEY);
    /* Data built into this file: used on a brand-new device, and ALSO once when
       the file carries a newer built-in backup than this device has applied
       (that's how "save the app with my data" works). The device's previous
       data is kept as a safety copy first. */
    const embedAt = (typeof BACKUP_DATA_AT!=='undefined') ? Number(BACKUP_DATA_AT)||0 : 0;
    let embedApplied = null; try{ embedApplied = localStorage.getItem('lifeos-embed-at'); }catch(e){}
    if(typeof BACKUP_DATA!=='undefined' && BACKUP_DATA && (!saved || (embedAt && String(embedAt)!==embedApplied))){
      try{ if(saved) localStorage.setItem('lifeos-state-before-embed', saved); }catch(e){}
      saved = JSON.stringify(BACKUP_DATA);
      try{ localStorage.setItem(STORE_KEY, saved); if(embedAt) localStorage.setItem('lifeos-embed-at', String(embedAt)); }catch(e){}
    }
    if(saved){
      const parsed = JSON.parse(saved);
      const hadProfiles = !!(parsed.profiles && parsed.profiles.length);
      state = parsed;
      // migrate missing fields
      const d = defaultState();
      state = Object.assign({}, d, state);
      state.data = Object.assign({}, d.data, state.data||{});
      state.data.school = Object.assign({}, d.data.school, state.data.school||{});
      state.data.gym = Object.assign({}, d.data.gym, state.data.gym||{});
      // Preserve saved gym edits. Only fill missing gym fields from the defaults.
      state.data.gym.exercises = Object.assign({}, GYM_EXERCISES, state.data.gym.exercises||{});
      state.data.gym.split = Object.assign({}, GYM_SPLIT, state.data.gym.split||{});
      if(!state.data.gym.progression) state.data.gym.progression = GYM_PROGRESSION;
      // Snap Fitness status migration — additive only; a brand-new {"YYYY-MM-DD":bool} map.
      if(!state.data.gym.snapFitness || typeof state.data.gym.snapFitness!=='object') state.data.gym.snapFitness = {};
      // Meal Prep scheduled-days migration — additive only; defaults to the existing Sunday & Tuesday label.
      if(!Array.isArray(state.mealPrepDays) || !state.mealPrepDays.length) state.mealPrepDays = [0,2];
      state.data.meals = Object.assign({}, d.data.meals, state.data.meals||{});
      if(!state.data.meals.peanutButterJelly){
        state.data.meals.peanutButterJelly = {name:'Peanut Butter & Jelly Sandwiches', ingredients:['6 slices of bread','6 tablespoons jam','6 tablespoons peanut butter','Yogurt','Protein Powder'], steps:'Make 3 sandwiches using 2 slices of bread per sandwich, with 1 tablespoon of jam and 1 tablespoon of peanut butter on each slice. Serve with yogurt mixed with protein powder.'};
      }
      state.data.rugby = Object.assign({}, d.data.rugby, state.data.rugby||{});
      state.skills = Array.isArray(state.skills) ? state.skills : [];
      state.skills = state.skills.map(sk=>{
        sk = Object.assign({sessions:0, sessionsCompleted:0, targetSessions:1, masterySessions:1, learnedDates:[], progress:0, category:'General', notes:'', createdAt:Date.now()}, sk);
        if(window.ensureSkillModel) window.ensureSkillModel(sk);
        return sk;
      });
      if(state.rugbySeason!==undefined){ // migrate very old single ON/OFF switch
        if(!state.smartSchedules) state.smartSchedules={};
        state.smartSchedules.rugby = !!state.rugbySeason;
        delete state.rugbySeason;
      }
      if(!state.weeklyResetChecklist) state.weeklyResetChecklist=[...WEEKLY_RESET_CHECKLIST_DEFAULT];
      if(!state.dailyReviews) state.dailyReviews={};

      // Awards system migration — additive only, never touches existing data.
      state.awards = Object.assign({}, defaultAwardsState(), state.awards||{});
      state.awards.weeklyPresent = Object.assign({focusId:null, opened:false, rewardId:null}, state.awards.weeklyPresent||{});
      state.awards.rewards = Array.isArray(state.awards.rewards) ? state.awards.rewards : [];
      state.awards.myAwards = Array.isArray(state.awards.myAwards) ? state.awards.myAwards : [];
      state.awards.medalAck = state.awards.medalAck || {};
      // Baseline acknowledgement for any medal not yet tracked — covers both a
      // brand-new install AND any newly-added medal defs (like these 10) so
      // pre-existing historical progress never retroactively fires an unlock
      // animation. Medals already tracked are left completely untouched, which
      // is what makes "don't repeat old unlocks" actually hold across reloads.
      MEDAL_DEFS.forEach(m=>{
        if(!state.awards.medalAck.hasOwnProperty(m.key)){
          state.awards.medalAck[m.key] = medalTierReached(m);
        }
      });

      // Ecommerce data migration — additive only; adds cumulativeRevenue for the
      // Money Maker medal without touching any existing ecommerce fields.
      state.data.ecommerceData = Object.assign({businesses:[], products:[], suppliers:[], links:[], cumulativeRevenue:0}, state.data.ecommerceData||{});

      // Today's List migration — additive only; a brand-new, independent data
      // slice that never touches routines, focuses, reminders, goals, etc.
      if(!state.todaysLists || typeof state.todaysLists!=='object') state.todaysLists = {};
      // One-time shape migration: an earlier build stored per-item insertion
      // (list.tasks[].insertRoutine). The current model inserts the whole list
      // as one dropdown (list.items + list.insertRoutine), so old per-item
      // lists are converted to plain unscheduled items — nothing is deleted,
      // the user just re-inserts the list into the routine if they want that.
      Object.keys(state.todaysLists).forEach(dateKey=>{
        const list = state.todaysLists[dateKey];
        if(list && Array.isArray(list.tasks) && !Array.isArray(list.items)){
          list.items = list.tasks.map(t=>({
            id:t.id, kind:t.kind||'task', title:t.title, note:t.note||'',
            priority:t.priority, done:!!t.done, order: typeof t.order==='number'?t.order:0
          }));
          delete list.tasks;
        }
        if(!Array.isArray(list.items)) list.items = [];
        if(list.insertRoutine===undefined) list.insertRoutine = null;
      });

      // Additive reminders — only inserted once each (matched by fixed id), so
      // they never duplicate on subsequent loads and never touch existing reminders.
      if(!Array.isArray(state.reminders)) state.reminders=[];
      [
        {id:'rem_new_haircut', title:'New haircut', category:'Personal', priority:'Low', date:todayISO(), time:'', notes:'', done:false},
        {id:'rem_buy_fitness_tracker', title:'Buy fitness tracker', category:'Personal', priority:'Low', date:todayISO(), time:'', notes:'', done:false},
        {id:'rem_find_new_keyboard', title:'Find new keyboard', category:'Personal', priority:'Low', date:todayISO(), time:'', notes:'', done:false},
        {id:'rem_get_id', title:'Get ID', category:'Personal', priority:'Low', date:todayISO(), time:'', notes:'', done:false}
      ].forEach(nr=>{
        if(!state.reminders.some(r=>r.id===nr.id)) state.reminders.push(nr);
      });

      if(!hadProfiles){
        /* One-time migration: Smart Schedule toggles + a single shared routine
           template are replaced by Editable Profiles. The old routine becomes
           the School profile so no data is lost; whichever toggle was on
           becomes the active profile. */
        state.profiles = defaultProfiles();
        const oldTemplate = (parsed.routineTemplate||[]).map(t=>{
          const match = DEFAULT_ROUTINE.find(rt=>rt.id===t.id);
          return Object.assign({displayText:'', time:t.time==='AUTO'?'':t.time, hidden:false}, match?{locked:match.locked}:{}, t, {displayText: t.displayText!==undefined?t.displayText:(t.time==='AUTO'?'Auto — Profile Routine':'')});
        });
        if(oldTemplate.length){
          const school = state.profiles.find(p=>p.id==='school');
          school.routine = oldTemplate;
          if(!school.routine.some(t=>t.locked==='last')){
            const sleepIdx = school.routine.findIndex(t=>t.id==='sleep'||t.id==='r12');
            if(sleepIdx>-1) school.routine[sleepIdx].locked='last';
          }
        }
        state.activeProfileId = (parsed.smartSchedules && parsed.smartSchedules.rugby) ? 'rugby' : 'school';
      }
      delete state.routineTemplate;
      delete state.smartSchedules;
      // ensure every profile item has a hidden flag (future-proofing for older profile saves)
      state.profiles.forEach(p=>{
        p.routine = (p.routine||[]).map(t=>Object.assign({hidden:false}, t));
        if(!p.routine.some(t=>t.id==='skilllearning')){
          const sleepIdx=p.routine.findIndex(t=>t.locked==='last' || t.id==='sleep');
          const skillItem={hidden:false,id:'skilllearning',time:'21:15',displayText:'',title:'Learning',note:'',category:'skill'};
          if(sleepIdx>-1) p.routine.splice(sleepIdx,0,skillItem); else p.routine.push(skillItem);
        }
      });
      // Add the 🥤 emoji to the afternoon bulking meal wherever it's still
      // missing one. Matched by CONTENT (mentions "afternoon"+"bulk", or
      // "bulking"+"meal", or "afternoon"+"smoothie", case-insensitive) rather
      // than one exact string — covers the original template text, a Life
      // Focus day's own saved copy of it, AND a manually renamed/duplicated
      // custom item like "Afternoon bulk meal", none of which matched the
      // previous exact-string check. Never touches a title that already has
      // the emoji, so it's safe to run on every load.
      function needsAftMealEmoji(title){
        if(typeof title!=='string' || title.includes('🥤')) return false;
        const t = title.toLowerCase();
        return (t.includes('afternoon') && (t.includes('bulk') || t.includes('smoothie'))) || (t.includes('bulking') && t.includes('meal'));
      }
      state.profiles.forEach(p=>{
        (p.routine||[]).forEach(t=>{ if(needsAftMealEmoji(t.title)) t.title='🥤'+t.title; });
      });
      (state.lifeFocuses||[]).forEach(f=> (f.days||[]).forEach(day=>{
        (day.items||[]).forEach(it=>{ if(needsAftMealEmoji(it.title)) it.title='🥤'+it.title; });
      }));
      // Preserve existing focus data, but add the new learning slot to days that predate it.
      (state.lifeFocuses||[]).forEach(f=> (f.days||[]).forEach(day=>{
        if(!day.items.some(i=>i.refId==='skilllearning')){
          const sleepIdx=day.items.findIndex(i=>i.refId==='sleep' || i.locked==='last');
          const item={id:uid(),refId:'skilllearning',order:day.items.length,time:'21:15',displayText:'',title:'Learning',note:'',category:'skill',done:false,type:'item',expanded:false};
          if(sleepIdx>-1) day.items.splice(sleepIdx,0,item); else day.items.push(item);
          day.items.forEach((it,idx)=>it.order=idx);
        }
      }));
      if(!state.activeProfileId || !state.profiles.some(p=>p.id===state.activeProfileId)){
        state.activeProfileId = state.profiles[0] ? state.profiles[0].id : 'school';
      }
      if(!state.goalCategories || !state.goalCategories.length){
        const fromGoals = Array.from(new Set((state.goals||[]).map(g=>g.category).filter(Boolean)));
        state.goalCategories = fromGoals.length ? fromGoals : ['Life','Business','Fitness','School'];
      }
      // ensure every ecommerce focus has its own days array (older saves may only have name/dates)
      (state.ecommerceFocuses||[]).forEach(f=>{ if(!f.days) f.days = generateEcommerceFocusDays(f.startDate, f.endDate); });
    } else {
      state = defaultState();
    }
  }catch(e){
    state = defaultState();
  }
  render();
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }catch(e){ console.error('save failed', e); }
  }, 250);
}
/* Write any pending save straight away when the app is hidden or closed,
   so a tick made just before swiping the app away is never lost. */
function flushSave(){
  if(!saveTimer || !state) return;
  clearTimeout(saveTimer); saveTimer = null;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });

function uid(){ return Math.random().toString(36).slice(2,10); }


function fmtDate(d){
  return d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
}
function isoDate(d){
  // Local-date formatting (NOT toISOString, which converts to UTC and can
  // shift the date backwards/forwards a day for timezones ahead of/behind
  // UTC — that shift was the cause of routines appearing to start on the
  // wrong day). Build the string from local Y/M/D components instead.
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return isoDate(new Date()); }

/* ---- Monday→Sunday week helpers (Weekly Focus always runs Mon..Sun) ---- */
function mondayOf(date){
  // Returns the Monday (local midnight) of the calendar week containing `date`.
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diffToMonday = dow===0 ? -6 : 1-dow;
  d.setDate(d.getDate()+diffToMonday);
  return d;
}
function sundayOf(date){
  const mon = mondayOf(date);
  const sun = new Date(mon);
  sun.setDate(sun.getDate()+6);
  return sun;
}
function currentWeekRange(){
  const now = new Date();
  return { start: isoDate(mondayOf(now)), end: isoDate(sundayOf(now)) };
}

/* Date-only comparison so a Focus's selected end date stays active for the
   entire day it falls on (never ends a day early just because "now" has a
   time-of-day component past midnight). Returns 0 on the end date itself,
   positive while there are full days left, negative once the end date has
   fully passed. */
function daysUntilInclusive(endDateStr){
  const end = new Date(endDateStr+'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  return Math.round((end-today)/86400000);
}

/* ============ MISSED REMINDER / TOP 3 NOTIFICATIONS ============ */
/* Pops a one-time alert when a reminder (or a Top 3 pick from Daily Review)
   passes its date without being completed. Each missed item is tracked by a
   dedupe key in state.missedNotified so it only ever triggers its alert once,
   no matter how many times the app re-renders — the person can always still
   see it's overdue, they just aren't nagged about it repeatedly. Nothing is
   ever moved automatically; the person chooses Move / Pick Date / Dismiss. */
function addDaysISO(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return isoDate(d);
}
function fmtShortDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
function ensureMissedNotifiedShape(){
  if(!state.missedNotified || typeof state.missedNotified!=='object') state.missedNotified={reminders:[],top3:[]};
  if(!Array.isArray(state.missedNotified.reminders)) state.missedNotified.reminders=[];
  if(!Array.isArray(state.missedNotified.top3)) state.missedNotified.top3=[];
  if(!state.reminderTop3 || typeof state.reminderTop3!=='object') state.reminderTop3={};
}

let missedNotificationQueue = [];

function scanForMissedNotifications(){
  if(!state) return;
  ensureMissedNotifiedShape();
  const today = todayISO();
  const newlyFound = [];

  // Plain missed reminders: their date has passed and they're still open.
  state.reminders.forEach(r=>{
    if(!r.date || r.done) return;
    if(r.date >= today) return;
    const notifyKey = r.id+'@'+r.date;
    if(state.missedNotified.reminders.includes(notifyKey)) return;
    newlyFound.push({type:'reminder', reminderId:r.id, missedDate:r.date, notifyKey});
  });

  // Missed Top 3 picks: reminder chosen as a Top 3 for a day that's now past.
  Object.keys(state.reminderTop3).forEach(dateKey=>{
    if(dateKey >= today) return;
    (state.reminderTop3[dateKey]||[]).forEach(id=>{
      const r = state.reminders.find(x=>String(x.id)===String(id));
      if(!r || r.done) return;
      const notifyKey = dateKey+'@'+id;
      if(state.missedNotified.top3.includes(notifyKey)) return;
      newlyFound.push({type:'top3', reminderId:id, missedDate:dateKey, notifyKey});
    });
  });

  if(!newlyFound.length) return;

  // Mark every newly-found item as notified right away, before it's even
  // shown, so a periodic re-scan can never queue the same miss twice.
  newlyFound.forEach(item=>{
    if(item.type==='reminder') state.missedNotified.reminders.push(item.notifyKey);
    else state.missedNotified.top3.push(item.notifyKey);
  });
  saveState();
  missedNotificationQueue.push(...newlyFound);
}

function maybeShowNextMissedNotification(){
  if(!missedNotificationQueue.length) return;
  const backdrop = document.getElementById('sheetBackdrop');
  if(backdrop && backdrop.classList.contains('open')) return; // don't interrupt an open sheet
  if(document.getElementById('missedAlertBackdrop')) return;  // one at a time
  showMissedNotification(missedNotificationQueue.shift());
}

function closeMissedAlert(){
  const el = document.getElementById('missedAlertBackdrop');
  if(el) el.remove();
}

function showMissedNotification(item){
  const r = state.reminders.find(x=>String(x.id)===String(item.reminderId));
  if(!r){ maybeShowNextMissedNotification(); return; } // reminder was deleted since
  const isTop3 = item.type==='top3';
  const title = isTop3 ? '⚠️ Missed Top 3' : '⚠️ Missed Reminder';
  const dayWord = item.missedDate===addDaysISO(todayISO(),-1) ? 'yesterday' : ('on '+fmtShortDate(item.missedDate));
  const msg = `You didn't complete "${escapeHtml(r.title)}" ${dayWord}.`;
  const primaryLabel = isTop3 ? 'Move to Today' : 'Move to Tomorrow';
  const html = `
    <div class="lifeos-alert-backdrop" id="missedAlertBackdrop">
      <div class="lifeos-alert-card">
        <div class="lifeos-alert-title">${title}</div>
        <div class="lifeos-alert-msg">${msg}</div>
        <div class="lifeos-alert-btns">
          <button class="lifeos-alert-btn primary" onclick="resolveMissedNotification('${item.type}','${item.reminderId}','${item.missedDate}','move')">${primaryLabel}</button>
          <button class="lifeos-alert-btn" onclick="openMissedPickDate('${item.type}','${item.reminderId}','${item.missedDate}')">Pick Date</button>
          <button class="lifeos-alert-btn dismiss" onclick="resolveMissedNotification('${item.type}','${item.reminderId}','${item.missedDate}','dismiss')">Dismiss</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function resolveMissedNotification(type, reminderId, missedDate, action){
  const r = state.reminders.find(x=>String(x.id)===String(reminderId));
  if(r && action==='move'){
    if(type==='top3'){
      // Move to Today: keep priority + notes as-is, just shift the date,
      // carry the Top 3 status over to today, and drop it from yesterday's list.
      r.date = todayISO();
      const oldList = state.reminderTop3[missedDate]||[];
      state.reminderTop3[missedDate] = oldList.filter(id=>String(id)!==String(reminderId));
      const tk = todayISO();
      if(!Array.isArray(state.reminderTop3[tk])) state.reminderTop3[tk]=[];
      if(!state.reminderTop3[tk].some(id=>String(id)===String(reminderId))) state.reminderTop3[tk].push(String(reminderId));
      toast('Moved to today’s Top 3');
    } else {
      r.date = addDaysISO(todayISO(),1);
      toast('Moved to tomorrow');
    }
    saveState();
  }
  closeMissedAlert();
  render();
  maybeShowNextMissedNotification();
}

function openMissedPickDate(type, reminderId, missedDate){
  const r = state.reminders.find(x=>String(x.id)===String(reminderId));
  const card = document.querySelector('#missedAlertBackdrop .lifeos-alert-card');
  if(!r || !card) return;
  card.innerHTML = `
    <div class="lifeos-alert-title" style="color:var(--text)">Pick a new date</div>
    <div class="lifeos-alert-msg">Choose when to reschedule "${escapeHtml(r.title)}".</div>
    <input type="date" id="missedPickDateInput" class="lifeos-alert-date" value="${(r.date && r.date>=todayISO())? r.date : todayISO()}">
    <div class="lifeos-alert-btns">
      <button class="lifeos-alert-btn primary" onclick="saveMissedPickDate('${type}','${reminderId}','${missedDate}')">Save</button>
      <button class="lifeos-alert-btn dismiss" onclick="resolveMissedNotification('${type}','${reminderId}','${missedDate}','dismiss')">Cancel</button>
    </div>`;
}

function saveMissedPickDate(type, reminderId, missedDate){
  const input = document.getElementById('missedPickDateInput');
  const val = input && input.value;
  if(!val){ toast('Pick a date'); return; }
  const r = state.reminders.find(x=>String(x.id)===String(reminderId));
  if(r){
    r.date = val;
    if(type==='top3'){
      // Picking a custom date doesn't carry Top 3 status forward — only
      // "Move to Today" does — so just drop it from yesterday's list.
      const oldList = state.reminderTop3[missedDate]||[];
      state.reminderTop3[missedDate] = oldList.filter(id=>String(id)!==String(reminderId));
    }

  render();
  maybeShowNextMissedNotification();
}

function homeworkToday(dow){ return dow===3 || dow===0; } // Wednesday & Sunday

/* Builds a single day's routine in strict logical order (never sorted by time).
   Walks the active profile's routine template once, applying automatic
   adjustments (Rugby, Wednesday early finish, Sunday Weekly Reset, Meal Prep)
   at the exact points they belong, then always finishes with the locked
   'last' item (Sleep). Items marked hidden on the profile are skipped. */
function buildDefaultDayItems(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.getDay();
  const schoolDay = dow>=1 && dow<=5;
  const template = activeRoutine();
  const seq = [];

  template.forEach(t=>{
    if(t.hidden) return; // hidden tasks are excluded from generated days
    if(Array.isArray(t.repeatDays) && t.repeatDays.length && !t.repeatDays.includes(dow)) return; // recurring routine: only on chosen weekdays
    if(t.locked==='last') return; // Sleep is appended at the very end
    if(t.id==='mealprep') return; // Meal Prep is always inserted dynamically below, never from a static template entry
    if((t.id==='transport'||t.id==='school'||t.id==='afterschool'||t.id==='aftsmoothie') && !schoolDay) return;
    if(t.id==='aftsmoothie' && isRugbyDay(dow)) return; // afternoon smoothie removed on Rugby days
    if(t.id==='homework' && !homeworkToday(dow)){ if(isWeeklyResetDay(dow)) seq.push(weeklyResetSeqItem()); return; } // Wednesday & Sunday only

    if(t.id==='afterschool' && isRugbyDay(dow)){
      seq.push({refId:'rugby', time:'', displayText:'After School', title:'Rugby', note:'Rugby training', category:'gym'});
      seq.push({refId:'afterschool', time:homeTimeFor(dow)||'', displayText:'', title:'Home', note:'Later — after Rugby training', category:'routine'});
      return;
    }
    if(t.id==='afterschool'){
      seq.push(Object.assign({refId:t.id}, t, {time:homeTimeFor(dow)||''}));
      return;
    }

    seq.push(Object.assign({refId:t.id}, t));

    if(t.id==='homework' && isWeeklyResetDay(dow)) seq.push(weeklyResetSeqItem());
  });

  if(isMealPrepDay(dow)){
    const mealPrep = {refId:'mealprep', time:'', displayText:'30 minutes', title:'🍱 Meal Prep', note:'', category:'meal'};
    let idx = seq.findIndex(it=>it.refId==='aftsmoothie');
    if(idx>-1) idx = idx+1;
    else {
      idx = seq.findIndex(it=>it.refId==='readyforbed');
      if(idx===-1) idx = seq.length;
    }
    seq.splice(idx,0,mealPrep);
  }

  const sleepTemplate = template.find(t=>t.locked==='last');
  if(sleepTemplate && !sleepTemplate.hidden) seq.push(Object.assign({refId:sleepTemplate.id}, sleepTemplate));

  const built = seq.map((it,i)=>({
    id: uid(), refId: it.refId, order:i,
    time: it.time||'', displayText: it.displayText||'',
    title: it.title, note: it.note||'', category: it.category||'routine', done:false,
    type: it.type||'item',
    checklist: it.checklist ? it.checklist.map(c=>({id:c.id||uid(), title:c.title, done:false})) : undefined,
    expanded: it.expanded||false
  }));
  return built;
}

/* Life Focus and Ecommerce Focus are two fully independent tracks that each
   own a different slice of the same daily routine so they never conflict:
   Life Focus owns everything except the Ecommerce item, Ecommerce Focus
   owns only the Ecommerce item(s). Both get merged back into one routine
   for display (see mergeRoutineForDay). */
function buildLifeFocusDayItems(dateStr){
  return buildDefaultDayItems(dateStr).filter(it=>it.category!=='ecommerce');
}
function buildEcommerceDayItems(dateStr){
  return buildDefaultDayItems(dateStr).filter(it=>it.category==='ecommerce');
}

function generateLifeFocusDays(startDate, endDate){
  const days=[];
  let cur = new Date(startDate+'T00:00:00');
  const end = new Date(endDate+'T00:00:00');
  while(cur<=end){
    const ds = isoDate(cur);
    days.push({date:ds, items: buildLifeFocusDayItems(ds)});
    cur.setDate(cur.getDate()+1);
  }
  return days;
}
function generateEcommerceFocusDays(startDate, endDate){
  const days=[];
  let cur = new Date(startDate+'T00:00:00');
  const end = new Date(endDate+'T00:00:00');
  while(cur<=end){
    const ds = isoDate(cur);
    days.push({date:ds, items: buildEcommerceDayItems(ds)});
    cur.setDate(cur.getDate()+1);
  }
  return days;
}

/* Merges today's Life items with today's Ecommerce items into one ordered
   routine. Ecommerce items are inserted right after "Get Ready for Bed"
   (their natural template position) so the combined list still reads
   Wake Up → ... → Homework → Ecommerce → Sleep. */
function mergeRoutineForDay(lifeItems, ecomItems){
  const items = (lifeItems||[]).slice();
  if(!ecomItems || !ecomItems.length) return items;
  // Each Ecommerce item is inserted using its OWN scheduled time, dropped in
  // right before the first later-timed item in the day. This keeps Ecommerce
  // in its correct chronological slot no matter where "Get Ready for Bed" (or
  // anything else) sits in a given profile's routine — previously this always
  // inserted right after "Get Ready for Bed", which put Ecommerce in the wrong
  // place whenever a profile's routine was reordered so that item no longer
  // fell immediately before Ecommerce's actual time.
  ecomItems.forEach(ecomItem=>{
    let idx;
    if(ecomItem.time){
      idx = items.findIndex(it=> it.time && it.time > ecomItem.time);
      if(idx===-1){
        const sleepIdx = items.findIndex(it=>it.refId==='sleep');
        idx = sleepIdx>-1 ? sleepIdx : items.length;
      }
    } else {
      // No time set on the Ecommerce item itself — fall back to the old
      // "right after Get Ready for Bed" behaviour, then before Sleep, then end.
      idx = items.findIndex(it=>it.refId==='readyforbed');
      if(idx>-1) idx = idx+1;
      else {
        idx = items.findIndex(it=>it.refId==='sleep');
        if(idx===-1) idx = items.length;
      }
    }
    items.splice(idx, 0, ecomItem);
  });
  return items;
}

function getActiveLifeFocus(){
  return state.lifeFocuses.find(f=>f.id===state.activeLifeFocusId) || null;
}
function getActiveEcommerceFocus(){
  return state.ecommerceFocuses.find(f=>f.id===state.activeEcommerceFocusId) || null;
}
/* Generalized version of the Dashboard's "today" routine computation, for any
   date. Read-only — never creates or persists a day, so it's safe to call for
   dates that don't have (and may never get) a real Focus day. Used by Today's
   List to preview "that day's actual routine" without touching Focus data. */
function getBaseMergedRoutineForDate(dateStr){
  const lifeFocus = getActiveLifeFocus();
  const ecomFocus = getActiveEcommerceFocus();
  const lifeDay = lifeFocus ? lifeFocus.days.find(d=>d.date===dateStr) : null;
  const ecomDay = ecomFocus ? ecomFocus.days.find(d=>d.date===dateStr) : null;
  const lifeItems = (lifeDay && lifeDay.items.length) ? lifeDay.items.filter(it=>it.category!=='ecommerce') : buildLifeFocusDayItems(dateStr);
  const ecomItems = (ecomDay && ecomDay.items.length) ? ecomDay.items.filter(it=>it.category==='ecommerce') : buildEcommerceDayItems(dateStr);
  return mergeRoutineForDay(lifeItems, ecomItems);
}
function getTodayInFocus(focus){
  if(!focus) return null;
  return focus.days.find(d=>d.date===todayISO()) || null;
}
/* Focus IDs are unique across both collections, so callers that just need
   "the focus with this id" (toggling a routine item, editing a day) don't
   need to know or pass which system it belongs to. */
function findAnyFocus(id){
  if(!id) return null;
  return state.lifeFocuses.find(f=>f.id===id) || state.ecommerceFocuses.find(f=>f.id===id) || null;
}
function isEcommerceFocusId(id){

}

   every render(), since render() re-renders all pages regardless of which is
   visible. Without this, whichever page rendered last would silently "own"
   the on-screen + button. This keeps the + button matched to the page the
   user is actually looking at, without changing any page's own logic. */

  ['focusFab','goalsFab','awardsFab','dashFab'].forEach(id=>{ const f=document.getElementById(id); if(f) f.remove(); });

function computeWeekProgress(){
  const focus = getActiveLifeFocus();
  if(!focus) return {pct:0, done:0, total:0};
  // week = current 7-day window within focus containing today, else whole focus
  let total=0, done=0;
  focus.days.forEach(d=>{
    d.items.forEach(it=>{ total++; if(it.done) done++; });
  });
  return {pct: total? Math.round(done/total*100):0, done, total};
}

function computeStreak(){
  // consecutive days (ending yesterday or today) where all items in that day were completed
  let streak=0;
  const allDays = {};
  state.lifeFocuses.forEach(f=> f.days.forEach(d=> allDays[d.date]=d));
  let cur = new Date();
  while(true){
    const ds = isoDate(cur);
    const d = allDays[ds];
    if(!d || d.items.length===0) break;
    const allDone = d.items.every(it=>it.done);
    if(!allDone) break;
    streak++;
    cur.setDate(cur.getDate()-1);
  }
  return streak;
}

function getDashboardClassStatus(){
  const blocks=getDaySchedule(new Date().getDay());
  if(!blocks) return {title:'No School Today',sub:'Enjoy your weekend'};
  const nm=nowMinutes();
  const first=blocks.find(b=>b.type==='period');
  if(nm<timeToMinutes(first.start)) return {title:'Next Class',sub:`${first.subject} • Starts in ${timeToMinutes(first.start)-nm} min`};
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];
    if(nm>=timeToMinutes(b.start)&&nm<timeToMinutes(b.end)){
      if(b.type==='period') return {title:'Current Class',sub:`${b.subject} • Ends in ${timeToMinutes(b.end)-nm} min`};
      const next=blocks.slice(i+1).find(x=>x.type==='period');
      if(next) return {title:'Next Class',sub:`${next.subject} • Starts in ${timeToMinutes(next.start)-nm} min`};
      return {title:'School Finished',sub:'Next: Go Home'};
    }
  }
  return {title:'School Finished',sub:'Next: Go Home'};
}


/* A Weekly Focus stays fully active (and tappable) through the entirety of
   Sunday — it only stops being "the current week" once Monday begins. This
   check is idempotent: once the stale focus is deactivated, getActiveLifeFocus()
   returns null and the check becomes a no-op, so it's safe to call on every
   Dashboard render rather than needing a separate one-time flag. */
function checkWeeklyFocusRollover(){
  const focus = getActiveLifeFocus();
  if(!focus) return;
  const now = new Date();
  if(now.getDay()!==1) return; // only ever roll over right as Monday begins
  if(focus.endDate < todayISO()){ // its Sunday has fully passed
    state.activeLifeFocusId = null;
    saveState();
    toast('Last week\'s Focus has ended — create a new Weekly Focus');
  }
}

/* ================================================================
   PREVIOUS DAYS — a read-only historical calendar. It NEVER invents
   completion data: a day's colour is derived only from routine items
   that genuinely exist in a stored Life Focus or Ecommerce Focus day
   for that date (state.lifeFocuses[].days[] / state.ecommerceFocuses[].days[]),
   the same records the rest of the app already reads/writes. A date with
   no such stored day (or with items but zero applicable total) is shown
   as "no data" rather than guessed at.
================================================================ */
function tallyItemsCompletion(items){
  let total=0, done=0;
  (items||[]).forEach(it=>{
    if(it.type==='checklist' && Array.isArray(it.checklist) && it.checklist.length){
      total += it.checklist.length; done += it.checklist.filter(c=>c.done).length;
    } else {
      total++; if(it.done) done++;
    }
    if(Array.isArray(it.subChecklist) && it.subChecklist.length){
      total += it.subChecklist.length; done += it.subChecklist.filter(c=>c.done).length;
    }
  });
  return {total, done};
}
function getHistoricalDayData(dateStr){
  let items = [];
  let lifeFocusId = null, ecomFocusId = null;
  (state.lifeFocuses||[]).forEach(f=>{
    const day = (f.days||[]).find(d=>d.date===dateStr);
    if(day){ items = items.concat((day.items||[]).filter(it=>it.category!=='ecommerce')); lifeFocusId = f.id; }
  });
  (state.ecommerceFocuses||[]).forEach(f=>{
    const day = (f.days||[]).find(d=>d.date===dateStr);
    if(day){ items = items.concat((day.items||[]).filter(it=>it.category==='ecommerce')); ecomFocusId = f.id; }
  });
  items.sort((a,b)=>(a.order||0)-(b.order||0));
  const review = (state.dailyReviews && state.dailyReviews[dateStr]) || null;
  return { found: !!(lifeFocusId || ecomFocusId || review), items, review, lifeFocusId, ecomFocusId };
}
function getDayCompletionStatus(dateStr){
  const {items} = getHistoricalDayData(dateStr);
  if(!items.length) return null; // nothing stored for this date — never fabricate a colour
  const {total, done} = tallyItemsCompletion(items);
  if(!total) return null;
  const pct = done/total*100;
  if(pct>=100) return 'green';
  if(pct>=50) return 'yellow';
  return 'red';
}

const EMOJI_RE = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍|\p{Extended_Pictographic}|\p{Emoji_Modifier})*/gu;
function plainTitle(t){ // display only: drop emoji, never touches stored data
  try{ return String(t||'').replace(EMOJI_RE,'').replace(/\s{2,}/g,' ').trim() || String(t||'').trim(); }catch(e){ return String(t||'').trim(); }
}
function scrubEmoji(root){ // display only: strips emoji from visible text on the Dashboard
  if(!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const v = n.nodeValue; if(!v) return;
    try{ const nv = v.replace(EMOJI_RE,'').replace(/^\s+(?=\S)/,'').replace(/[ \t]{2,}/g,' '); if(nv!==v) n.nodeValue = nv; }catch(e){}
  });
}

/* Evaluate one requirement against a day's item */
function reqRowFor(r, it, date){
  const q = it.req||{}, v = q[r.id];
  const row = {key:r.id, def:r, type:r.type, label:r.label||'', optional:!!r.optional, ok:false, frac:0, detail:'', short:''};
  if(r.type==='check'){
    const on = r.link==='snap' ? !!(state.data && state.data.gym && state.data.gym.snapFitness && state.data.gym.snapFitness[date]===true) : !!v;
    row.ok = on; row.frac = on?1:0; row.detail = on ? 'Done' : ''; row.short = row.label;
  } else if(r.type==='number'){
    const goal = Number(r.target)||0, val = Number(v)||0;
    row.ok = val>=goal; row.frac = goal ? Math.min(1,val/goal) : (val?1:0);
    row.detail = val ? `${val} of ${goal} ${r.unit||''}`.trim() : `Goal ${goal} ${r.unit||''}`.trim();
    row.short = `${val} / ${goal} ${r.unit||''}`.trim();
  } else if(r.type==='time'){
    const goal = hmToMin(r.target);
    let val = hmToMin(v);
    if(val!=null && goal!=null && goal>=12*60 && val<12*60) val += 1440; // after midnight counts as late for an evening limit
    row.ok = val!=null && goal!=null && val<=goal; row.frac = row.ok?1:0;
    row.label = (r.label||'By')+' '+fmtClockTime(r.target);
    row.detail = v ? (row.ok ? 'Logged '+fmtClockTime(v) : fmtClockTime(v)+' is after the limit') : 'Enter the time';
    row.short = 'By '+fmtClockTime(r.target);
  } else if(r.type==='timer'){
    const goal = Number(r.target)||0, got = loggedMinutesFor(date, it.id);
    row.ok = got>=goal; row.frac = goal ? Math.min(1,got/goal) : 1;
    row.detail = `${got} of ${goal} min on the timer`; row.short = `${got} / ${goal} min`;
  } else if(r.type==='text'){
    const t = String(v||'').trim();
    row.ok = !!t; row.frac = t?1:0; row.detail = t ? t : 'Write it down'; row.short = t ? row.label : 'Not logged yet';
  } else if(r.type==='steps'){
    const steps = taskSteps(it);
    if(steps.length){ const d = steps.filter(s=>s.done).length; row.ok = d===steps.length; row.frac = d/steps.length; row.detail = `${d} of ${steps.length} ticked`; row.short = `${d} of ${steps.length} steps`; row.hasSteps = true; }
    else { row.ok = !!v; row.frac = v?1:0; row.detail = v ? 'Done' : 'No steps today, tick when done'; row.short = row.label; }
  }
  return row;
}
function reqStatus(it, date){
  if(!it || it.type==='checklist') return null;
  const list = taskReqList(it.refId); if(!list.length) return null;
  const rows = list.map(r=>reqRowFor(r, it, date));
  const need = rows.filter(r=>!r.optional);
  const frac = need.length ? need.reduce((a,r)=>a+r.frac,0)/need.length : 1;
  return {rows, met: need.every(r=>r.ok), done: need.filter(r=>r.ok).length, total: need.length, frac};
}
function isSimpleDesign(id){ id = id || (state && state.design); return !!id && (id==='simple' || String(id).indexOf('simple-')===0); }
function isStrictTask(refId){ return !!(state && state.taskReqStrict && refId && state.taskReqStrict[refId]); }
function reqBlocked(it, date){
  if(!it || it.done) return false;
  /* A task set to "lock" always waits for its requirements. Otherwise Super
     Simple treats requirements as hints (you get asked to confirm instead),
     and the other designs follow the global "enforce" setting. */
  if(!isStrictTask(it.refId)){
    if(isSimpleDesign()) return false;
    if(!reqRules().enforce) return false;
  }
  const st = reqStatus(it, date);
  return !!(st && !st.met);
}
function reqFraction(it, date, st){
  st = st || reqStatus(it, date); if(!st) return 0;
  return (it.done || st.met) ? 1 : st.frac;
}
function reqSummary(it, date){
  const st = reqStatus(it, date); if(!st) return '';
  if(st.met) return 'Ready to tick';
  const first = st.rows.find(r=>!r.ok && !r.optional);
  if(['number','timer','time'].includes(first.type) || (first.type==='steps' && first.hasSteps)) return first.short;
  return st.total>1 ? `${st.done} of ${st.total} done` : first.short;
}

    const a = document.activeElement;
    if(a && a.matches && a.matches('input,textarea,select') && a.closest('.rt,.un,.sheet')){ a.addEventListener('blur', softRender, {once:true}); return; }
    render();

  const seen = {}, out = [];

  const prof = (typeof getActiveProfile==='function') ? getActiveProfile() : null;

/* Perfect day streak: consecutive days where every routine item was completed.
   Today counts once it's perfect; an unfinished today doesn't break the streak. */
function computePerfectDayStreak(){
  let streak = 0; const cur = new Date();
  const status = d=>getDayCompletionStatus(isoDate(d));
  if(status(cur)==='green') streak++;
  cur.setDate(cur.getDate()-1);
  for(let i=0;i<3650;i++){
    if(status(cur)!=='green') break;
    streak++; cur.setDate(cur.getDate()-1);
  }
  return streak;
}

  const today = todayISO(); const L = ['M','T','W','T','F','S','S'];
  return `<div class="wk">${L.map((l,i)=>{
    const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i); const ds = isoDate(d);
    const its = getHistoricalDayData(ds).items;
    const topDone = its.filter(x=>x.done).length;

  }).join('')}</div>`;

/* Progress ring split into one segment per task */
function segRing(items, size){
  const n = Math.max(1, items.length), stroke = 9, r = (size-stroke)/2, C = 2*Math.PI*r;
  const gap = n>1 ? Math.min(6, C/n*0.28) : 0, seg = C/n - gap;
  let nextSeen = false;
  const arcs = items.map((it,i)=>{
    let cls = it.done ? 'd' : '';
    if(!it.done && !nextSeen){ cls = 'n'; nextSeen = true; }
    return `<circle class="sr-${cls||'p'}" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${seg.toFixed(2)} ${(C-seg).toFixed(2)}" stroke-dashoffset="${(-(i*C/n) - gap/2).toFixed(2)}"/>`;
  }).join('');
  return `<svg class="sr" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${arcs}</svg>`;
}

/* ============ DAILY REVIEW ============ */
/* ---- FULL DAILY REVIEW (additive) ----
   Everything below gathers a real, live snapshot of a given date's actual
   LifeOS data (routine, reminders, Top 3, learning, focuses) so the review
   is never based on fake/static data. Nothing here changes how routines,
   reminders, skills or focuses are stored — it only reads them. */
let reviewRescheduledIds = new Set();

function findFocusDayForDate(focuses, dateStr){
  for(const f of (focuses||[])){
    const day = (f.days||[]).find(d=>d.date===dateStr);
    if(day) return {focus:f, day};
  }
  return null;
}

function isReminderTop3(stats, reminder){
  return stats.top3Items.some(r=>String(r.id)===String(reminder.id));
}

function computeDailyReviewStats(dateStr){
  const lifeMatch = findFocusDayForDate(state.lifeFocuses, dateStr);
  const ecomMatch = findFocusDayForDate(state.ecommerceFocuses, dateStr);

  // Prefer the actual stored day (with real done/skillId/checklist data);
  // fall back to a freshly generated day only when no stored day exists
  // (mirrors the same fallback the Dashboard already uses for today).
  const lifeItemsAll = lifeMatch ? lifeMatch.day.items.filter(it=>it.category!=='ecommerce') : buildLifeFocusDayItems(dateStr);
  const ecomItemsAll = ecomMatch ? ecomMatch.day.items.filter(it=>it.category==='ecommerce') : buildEcommerceDayItems(dateStr);
  const mergedRoutine = mergeRoutineForDay(lifeItemsAll, ecomItemsAll);

  const routineCompleted = mergedRoutine.filter(it=>it.done);
  const routineMissed = mergedRoutine.filter(it=>!it.done);

  const remindersForDate = (state.reminders||[]).filter(r=>{
    const d = r.date || r.dueDate;
    return d===dateStr && !r.dismissed;
  });
  const remindersCompleted = remindersForDate.filter(r=> r.done||r.completed);
  const remindersMissed = remindersForDate.filter(r=> !(r.done||r.completed));

  const top3Ids = (state.reminderTop3 && Array.isArray(state.reminderTop3[dateStr])) ? state.reminderTop3[dateStr].map(String) : [];
  const reminderMap = {};
  (state.reminders||[]).forEach(r=>{ reminderMap[String(r.id)] = r; });
  const top3Items = top3Ids.map(id=>reminderMap[id]).filter(Boolean);
  const top3Completed = top3Items.filter(r=> r.done||r.completed);
  const top3Missed = top3Items.filter(r=> !(r.done||r.completed));

  const learningItem = mergedRoutine.find(it=>it.refId==='skilllearning') || null;
  const learningDone = !!(learningItem && learningItem.done);
  const learningSkill = (learningItem && learningItem.skillId) ? (state.skills||[]).find(sk=>sk.id===learningItem.skillId) : null;
  const learningProgressLabel = (learningSkill && window.LifeOSSkillProgressLabel) ? window.LifeOSSkillProgressLabel(learningSkill) : '';

  const lifeFocus = lifeMatch ? lifeMatch.focus : null;
  const lifeDay = lifeMatch ? lifeMatch.day : null;
  const ecomFocus = ecomMatch ? ecomMatch.focus : null;
  const ecomDay = ecomMatch ? ecomMatch.day : null;

  const routineTotal = mergedRoutine.length;
  const remindersTotal = remindersForDate.length;
  const top3Total = top3Items.length;
  const learningTotal = learningItem ? 1 : 0;
  const completedUnits = routineCompleted.length + remindersCompleted.length + top3Completed.length + (learningDone?1:0);
  const totalUnits = routineTotal + remindersTotal + top3Total + learningTotal;
  const overallPct = totalUnits>0 ? Math.round((completedUnits/totalUnits)*100) : 0;

  return {
    dateStr, mergedRoutine,
    routineCompleted, routineMissed, routineTotal,
    remindersForDate, remindersCompleted, remindersMissed, remindersTotal,
    top3Items, top3Completed, top3Missed, top3Total,
    learningItem, learningDone, learningSkill, learningProgressLabel,
    lifeFocus, lifeDay, ecomFocus, ecomDay,
    overallPct
  };
}

/* ============ LITTLE REWARDS: confetti, review streak, next-up countdown ============ */
function celebrate(n, big){
  try{
    const c = document.createElement('canvas'); c.className = 'confetti';
    const W = innerWidth, H = innerHeight, dpr = Math.min(2, window.devicePixelRatio||1);
    c.width = W*dpr; c.height = H*dpr; c.style.width = W+'px'; c.style.height = H+'px';
    document.body.appendChild(c);
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6C5CE7';
    const cols = [acc, '#FFC15A', '#22C58B', '#FF6FB1', '#5B8DEF', '#FFFFFF'];
    const P = Array.from({length:n}, ()=>({x: big? Math.random()*W : W/2 + (Math.random()-.5)*80, y: big? -20 - Math.random()*H*.3 : H*.55,
      vx:(Math.random()-.5)*(big?4:9), vy: big? 2+Math.random()*3 : -6-Math.random()*7, r:4+Math.random()*5, a:Math.random()*6, va:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
    const t0 = performance.now(), dur = big ? 2600 : 1300;
    (function frame(t){
      const k = (t-t0)/dur; ctx.clearRect(0,0,W,H);
      P.forEach(p=>{ p.vy += .25; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.globalAlpha = Math.max(0,1-k); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
      if(k<1) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }catch(e){}
}
function celebrateTick(date){
  try{ if(navigator.vibrate) navigator.vibrate(18); }catch(e){}
  let items = [];
  try{ items = getHistoricalDayData(date).items || []; }catch(e){}
  const allDone = items.length && items.every(i=>i.done);
  if(allDone && date===todayISO()){ celebrate(160, true); toast('Perfect day. Every task done.'); }
  else celebrate(36, false);
}
function reviewStreakDays(){
  const R = state.dailyReviews || {}; let n = 0; let d = todayISO();
  if(!R[d]) d = addDaysISO(d,-1); // today's review isn't due until tonight
  while(R[d]){ n++; d = addDaysISO(d,-1); if(n>3650) break; }
  return n;
}
function nextUpLine(item){
  if(!item) return '';
  const name = plainTitle(item.title);
  if(!(item.time && /^\d{1,2}:\d{2}$/.test(item.time))) return 'Next: '+name;
  const [h,m] = item.time.split(':').map(Number), now = new Date();
  const diff = h*60+m - (now.getHours()*60+now.getMinutes());
  const when = diff>0 ? (diff<60 ? 'in '+diff+' min' : 'in '+Math.floor(diff/60)+'h '+(diff%60? (diff%60)+'m':'').trim()) : diff===0 ? 'now' : (-diff<60 ? (-diff)+' min late' : 'overdue');
  return 'Next: '+name+' · '+fmtClockTime(item.time)+' ('+when+')';
}

/* ============ LEVELS, MORNING START, WEEKLY RECAP, HEATMAP ============
   All read-only and worked out from your real history, so nothing new is
   stored except the last level you've seen (per device, for the level-up). */
function lifeXp(){
  let xp = 0;
  [...(state.lifeFocuses||[]), ...(state.ecommerceFocuses||[])].forEach(f=>(f.days||[]).forEach(d=>(d.items||[]).forEach(it=>{
    if(it.done) xp += it.forcedDone ? 5 : 10;
  })));
  Object.keys(state.dailyReviews||{}).forEach(()=>{ xp += 25; });
  (state.reminders||[]).forEach(r=>{ if(r.done||r.completed) xp += 5; });
  (state.goals||[]).forEach(g=>{ if(g.done) xp += 50; });
  (state.skills||[]).forEach(sk=>{ xp += 5*((sk.learnedDates||[]).length || Number(sk.sessions)||0); });
  return xp;
}
function levelFor(xp){ let n = 1; while(xp >= 50*n*(n+1)) n++; const lo = 50*(n-1)*n, hi = 50*n*(n+1); return {level:n, into:xp-lo, need:hi-lo, pct:Math.round((xp-lo)/(hi-lo)*100)}; }
const LEVEL_NAMES = ['Starter','Starter','Builder','Builder','Grinder','Grinder','Operator','Operator','Machine','Machine','Elite','Elite','Legend'];
function levelName(n){ return LEVEL_NAMES[Math.min(n, LEVEL_NAMES.length-1)]; }
function checkLevelUp(L){
  let seen = 0; try{ seen = Number(localStorage.getItem('lifeos-level-seen'))||0; }catch(e){}
  if(L.level > seen){
    try{ localStorage.setItem('lifeos-level-seen', String(L.level)); }catch(e){}
    if(seen) setTimeout(()=>{ celebrate(180, true); toast('Level up! Level '+L.level+' · '+levelName(L.level)); }, 400);
  }
}
function dayPct(ds){ const its = getHistoricalDayData(ds).items; return its.length ? its.filter(x=>x.done).length/its.length : null; }
function heatmapHtml(weeks){
  const today = todayISO(); const t = new Date(today+'T00:00:00'); const dow = (t.getDay()+6)%7;
  const start = addDaysISO(today, -(dow + 7*(weeks-1)));
  let cells = '', active = 0, perfect = 0;
  for(let w=0; w<weeks; w++){
    cells += '<div class="hm-col">';
    for(let d=0; d<7; d++){
      const ds = addDaysISO(start, w*7+d);
      if(ds>today){ cells += '<i class="f"></i>'; continue; }
      const p = dayPct(ds);
      const lv = p==null ? '' : p>=1 ? 'l4' : p>=.75 ? 'l3' : p>=.5 ? 'l2' : p>0 ? 'l1' : 'l0';
      if(p!=null && p>0) active++; if(p!=null && p>=1) perfect++;
      cells += `<i class="${lv} ${ds===today?'t':''}" title="${ds}${p==null?'':' · '+Math.round(p*100)+'%'}"></i>`;
    }
    cells += '</div>';
  }
  return `<section class="hm" aria-label="Last ${weeks} weeks">
    <div class="hm-h"><span>Last ${weeks} weeks</span><span class="hm-s">${active} active days · ${perfect} perfect</span></div>
    <div class="hm-grid">${cells}</div>
    <div class="hm-key"><span>Less</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>More</span></div>
  </section>`;
}
function weeklyRecapHtml(){

/* ============ CALORIES (from every task's calorie requirement) ============ */
function dayCalories(items){
  let eaten = 0, goal = 0;
  (items||[]).forEach(it=>{
    if(!it || !it.refId) return;
    taskReqList(it.refId).forEach(r=>{
      if(r.type!=='number' || !/kcal|cal/i.test(String(r.unit||'')+' '+String(r.label||''))) return;
      goal += Number(r.target)||0;
      eaten += Number((it.req||{})[r.id])||0;
    });
  });
  return {eaten, goal};
}

    body = open.length ? `<div class="wp-alert">You have ${open.length} LifeOS change${open.length===1?'':'s'} waiting. Bring ${open.length===1?'it':'them'} to Claude and get ${open.length===1?'it':'them'} built <b>before</b> you set up next week.</div>

    const ps = days.map(dayPct).filter(p=>p!=null), avg = ps.length ? Math.round(ps.reduce((a,b)=>a+b,0)/ps.length*100) : 0;
    const revs = days.filter(d=>(state.dailyReviews||{})[d]), wins = revs.map(d=>state.dailyReviews[d].biggestWin).filter(Boolean);

  } else if(wpStep===3){
    const lf = getActiveLifeFocus(), ef = getActiveEcommerceFocus(), nextSun = addDaysISO(mon,6);
    const box = (label, f, tab)=>{ const ends = f ? f.endDate : null; const covers = ends && ends>=nextSun;

    body = `<div class="hint" style="margin-top:0">Make sure next week has a Life Focus and an Ecommerce Focus. Tapping one takes you there; come back with Quick Add → Sunday plan.</div><div class="card">${box('Life Focus', lf, 'life')}${box('Ecommerce Focus', ef, 'ecommerce')}</div>`;
  } else if(wpStep===4){
    const od = state.reminders.filter(r=>!r.done && !r.dismissed && r.date && r.date<todayISO()).sort((a,b)=>a.date.localeCompare(b.date));
    body = od.length ? `<div class="hint" style="margin-top:0">${od.length} overdue. Move each to Monday, mark it done, or delete it.</div><div class="card">${od.map(r=>`<div class="row"><div class="row-text"><div class="row-title">${escapeHtml(r.title)}</div><div class="row-sub">Due ${escapeHtml(fmtDM(r.date))}</div></div>
      <button class="mini-chip on" onclick="wpRem('${r.id}','mon')">Mon</button><button class="mini-chip" onclick="wpRem('${r.id}','done')">Done</button><button class="mini-chip" style="color:var(--red)" onclick="wpRem('${r.id}','del')">✕</button></div>`).join('')}</div>`
      : `<div class="wp-ok">Nothing overdue. Clean slate.</div>`;
  } else if(wpStep===5){
    const sel = ((state.reminderTop3||{})[mon]||[]).map(String);
    const L = state.reminders.filter(r=>!r.done && !r.dismissed);
    body = `<div class="hint" style="margin-top:0">Pick up to 3 things that matter most on Monday (${escapeHtml(fmtDM(mon))}).</div>
      <div class="card">${L.length ? L.map(r=>`<div class="row" onclick="wpTop3('${r.id}')"><div class="checkbox ${sel.includes(String(r.id))?'checked':''}">${sel.includes(String(r.id))?'✓':''}</div><div class="row-text"><div class="row-title">${escapeHtml(r.title)}</div><div class="row-sub">${escapeHtml([r.date?fmtDM(r.date):'', r.category].filter(Boolean).join(' · '))}</div></div></div>`).join('') : `<div class="empty"><div class="msg">No open reminders.</div></div>`}</div>
      <button type="button" class="btn-secondary" style="width:100%;margin-top:10px" onclick="openCaptureSheet('reminder')">+ New reminder</button>`;
  } else {
    body = `<div class="wp-ok">Last step: download a backup so nothing can be lost.</div>
      <button type="button" class="btn-secondary" style="width:100%" onclick="exportData()">Download backup</button>
      <button type="button" class="btn-primary" style="width:100%;margin-top:12px" onclick="finishWeeklyPlan()">Finish planning</button>`;
  }
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="inboxView=null;closeSheet()">Close</button><h2>Sunday planning</h2><span style="width:40px"></span></div>
    <div class="sheet-body">
      <div class="wp-steps">${WP_STEPS.map((n,i)=>`<i class="${i<wpStep?'done':i===wpStep?'on':''}"></i>`).join('')}</div>
      <div class="wp-k">Step ${wpStep+1} of ${WP_STEPS.length}</div>
      <h3 class="wp-t">${WP_STEPS[wpStep]}</h3>
      ${body}
      <div class="wp-nav">${wpStep>0?`<button type="button" class="btn-secondary" onclick="wpGo(-1)">Back</button>`:'<span></span>'}${wpStep<WP_STEPS.length-1?`<button type="button" class="btn-primary" onclick="wpGo(1)">Next</button>`:''}</div>
    </div>`);
}
function wpRem(id, act){
  const r = state.reminders.find(x=>String(x.id)===String(id)); if(!r) return;
  if(act==='mon') r.date = planWeekKey(); else if(act==='done') r.done = true; else state.reminders = state.reminders.filter(x=>x!==r);
  saveState(); render(); renderWeeklyPlan();
}
function wpTop3(id){
  const mon = planWeekKey(); if(!state.reminderTop3) state.reminderTop3 = {};
  const L = (state.reminderTop3[mon]||[]).map(String); const i = L.indexOf(String(id));
  if(i>-1) L.splice(i,1); else { if(L.length>=3){ toast('Pick up to 3'); return; } L.push(String(id)); }
  state.reminderTop3[mon] = L; saveState(); renderWeeklyPlan();
}
function finishWeeklyPlan(){
  if(!state.weeklyPlans) state.weeklyPlans = {};
  state.weeklyPlans[planWeekKey()] = Date.now();
  saveState(); inboxView = null; closeSheet(); render(); celebrate(160, true); toast('Next week is planned');
}

function reviewMoveReminderTomorrow(dateStr, reminderId){
  const newDate = addDaysISO(dateStr, 1);
  if(window.LifeOSRescheduleReminder) window.LifeOSRescheduleReminder(reminderId, newDate);
  reviewRescheduledIds.add(String(reminderId));
  if(state.dailyReviews[dateStr]){

    set.add(String(reminderId));
    state.dailyReviews[dateStr].rescheduledReminderIds = Array.from(set);
