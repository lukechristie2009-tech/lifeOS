/* ---- Dashboard header + progress card (reference: habit app) ---- */
.dh-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 22px 14px;}
.dh-kicker{font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.dh-greet2{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px;}
.dh-clock{font-size:15px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-bottom:4px;}
.dh-frac{display:flex;align-items:baseline;gap:2px;margin-top:6px;line-height:1;}
.dh-frac b{font-size:58px;font-weight:300;letter-spacing:-.04em;}
.dh-frac span{font-size:30px;font-weight:300;color:var(--text-3);}
.dh-msg{font-size:var(--fs-s);color:var(--text-2);margin-top:6px;}
.dash-hero .ring .ring-num{font-size:20px !important;font-weight:600;}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid var(--sep);}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:6px;}
.wk-l{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.06em;}
.wk-b{width:100%;max-width:38px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--fill);color:var(--text-3);}
.wk-b.part{background:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--text);}
.wk-b.perfect{background:var(--accent);color:var(--accent-ink);}
.wk-b.future{background:transparent;border:1px dashed var(--sep);}
.wk-b.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent);}
.dh-chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px var(--gap) 0;}
.dh-chips3 .dh-chip{background:var(--card);border-radius:var(--radius);padding:10px 12px;margin:0;min-width:0;}
.dh-chips3 .dh-chip span{max-width:100%;}
.dh-next.plain{background:var(--card);}
.dh-next.plain .dn-dot{background:var(--text-3);box-shadow:none;}
.dh-next.plain .dn-k{color:var(--text-3);}
.dh-next{border-radius:var(--radius);margin-top:8px;}
.dh-stat{border-radius:var(--radius);}
.dh-stat .ds-unit{font-size:14px;font-weight:600;color:var(--text-2);}
.dash-hero{border-radius:var(--radius);}

.dh-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--sep);}
.dh-foot .ds-num{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.dh-foot .ds-lab{font-size:var(--fs-s);color:var(--text-3);margin-top:2px;}
.dh-foot .ds-unit{font-size:14px;font-weight:600;color:var(--text-2);}

/* ---- Routine boxes ---- */
.rt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 14px;}
.rt-wide{grid-column:1 / -1;background:var(--card-2);border-radius:var(--radius);overflow:hidden;}
.rt{background:var(--card);border-radius:var(--radius);padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative;cursor:pointer;
  transition:border-color .15s,opacity .15s,transform .12s;}
.rt:active{transform:scale(.985);}
.rt.wide{grid-column:1 / -1;}
.rt-top{display:flex;align-items:center;justify-content:space-between;min-height:18px;}
.rt-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}
.rt.next .rt-tag{color:var(--accent);}
.rt-more{background:none;border:none;color:var(--text-3);font-size:14px;letter-spacing:1px;padding:2px 4px;margin-right:-4px;line-height:1;}
.rt-title{font-size:15px;font-weight:600;line-height:1.28;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.rt-sub{font-size:var(--fs-xs);color:var(--text-3);font-weight:600;}
.rt-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px;}
.rt-links{display:flex;flex-wrap:wrap;gap:4px 10px;min-width:0;}
.rt-link{background:none;border:none;padding:2px 0;font-size:var(--fs-xs);font-weight:700;color:var(--accent);}
.rt-check{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--text-3);background:transparent;color:var(--accent-ink);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;opacity:.9;}
.rt-check svg{width:16px;height:16px;}
.rt-check:disabled{opacity:.4;}
.rt.done{border-color:color-mix(in srgb,var(--accent) 70%,transparent);}
.rt.done .rt-title{color:var(--text-3);text-decoration:line-through;}
.rt.done .rt-check,.rt-check.on{background:var(--accent);border-color:var(--accent);opacity:1;}
.rt.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px color-mix(in srgb,var(--accent) 22%,transparent);}
.rt-panel{border-top:1px solid var(--sep);margin:6px -12px 0;padding:0 12px;}
.rt-panel .merge-panel,.rt-panel .sub-panel{padding:6px 2px 8px;}
.rt-panel .nested-row + .nested-row::before{left:0;}
.xcard-body .rt-grid{padding-top:10px;}

[data-design] .xcard-body > .card{border:none;box-shadow:none;border-radius:0;background:none;margin:0;}
.card + .xcard,.xcard + .card,.xcard + .xcard{margin-top:10px;}
.xcard-body .tip-row{margin:8px 16px;}
[data-design="ember"] .streak-card .sc-reset{color:var(--accent-ink);opacity:.8;}
[data-design="ember"] .xcard-head:focus-visible,[data-design="ember"] .act-card:focus-visible,[data-design="ember"] .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

@media (max-width:360px){
  .dh-time{font-size:30px;}
  .dash-hero{padding:16px;}
}
@media (min-width:700px){
  .page{max-width:760px;margin-left:auto;margin-right:auto;}
  [data-design="ember"] .tabbar{max-width:520px;margin-left:auto;margin-right:auto;}
}

@media (prefers-reduced-motion:reduce){
  .page.active{animation:none;}
  .ring .ring-bar,.xcard-meter > i,.xcard-chev,.act-card{transition:none;}
}

/* =====================================================================
   LIFEOS 2.0 — ROUND 3 REDESIGN
   Warm graphite surfaces over the sunset, a serif for headings and the
   numbers that matter, line icons, and one focal element: the segmented
   ring (one segment per task). Surfaces are deliberately different:
   open hero, raised "Up next", tiled routine, grouped list.
===================================================================== */
:root{ --serif:"Newsreader","Iowan Old Style","Charter","Bitstream Charter",Georgia,serif; --raised:var(--card); }
:root[data-design="ember"]{
  --bg:#0E0B0A; --card:rgba(30,23,19,.74); --card-2:rgba(255,240,228,.05); --fill:rgba(255,240,228,.075);
  --raised:rgba(42,31,25,.94);
  --text:#F5EFE9; --text-2:#CBC1B7; --text-3:#968A80;
  --sep:rgba(255,236,220,.09); --sep-2:rgba(255,236,220,.18);
  --radius:8px; --radius-sm:6px;
}
:root[data-design="ember"][data-theme="light"]{
  --card:rgba(255,255,255,.72); --raised:rgba(255,255,255,.94); --fill:rgba(70,40,20,.065);
  --text:#1E1813; --text-2:#4C4037; --text-3:#85786C; --sep:rgba(70,40,20,.11); --sep-2:rgba(70,40,20,.22);
}

/* ---- global refinements (Ember) ---- */
[data-design="ember"] .header h1{font-family:var(--serif);font-weight:500;font-size:36px;letter-spacing:-.012em;line-height:1.08;}
[data-design="ember"] .header .sub{font-size:14px;color:var(--text-3);margin-top:6px;}
[data-design="ember"] .section-label{text-transform:none;letter-spacing:0;font-size:15px;font-weight:600;color:var(--text);padding:28px 20px 10px;}
[data-design="ember"] .sheet-body > .section-label{font-size:14px;padding:18px 4px 8px;}
[data-design="ember"] .field > label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text-3);}
[data-design="ember"] .row-title{font-weight:500;}
[data-design="ember"] .card{background:var(--card);}
[data-design="ember"] .sheet,[data-design="ember"] .note-page{background:#16110E;border-radius:14px 14px 0 0;}
[data-design="ember"] .sheet-header h2{font-weight:600;}
[data-design="ember"] .tab.active{background:var(--fill);color:var(--accent);}
[data-design="ember"] .tabbar{background:rgba(20,15,12,.86);}
[data-design="ember"][data-theme="light"] .tabbar{background:rgba(255,250,245,.9);}
[data-design="ember"] .btn-primary:disabled{opacity:.45;}
[data-design="ember"] .seg-btn.active,[data-design="ember"][data-theme="dark"] .seg-btn.active{background:rgba(255,240,228,.13);color:var(--text);}
[data-design="ember"][data-theme="light"] .seg-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(70,40,20,.15);}
[data-design="ember"] .tip-row{background:var(--fill);color:var(--text-2);}
[data-design="ember"] .tip-row button{color:var(--accent);}

/* ---- dashboard header ---- */
.dz-head{padding:6px 20px 0;}
.dz-date{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;font-weight:500;color:var(--text-3);font-variant-numeric:tabular-nums;}
.dz-clock{color:var(--text-2);}
.dz-greet{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.08;letter-spacing:-.012em;margin:8px 0 0;text-wrap:balance;}
.dz-status{display:flex;align-items:baseline;gap:9px;margin-top:10px;font-size:14px;line-height:1.4;color:var(--text-2);}
.dz-status i{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex-shrink:0;transform:translateY(-1px);}
.dz-status b{font-weight:600;color:var(--text);}
.dz-st-sub{margin-left:.32em;}
.dz-status.live i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}

/* ---- hero: segmented ring + stats + week ---- */
.dz-hero{margin:20px var(--gap) 0;display:grid;grid-template-columns:auto 1fr;gap:18px 22px;align-items:center;}
.dz-ring{position:relative;width:156px;height:156px;}
.sr{display:block;transform:rotate(-90deg);}
.sr circle{fill:none;}
.sr .sr-p{stroke:var(--fill);}
.sr .sr-d{stroke:var(--accent);}
.sr .sr-n{stroke:color-mix(in srgb,var(--accent) 42%,transparent);}
.dz-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dz-ring-c b{font-family:var(--serif);font-size:56px;font-weight:400;line-height:.95;font-variant-numeric:lining-nums tabular-nums;}
.dz-ring-c span{font-size:13px;color:var(--text-3);margin-top:6px;}
.dz-stats{margin:0;min-width:0;}
.dz-stats > div{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:9px 0;}
.dz-stats > div + div{border-top:1px solid var(--sep);}
.dz-stats dt{font-size:13px;color:var(--text-3);}
.dz-stats dd{margin:0;font-family:var(--serif);font-size:26px;line-height:1;font-variant-numeric:lining-nums tabular-nums;}
.dz-stats dd small{font-size:15px;color:var(--text-3);margin-left:1px;}
.wb{grid-column:1 / -1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.wb-d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 9px;border-radius:6px;}
.wb-l{font-size:11px;font-weight:600;color:var(--text-3);}
.wb-n{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2);line-height:1.2;}
.wb-c{position:relative;width:62%;height:3px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:4px;}
.wb-c i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 65%,transparent);border-radius:2px;}
.wb-d.perfect .wb-c i{background:var(--accent);}
.wb-d.future .wb-n{color:var(--text-3);opacity:.7;}
.wb-d.future .wb-c{background:transparent;box-shadow:inset 0 0 0 1px var(--sep);}
.wb-d.today{background:var(--accent-soft);}
.wb-d.today .wb-l,.wb-d.today .wb-n{color:var(--accent);}
.dz-msg{grid-column:1 / -1;margin:0;font-size:14px;color:var(--text-2);}

/* ---- context bar (day type, focuses) ---- */
.ctx{margin:20px var(--gap) 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.ctx-c{background:none;border:0;padding:10px 12px 11px;text-align:left;color:var(--text);min-width:0;font:inherit;display:flex;flex-direction:column;gap:2px;}
.ctx-c + .ctx-c{border-left:1px solid var(--sep);}
.ctx-c:disabled{opacity:1;cursor:default;}
.ctx-c:not(:disabled):active{background:var(--fill);}
.ctx-c small{font-size:12px;color:var(--text-3);}
.ctx-c span{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dz-notice{margin:8px var(--gap) 0;}
[data-design] .dz-notice .card{margin:0;border:0 !important;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;}
.dz-notice .row{padding:2px 4px;min-height:0;}
.dz-notice .row-text{display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;}
.dz-notice .row-title{font-size:13px;font-weight:600;color:var(--accent);}
.dz-notice .row-sub{font-size:13px;margin:0;}

/* ---- Up next ---- */
.un{margin:16px var(--gap) 0;padding:16px 16px 14px;background:var(--raised);border:1px solid color-mix(in srgb,var(--accent) 34%,var(--sep));border-radius:var(--radius);
  box-shadow:0 22px 44px -18px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
[data-theme="light"] .un{box-shadow:0 18px 40px -20px rgba(120,60,20,.35);}
.un-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;}
.un-k{font-weight:600;color:var(--accent);}
.un-time{color:var(--text-2);font-variant-numeric:tabular-nums;}
.un-main{display:flex;align-items:center;gap:12px;margin-top:12px;border-radius:6px;}
.un-main[role=button]{cursor:pointer;}
.un-ico{width:42px;height:42px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.un-ico svg{width:23px;height:23px;}
.un-title{font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.2;min-width:0;overflow-wrap:anywhere;}
.un-pct{margin-left:auto;font-family:var(--serif);font-size:24px;color:var(--text-2);font-variant-numeric:lining-nums tabular-nums;}
.un-bar{height:3px;border-radius:2px;background:var(--fill);margin:14px 0 4px;overflow:hidden;}
.un-bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease;}
.un-list{list-style:none;margin:0;padding:0;}
.un-list li{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px;color:var(--text-2);}
.un-list li + li{border-top:1px solid var(--sep);}
.un-mark{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--sep-2,var(--text-3));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent-ink);}
.un-mark svg{width:11px;height:11px;}
.un-list li.ok .un-mark{background:var(--accent);border-color:var(--accent);}
.un-list li.ok .un-req{color:var(--text-3);}
.un-req em{font-style:normal;font-size:12px;color:var(--text-3);margin-left:4px;}
.un-val{margin-left:auto;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.un-actions{display:flex;gap:8px;margin-top:14px;}
.un-btn{flex:1;border:0;border-radius:6px;padding:13px 14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:15px;font-weight:650;}
.un-btn:active{transform:scale(.985);}
.un-opt{border:1px solid var(--sep-2,var(--sep));background:transparent;color:var(--text-2);border-radius:6px;padding:12px 14px;font:inherit;font-size:14px;font-weight:500;}
.un-hint{margin-top:12px;font-size:13px;color:var(--text-3);}
.un .rq-list.compact{margin-top:4px;}
.un-pct small{font-size:14px;color:var(--text-3);margin-left:1px;}
.un-opt.icon{width:46px;padding:0;display:flex;align-items:center;justify-content:center;}

/* ---- main focus (quiet line under Up next) ---- */
[data-design] .dz-mf .mf-card{margin:10px var(--gap) 0;border:1px solid var(--sep);border-left:1px solid var(--sep);background:var(--card);padding:12px 14px;}
[data-design] .dz-mf .mf-card.empty{border-style:dashed;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;cursor:pointer;}
.dz-mf .mf-label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--text-3);}
.dz-mf .mf-empty{font-size:15px;color:var(--text-2);margin-top:3px;}
.dz-mf .mf-check{border-color:var(--accent);width:24px;height:24px;}
.dz-mf .mf-card.done .mf-check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.dz-mf .mf-text{font-size:16px;}

/* ---- section headings ---- */
.dz-sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:30px 20px 4px;}
.dz-sec-head h2{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.1;}
.dz-hint{margin:10px 20px 0;}
#todayRoutineCard > .tip-row{margin-top:12px;}

/* ---- routine sections + compact tiles with dropdowns ---- */
.rs{margin:0 var(--gap);}
.rs-head{display:flex;align-items:center;gap:10px;padding:18px 2px 8px;}
.rs-head h3{font-size:14px;font-weight:600;margin:0;letter-spacing:.005em;}
.rs-now{font-size:11px;font-weight:650;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 6px;line-height:1.3;}
.rs-count{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.rs-bar{flex:1;height:2px;background:var(--sep);border-radius:1px;overflow:hidden;}
.rs-bar i{display:block;height:100%;background:var(--accent);}
.rs .rt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0;grid-auto-flow:row dense;}
[data-design] .rs .rt{display:block;padding:0;min-height:0;gap:0;background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);cursor:default;transform:none;transition:border-color .15s;}
[data-theme="light"] .rs .rt{box-shadow:0 1px 2px rgba(70,40,20,.06);}
.rs .rt.open{grid-column:1 / -1;}
.rt-face{display:flex;flex-direction:column;gap:7px;min-height:72px;padding:10px 10px 9px 12px;cursor:pointer;border-radius:inherit;-webkit-tap-highlight-color:transparent;}
.rt-face:active{background:var(--fill);}
.rt-l1{display:flex;align-items:flex-start;gap:8px;}
.rs .rt-title{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.25;letter-spacing:-.005em;padding-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
.rs .rt-check{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sep-2,var(--text-3));background:transparent;opacity:1;position:relative;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;padding:0;color:var(--accent-ink);}
.rs .rt-check svg{width:15px;height:15px;}
.rs .rt-check.has-req{border:0;}
.rs .rt-check .mr{position:absolute;inset:0;width:30px;height:30px;transform:rotate(-90deg);}
.mr circle{fill:none;stroke-width:2.5;}
.mr .mr-t{stroke:var(--sep-2,var(--fill));}
.mr .mr-b{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
.rt-l2{display:flex;align-items:center;gap:6px;min-height:22px;margin-top:auto;}
.rs .rt-ico{width:16px;height:16px;background:none;border-radius:0;color:var(--text-3);flex-shrink:0;display:flex;}
.rs .rt-ico svg{width:16px;height:16px;}
.rt-time{font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;margin:0;}
.rs .rt-sub{flex:1;min-width:0;font-size:12px;font-weight:500;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.rt-flags{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.rt-flags .f-note{width:5px;height:5px;border-radius:50%;background:var(--text-3);}
.rt-flags b{font-size:11px;font-weight:600;color:var(--text-3);}
.rt-drop{width:26px;height:24px;margin:-3px -5px -3px 0;border:0;background:none;color:var(--text-3);display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0;padding:0;}
.rt-drop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease;}
.rt.open .rt-drop svg{transform:rotate(180deg);}
.rt-drop:focus-visible,.rt-check:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
[data-design] .rs .rt.done{background:color-mix(in srgb,var(--card) 45%,transparent);}
.rs .rt.done .rt-title{color:var(--text-3);text-decoration:none;}
.rs .rt.done .rt-ico{color:var(--accent);}
.rs .rt.done .rt-check,.rs .rt-check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
[data-design] .rs .rt.next{border-color:color-mix(in srgb,var(--accent) 58%,transparent);}
.rs .rt.next .rt-ico{color:var(--accent);}
[data-design] .rs .rt.open{border-color:var(--sep-2,var(--sep));}
[data-design] .rs .rt.open.next{border-color:color-mix(in srgb,var(--accent) 58%,transparent);}
.rs .rt.open .rt-face{min-height:0;}
.rs .rt.open .rt-title{-webkit-line-clamp:unset;}
.rs .rt-wide{grid-column:1 / -1;background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);}

/* dropdown */
.rt-dd{display:none;border-top:1px solid var(--sep);padding:2px 12px 12px;cursor:default;}
.rt.open .rt-dd{display:block;}
.dd-sec{padding-top:12px;}
.dd-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:4px;}
.dd-side{font-weight:500;font-variant-numeric:tabular-nums;}
.dd-empty{font-size:13.5px;color:var(--text-3);padding:4px 0;}
.dd-link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;}
.dd-note,.rq-textarea{display:block;width:100%;resize:vertical;background:var(--fill);border:1px solid var(--sep);border-radius:6px;color:var(--text);font:inherit;font-size:14px;line-height:1.45;padding:9px 10px;min-height:42px;}
.dd-note:focus,.rq-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.dd-note::placeholder,.rq-textarea::placeholder{color:var(--text-3);}
.dd-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.dd-btn{flex:1 1 80px;border:0;border-radius:6px;padding:10px 12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:14px;font-weight:650;}
.dd-btn.ghost{flex:0 0 auto;background:transparent;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--sep-2,var(--sep));font-weight:550;}
.dd-btn.icon{width:40px;padding:0;display:flex;align-items:center;justify-content:center;}
.dd-btn.icon svg,.un-opt.icon svg{width:18px;height:18px;fill:currentColor;}
.dd-btn.is-blocked,.un-btn.is-blocked,.rq-cta.is-blocked{background:var(--fill);color:var(--text-3);opacity:1;box-shadow:inset 0 0 0 1px var(--sep);}
.dd-btn:active,.un-btn:active{transform:scale(.985);}
.rt-dd .merge-panel{padding:0;}
.rt-dd{background:rgba(0,0,0,.14);border-radius:0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);}
[data-theme="light"] .rt-dd{background:rgba(70,40,20,.03);}
.dd-add{display:inline-block;margin-top:8px;font-size:13px;}
.dd-btn.icon,.un-opt.icon{min-height:40px;}
.dd-actions .dd-btn.ghost{padding:10px 14px;}
input[type=number].rq-input::-webkit-inner-spin-button,input[type=number].rq-input::-webkit-outer-spin-button,.re-row input[type=number]::-webkit-inner-spin-button,.re-row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number].rq-input,.re-row input[type=number]{-moz-appearance:textfield;appearance:textfield;}
.re-row label{width:64px;}


/* ---- grouped list (everything else) ---- */
.dz-list{margin:6px var(--gap) 0;background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
[data-design] .dz-list > .xcard,[data-design] .dz-list > .card{margin:0 !important;border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;}
.dz-list > * + *{border-top:1px solid var(--sep) !important;}
.dz-list .xcard-head{min-height:58px;}
.dz-list .xcard-title,.dz-list > .card .row-title{font-size:15px;font-weight:600;}
.dz-quote{margin:34px 26px 10px;padding:0;border:0;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45;color:var(--text-2);text-wrap:pretty;}

/* ---- requirement controls (dropdown, Up next, sheet) ---- */
.rq-head{display:flex;align-items:center;gap:12px;margin:2px 2px 14px;}
.rq-prog{flex:1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;}
.rq-prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease;}
.rq-head span{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
.rq-list{background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;}
.rq-row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:54px;}
.rq-row.stack{padding-bottom:8px;min-height:0;}
.rq-row.has-meter{padding-bottom:8px;}
.rq-list > * + *{border-top:1px solid var(--sep);}
.rq-list > .rq-meter,.rq-list > .rq-textwrap,.rq-list > .rq-steps{border-top:0 !important;}
.rq-mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sep-2,var(--text-3));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent-ink);}
.rq-mark.on{background:var(--accent);border-color:var(--accent);}
.rq-mark svg{width:12px;height:12px;}
.rq-text{flex:1;min-width:0;display:flex;flex-direction:column;}
.rq-label{font-size:15px;font-weight:600;line-height:1.3;}
.rq-row.ok .rq-label{color:var(--text-2);}
.rq-opt{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--text-3);border:1px solid var(--sep);border-radius:4px;padding:0 5px;vertical-align:1px;}
.rq-detail{font-size:12.5px;color:var(--text-3);margin-top:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rq-input{width:96px;flex-shrink:0;background:var(--fill);border:1px solid var(--sep);color:var(--text);border-radius:6px;padding:9px 10px;font:inherit;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;}
.rq-input[type=time]{width:118px;text-align:left;color-scheme:dark;}
[data-theme="light"] .rq-input[type=time]{color-scheme:light;}
.rq-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.rq-num{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.rq-num .rq-input{width:82px;}
.rq-num span{font-size:12.5px;color:var(--text-3);min-width:22px;}
.rq-mini{flex-shrink:0;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;}
.rq-meter{height:4px;border-radius:2px;background:var(--fill);margin:0 14px 12px 48px;overflow:hidden;}
.rq-meter i{display:block;height:100%;background:var(--accent);border-radius:2px;}
.rq-textwrap{padding:0 14px 12px 48px;}
.rq-steps{display:flex;flex-direction:column;padding:0 0 6px 34px;}
.rq-step{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px;background:none;border:0;color:var(--text);font:inherit;font-size:14px;text-align:left;border-radius:6px;}
.rq-step .rq-mark{width:20px;height:20px;}
.rq-step .rq-mark svg{width:11px;height:11px;}
.rq-step.ok span:last-child{color:var(--text-3);}
.rq-step:active{background:var(--fill);}
button.rq-tap{width:100%;background:none;border:0;border-radius:0;color:inherit;font:inherit;text-align:left;cursor:pointer;}
button.rq-tap:active{background:var(--fill);}
button.rq-tap:focus-visible,.rq-step:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.rq-list > * + .rq-tap{border-top:1px solid var(--sep);}
/* embedded lists (dropdown + Up next) sit flush, no box */
.rt-dd .rq-list,.rq-list.compact{background:none;border:0;border-radius:0;overflow:visible;}
.rt-dd .rq-row,.rq-list.compact .rq-row{padding:9px 0;min-height:48px;}
.rt-dd .rq-row.stack,.rq-list.compact .rq-row.stack,.rt-dd .rq-row.has-meter,.rq-list.compact .rq-row.has-meter{padding-bottom:6px;min-height:0;}
.rt-dd .rq-meter,.rq-list.compact .rq-meter{margin:0 0 10px 34px;}
.rt-dd .rq-textwrap,.rq-list.compact .rq-textwrap{padding:0 0 10px 34px;}
.rt-dd .rq-steps,.rq-list.compact .rq-steps{padding-left:22px;}
.rt-dd .dd-sec > .rq-steps,.un-steps{padding:0;}
.rt-dd .rq-step,.rq-list.compact .rq-step,.un-steps .rq-step{padding:7px 0 7px 12px;}
.rt-dd .dd-sec > .rq-steps .rq-step,.un-steps .rq-step{padding-left:0;}
.rq-empty{padding:16px 14px;color:var(--text-3);font-size:14px;}
.rq-cta{width:100%;margin-top:16px;}

/* ---- requirement editor ---- */
.re-head{margin:2px 2px 16px;}
.re-task{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.15;letter-spacing:-.01em;}
.re-sub{font-size:13px;color:var(--text-3);margin-top:4px;line-height:1.4;}
.re-card{background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.re-top{display:flex;align-items:center;gap:8px;}
.re-type{flex:1;min-width:0;-webkit-appearance:none;appearance:none;background-color:var(--fill);border:1px solid var(--sep);border-radius:6px;color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:9px 30px 9px 10px;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;}
.re-tools{display:flex;gap:4px;flex-shrink:0;}
.re-ico{width:34px;height:34px;border-radius:6px;border:1px solid var(--sep);background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;padding:0;}
.re-ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.re-ico:disabled{opacity:.3;}
.re-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.re-row label{width:96px;flex-shrink:0;font-size:13px;color:var(--text-3);}
.re-row input{flex:1;min-width:0;background:var(--fill);border:1px solid var(--sep);border-radius:6px;color:var(--text);font:inherit;font-size:15px;padding:9px 10px;}
.re-row input:focus,.re-type:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.re-row input.re-unit{flex:0 0 78px;}
.re-row input[type=time]{color-scheme:dark;}
[data-theme="light"] .re-row input[type=time]{color-scheme:light;}
.re-note{font-size:12.5px;color:var(--text-3);margin-top:10px;line-height:1.45;}
.re-optional{display:flex;align-items:center;gap:10px;margin-top:12px;background:none;border:0;color:var(--text-2);font:inherit;font-size:13.5px;padding:2px 0;text-align:left;}
.re-optional .rq-mark{width:20px;height:20px;}
.re-add{width:100%;margin-top:4px;}
.re-reset{display:block;margin:16px auto 4px;background:none;border:0;color:var(--text-3);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;}
.re-empty{padding:18px;text-align:center;color:var(--text-3);font-size:14px;border:1px dashed var(--sep-2,var(--sep));border-radius:var(--radius);margin-bottom:10px;}
.rs-ico{width:30px;height:30px;border-radius:6px;background:var(--fill);color:var(--text-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rs-ico svg{width:17px;height:17px;}

/* ---- Activities ---- */
[data-design="ember"] .streak-card{background:var(--raised);color:var(--text);border:1px solid var(--sep);position:relative;overflow:hidden;padding:18px 18px 12px;}
[data-design="ember"] .streak-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 120% at 100% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 62%);}
[data-design="ember"] .streak-card > *{position:relative;}
[data-design="ember"] .streak-card .sc-label{text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;color:var(--text-2);opacity:1;}
[data-design="ember"] .streak-card .sc-num{font-family:var(--serif);font-weight:400;font-size:52px;letter-spacing:-.01em;line-height:1.05;margin-top:4px;font-variant-numeric:lining-nums;}
[data-design="ember"] .panic-btn{background:var(--accent);color:var(--accent-ink);border:0;font-weight:650;}
[data-design="ember"] .panic-btn .pb-dot{background:var(--accent-ink);}
[data-design="ember"] .streak-card .sc-reset{color:var(--text-3);opacity:1;}
[data-design="ember"] .act-grid{gap:8px;}
[data-design="ember"] .act-card{background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);padding:14px;min-height:118px;gap:12px;}
[data-design="ember"] .act-ico{width:34px;height:34px;border-radius:7px;background:var(--fill);color:var(--text-2);}
[data-design="ember"] .act-ico svg{width:19px;height:19px;stroke-width:1.7;}
[data-design="ember"] .act-name{font-size:15px;font-weight:600;}
[data-design="ember"] .act-stat{font-size:13px;}
[data-design="ember"] .act-meter{height:3px;}
[data-design="ember"] .act-card.wide{min-height:0;padding:12px 14px;gap:12px;}
[data-design="ember"] .act-card.wide::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--text-3);border-top:1.5px solid var(--text-3);transform:rotate(45deg);margin-left:auto;margin-right:4px;flex-shrink:0;}

@media (max-width:360px){
  .dz-greet{font-size:31px;}
  .dz-hero{grid-template-columns:1fr;justify-items:center;}
  .dz-stats{width:100%;}
  .wb,.dz-msg{width:100%;}
  .ctx{grid-template-columns:1fr;}
  .ctx-c + .ctx-c{border-left:0;border-top:1px solid var(--sep);}
  .ctx-c{flex-direction:row;justify-content:space-between;align-items:baseline;}
}
@media (min-width:700px){
  .dz-stats{max-width:420px;justify-self:end;width:100%;}
  .rs .rt-grid{grid-template-columns:repeat(3,1fr);}
}
@media (prefers-reduced-motion:reduce){
  .un-bar i,.mr .mr-b,.rq-prog i,.rq-toggle,.rq-toggle i{transition:none;}
}

/* =====================================================================
   SUPER SIMPLE design — flat, quiet, one column. Additive: it only
   restyles/hides things when data-design="simple"; no data is changed.
===================================================================== */
.sp{display:none;}
:root[data-design="simple"]{
  --accent:#2F6FEB; --accent-ink:#FFFFFF; --accent-soft:rgba(47,111,235,.10);
  --bg:#F6F6F7; --card:#FFFFFF; --card-2:#F1F1F3; --raised:#FFFFFF; --fill:rgba(0,0,0,.05);
  --text:#111113; --text-2:#3A3A40; --text-3:#6A6A73;
  --sep:rgba(0,0,0,.08); --sep-2:rgba(0,0,0,.16); --tabbar:#FFFFFF; --shadow:none;
  --radius:12px; --radius-sm:8px; --tabbar-h:58px;
  --hero-1:#2F6FEB; --hero-2:#2F6FEB; --streak-1:#2B2B31; --streak-2:#2B2B31;
  --serif:var(--font);
}
:root[data-design="simple"][data-theme="dark"]{
  --accent:#5B8DEF; --accent-ink:#0B0B0D; --accent-soft:rgba(91,141,239,.16);
  --bg:#0E0E10; --card:#18181B; --card-2:#222226; --raised:#18181B; --fill:rgba(255,255,255,.07);
  --text:#F3F3F4; --text-2:#D2D2D6; --text-3:#9B9BA3;
  --sep:rgba(255,255,255,.09); --sep-2:rgba(255,255,255,.18); --tabbar:#18181B;
}
[data-design="simple"] body{background:var(--bg);}
[data-design="simple"] .card,[data-design="simple"] .xcard,[data-design="simple"] .act-card,[data-design="simple"] .stat-card{
  background:var(--card);border:1px solid var(--sep);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;}
[data-design="simple"] .tabbar{background:var(--tabbar);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--sep);box-shadow:none;}
[data-design="simple"] .tab{font-size:11px;}
[data-design="simple"] .tab.active{color:var(--accent);background:none;}
[data-design="simple"] .header h1,[data-design="simple"] .dz-greet{font-family:var(--font);font-weight:700;font-size:30px;letter-spacing:-.02em;}
[data-design="simple"] .section-label{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--text-3);padding:24px 20px 8px;}
[data-design="simple"] .sheet,[data-design="simple"] .note-page{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;}
[data-design="simple"] .btn-primary{background:var(--accent);color:var(--accent-ink);background-image:none;}
[data-design="simple"] .fab{background:var(--accent);color:var(--accent-ink);background-image:none;box-shadow:0 2px 8px rgba(0,0,0,.18);}
/* Dashboard: only what is needed right now */
[data-design="simple"] .dz-hero,[data-design="simple"] .ctx,[data-design="simple"] .un,
[data-design="simple"] .dz-mf:not(.sm-mf),[data-design="simple"] .dz-quote,[data-design="simple"] .rs-bar,
[data-design="simple"] .dz-sec-head .show-times-btn{display:none;}
[data-design="simple"] .dz-head{padding:10px 20px 0;}
[data-design="simple"] .dz-date{font-size:14px;color:var(--text-3);}
[data-design="simple"] .sp{display:block;margin:18px var(--gap) 0;padding:14px 16px;background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);}
[data-design="simple"] .sp-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
[data-design="simple"] .sp-n{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;}
[data-design="simple"] .sp-m{font-size:14px;color:var(--text-3);}
[data-design="simple"] .sp-bar{height:6px;border-radius:3px;background:var(--fill);margin-top:10px;overflow:hidden;}
[data-design="simple"] .sp-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease;}
[data-design="simple"] .dz-sec-head{padding-top:6px;}
/* Routine = one clean list per part of the day */
[data-design="simple"] .rs-head{padding:20px 4px 8px;}
[data-design="simple"] .rs-head h3{font-size:14px;font-weight:600;color:var(--text-3);}
[data-design="simple"] .rs-now{background:none;padding:0;color:var(--accent);}
[data-design="simple"] .rs .rt-grid{display:block;background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden;}
[data-design="simple"] .rs .rt-wide{background:none;border-radius:0;}
[data-design="simple"] .rs .rt{border:0;border-bottom:1px solid var(--sep);border-radius:0;background:none;box-shadow:none;margin:0;}
[data-design="simple"] .rs .rt:last-child{border-bottom:0;}
[data-design="simple"] .rs .rt.next,[data-design="simple"] .rs .rt.open,[data-design="simple"] .rs .rt.done{border-color:var(--sep);background:none;box-shadow:none;}
[data-design="simple"] .rs .rt-face{flex-direction:row;align-items:center;gap:12px;min-height:56px;padding:10px 14px;}
[data-design="simple"] .rs .rt-l1,[data-design="simple"] .rs .rt-l2{display:contents;}
[data-design="simple"] .rs .rt-check{order:0;width:30px;height:30px;}
[data-design="simple"] .rs .rt-title{order:1;flex:1;font-size:16px;font-weight:500;padding:0;-webkit-line-clamp:3;}
[data-design="simple"] .rs .rt-ico{display:none;}
[data-design="simple"] .rs .rt-time{order:2;font-size:13px;color:var(--text-3);font-weight:500;}
[data-design="simple"] .rs .rt-sub{order:3;flex:0 1 auto;max-width:38%;font-size:13px;}
[data-design="simple"] .rs .rt-flags{order:4;}
[data-design="simple"] .rs .rt-drop{order:5;margin:0;width:32px;height:32px;}
[data-design="simple"] .rs .rt.next .rt-title{font-weight:650;}
[data-design="simple"] .rs .rt.done .rt-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--sep-2);}
[data-design="simple"] .rs .rt.pending .rt-check{opacity:1;}
[data-design="simple"] .rs .rt-panel,[data-design="simple"] .rs .rt-dd{border-top:1px solid var(--sep);}
[data-design="simple"] .dz-list .xcard-head{min-height:56px;}
[data-design="simple"] .sd-switch{display:block;margin:22px var(--gap) 0;}
.sd-switch{display:none;}

/* ---- Super Simple: style layer (colour + softness, still one column) ---- */
:root[data-design="simple"]{
  --accent:#6C5CE7; --accent-ink:#FFFFFF; --accent-soft:rgba(108,92,231,.12);
  --bg:#F4F2FB; --card:#FFFFFF; --sep:rgba(60,40,120,.08); --sep-2:rgba(60,40,120,.18);
  --radius:20px; --radius-sm:12px; --shadow:0 6px 20px rgba(80,60,160,.07);
  --c-morning:#F5A524; --c-afternoon:#3B82F6; --c-evening:#8B5CF6; --ok:#22C58B;
}
:root[data-design="simple"][data-theme="dark"]{
  --accent:#8B7CFF; --accent-ink:#0D0B1A; --accent-soft:rgba(139,124,255,.16);

  --shadow:none; --c-morning:#FFC15A; --c-afternoon:#6AA3FF; --c-evening:#A996FF; --ok:#3DDBA0;
}
[data-design="simple"] body{background:radial-gradient(120% 40% at 50% 0%,var(--accent-soft),transparent 70%) no-repeat,var(--bg);background-color:var(--bg);}

[data-design="simple"] .rs .rt-grid,[data-design="simple"] .sp{border:0;box-shadow:var(--shadow);}

[data-design="simple"] .dz-date{font-weight:600;letter-spacing:.02em;}
[data-design="simple"] .dz-status.live i{background:var(--ok);}
/* focal element: the progress card */

/* time-of-day colour */
[data-design="simple"] .rs{--c:var(--c-morning);}
[data-design="simple"] .rs:nth-of-type(2){--c:var(--c-afternoon);}
[data-design="simple"] .rs:nth-of-type(3){--c:var(--c-evening);}
[data-design="simple"] .rs-head h3{color:var(--text);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
[data-design="simple"] .rs-head h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);}
[data-design="simple"] .rs-now{background:var(--accent-soft);padding:2px 8px;border-radius:99px;font-weight:700;}

[data-design="simple"] .rs .rt-grid{border-radius:22px;}
[data-design="simple"] .rs .rt-check{border:2px solid var(--c);}
[data-design="simple"] .rs .rt-check.has-req{border:0;}

[data-design="simple"] .rs .rt.next .rt-check{border-color:var(--accent);}

[data-design="simple"] .page-wrap,[data-design="simple"] .page{padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 36px);}

[data-design="simple"] .section-label{color:var(--text);font-weight:700;font-size:15px;}

<script>
/* LIFEOS_LEARNING_ROUTINE_DEFAULT */
(function() {
  // Ensure any newly-created focus routine includes the Learning routine item.
  // This is intentionally additive and leaves existing routine data untouched.
  window.LifeOSEnsureLearningRoutine = function(focus) {
    if (!focus || !Array.isArray(focus.routines)) return focus;
    var hasLearning = focus.routines.some(function(r) {
      return String(r.title || r.name || '').trim().toLowerCase() === 'learning';
    });
    if (!hasLearning) {
      focus.routines.push({
        id: 'learning-' + Date.now(),
        title: 'Learning',
        time: '21:15',
        completed: false,
        notes: ''
      });
    }
    return focus;
  };
})();
</script>


<script>
/* LIFEOS_SKILL_SESSION_PROGRESS_V2 */
(function(){
  window.ensureSkillModel = function(skill){
    if(!skill) return skill;
    if(skill.targetSessions == null){
      skill.targetSessions = skill.sessionsTarget || skill.goalSessions || skill.masterySessions || 1;
    }
    if(skill.sessionsCompleted == null){
      skill.sessionsCompleted = skill.sessions || skill.completedSessions || 0;
    }
    skill.targetSessions = Math.max(1, Math.floor(Number(skill.targetSessions) || 1));
    skill.sessionsCompleted = Math.max(0, Math.floor(Number(skill.sessionsCompleted) || 0));
    skill.sessions = skill.sessionsCompleted;
    skill.masterySessions = skill.targetSessions;
    skill.progress = Math.min(100, Math.round((skill.sessionsCompleted / skill.targetSessions) * 100));
    return skill;
  }

  window.LifeOSUpdateSkillProgress = function(skill, learned){
    ensureSkillModel(skill);
    if(learned) skill.sessionsCompleted = Math.min(skill.targetSessions, skill.sessionsCompleted + 1);
    else skill.sessionsCompleted = Math.max(0, skill.sessionsCompleted - 1);
    skill.sessions = skill.sessionsCompleted;
    skill.progress = Math.min(100, Math.round((skill.sessionsCompleted / skill.targetSessions) * 100));
    return skill;
  };

  window.LifeOSSkillProgressLabel = function(skill){
    ensureSkillModel(skill);
    return skill.sessionsCompleted + " / " + skill.targetSessions + " sessions · " + skill.progress + "%";
  };

  // Patch common skill form creation: if the app asks for a target, preserve it as targetSessions.
  document.addEventListener('change', function(e){
    var el = e.target;
    if(!el || !el.id) return;
    if(/skill.*(session|sessions)|target.*session|session.*target/i.test(el.id)){
      var v = Math.max(1, Number(el.value)||1);
      el.value = v;
    }
  }, true);

  // Make a small helper available to existing skill selectors/click handlers.
  window.LifeOSRecordLearningSession = function(skill){
    if(!skill) return;
    window.LifeOSUpdateSkillProgress(skill, true);
  };
})();
</script>

(function(){
  /*
    Additive reminder metadata:
      state.reminderTop3 = { "YYYY-MM-DD": ["reminderId", ...] }
    This is deliberately stored in the normal LifeOS state so export/import
    carries it with the rest of the backup.
  */
  function getState(){ return window.state || window.appState || null; }

  function key(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function todayKey(){ return key(new Date()); }
  function tomorrowKey(){
    var d=new Date(); d.setDate(d.getDate()+1); return key(d);
  }
  function ensure(s){
    if(!s) return;
    if(!s.reminderTop3 || typeof s.reminderTop3!=="object") s.reminderTop3={};
    Object.keys(s.reminderTop3).forEach(function(k){
      if(!Array.isArray(s.reminderTop3[k])) delete s.reminderTop3[k];
      else s.reminderTop3[k]=s.reminderTop3[k].map(String).slice(0,3);
    });
  }
  function saveRender(){
    if(typeof window.saveState==="function") window.saveState();
    if(typeof window.render==="function") window.render();
  }
  function remindersFor(s, includeCompleted){
    return (s && Array.isArray(s.reminders) ? s.reminders : []).filter(function(r){
      if(r.dismissed) return false;
      return includeCompleted ? true : !(r.done || r.completed);
    });
  }

  window.LifeOSSetTopReminder=function(reminderId, selected){
    var s=getState(); if(!s) return;
    ensure(s);
    var k=todayKey(), a=s.reminderTop3[k]||[];
    reminderId=String(reminderId);
    var i=a.indexOf(reminderId);
    if(selected && i<0){
      if(a.length>=3){ if(window.toast) toast("Top 3 is full"); return; }
      a.push(reminderId);
    }
    if(!selected && i>=0) a.splice(i,1);
    s.reminderTop3[k]=a.slice(0,3);
    saveRender();
  };

  window.LifeOSIsTopReminder=function(reminderId){
    var s=getState(); if(!s) return false;
    ensure(s);
    return (s.reminderTop3[todayKey()]||[]).indexOf(String(reminderId))>=0;
  };

  window.LifeOSRescheduleReminder=function(reminderId,newDate){
    var s=getState(); if(!s || !Array.isArray(s.reminders) || !newDate) return;
    var r=s.reminders.find(function(x){return String(x.id)===String(reminderId);});
    if(!r) return;
    r.date=newDate;
    if("dueDate" in r) r.dueDate=newDate;
    r.completed=false; r.done=false; r.dismissed=false;
    saveRender();
  };

  window.LifeOSGetMissedReminders=function(){
    var s=getState(); if(!s) return [];
    var now=todayKey();
    return remindersFor(s,false).filter(function(r){
      var d=r.date || r.dueDate;
      return d && String(d)<now;
    });
  };

  function openReschedule(id){
    var current=todayKey();
    var d=prompt("Reschedule this reminder to (YYYY-MM-DD):", current);
    if(d && /^\d{4}-\d{2}-\d{2}$/.test(d)) window.LifeOSRescheduleReminder(id,d);
  }

  function showMissed(){
    var s=getState(); if(!s) return;
    var missed=window.LifeOSGetMissedReminders();
    var old=document.getElementById("lifeos-missed-reminders");
    if(old) old.remove();
    if(!missed.length) return;

    var box=document.createElement("section");
    box.id="lifeos-missed-reminders";
    box.className="lifeos-missed-card";
    box.innerHTML='<div class="lifeos-missed-head">Missed Reminders</div>';
    missed.forEach(function(r){
      var row=document.createElement("div");
      row.className="lifeos-missed-row";
      var title=document.createElement("div");
      title.className="lifeos-missed-title";
      title.textContent=String(r.title||r.name||"Reminder");
      var btn=document.createElement("button");
      btn.type="button"; btn.className="lifeos-mini-btn"; btn.textContent="Reschedule";
      btn.onclick=function(){openReschedule(r.id);};
      row.appendChild(title); row.appendChild(btn); box.appendChild(row);
    });
    var main=document.querySelector("main")||document.querySelector("#page-dashboard")||document.body;
    main.insertBefore(box,main.firstChild);
  }

  function injectTop3(){
    var s=getState(); if(!s) return;
    ensure(s);
    var old=document.getElementById("lifeos-top3-panel"); if(old) old.remove();

    var ids=s.reminderTop3[todayKey()]||[];
    if(!ids.length) return;

    var map={};
    remindersFor(s,true).forEach(function(r){map[String(r.id)]=r;});
    var rems=ids.map(function(id){return map[String(id)];}).filter(Boolean).filter(function(r){
      return !r.dismissed;
    });
    if(!rems.length) return;

    var panel=document.createElement("section");
    panel.id="lifeos-top3-panel";
    panel.className="lifeos-top3-card";
    panel.innerHTML='<div class="lifeos-top3-head">🔥 Today’s Top 3</div>';
    rems.forEach(function(r,i){
      var row=document.createElement("div"); row.className="lifeos-top3-item";
      var n=document.createElement("div"); n.className="lifeos-top3-num"; n.textContent=String(i+1);
      var t=document.createElement("div"); t.className="lifeos-top3-title"; t.textContent=String(r.title||r.name||"Reminder");
      row.appendChild(n); row.appendChild(t); panel.appendChild(row);
    });
    var main=document.querySelector("main")||document.querySelector("#page-dashboard")||document.body;
    main.insertBefore(panel,main.firstChild);
  }

  function decorateReminders(){
    var s=getState(); if(!s || !Array.isArray(s.reminders)) return;
    document.querySelectorAll("[data-reminder-id],[data-id]").forEach(function(el){
      var id=el.getAttribute("data-reminder-id")||el.getAttribute("data-id");
      if(!id || !s.reminders.some(function(r){return String(r.id)===String(id);})) return;
      if(el.querySelector(".lifeos-top3-btn")) return;
      var b=document.createElement("button");
      b.type="button"; b.className="lifeos-top3-btn";
      b.textContent=window.LifeOSIsTopReminder(id)?"★ Top 3":"☆ Top 3";
      b.style.cssText="margin-left:6px;border:0;background:transparent;cursor:pointer;font-size:12px;color:var(--orange)";
      b.onclick=function(ev){
        ev.preventDefault(); ev.stopPropagation();
        var selected=window.LifeOSIsTopReminder(id);
        window.LifeOSSetTopReminder(id,!selected);
      };
      el.appendChild(b);
    });
  }

  function openPlanTomorrow(){
    var s=getState(); if(!s) return;
    ensure(s);
    var tk=tomorrowKey();
    var existing=(s.reminderTop3[tk]||[]).map(String);
    var reminders=remindersFor(s,false);

    var wrap=document.createElement("div");
    wrap.id="lifeos-plan-tomorrow-top3";
    wrap.className="sheet-backdrop open";
    wrap.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:flex-end";
    var sheet=document.createElement("div");
    sheet.className="sheet";
    sheet.style.maxHeight="88vh";

    var header=document.createElement("div");
    header.className="sheet-header";
    header.innerHTML='<h2>Plan Tomorrow’s Top 3</h2>';
    var close=document.createElement("button"); close.className="sheet-btn"; close.textContent="Cancel";
    header.appendChild(close);

    var body=document.createElement("div"); body.className="sheet-body";
    var p=document.createElement("p");
    p.style.cssText="margin:0 0 14px;color:var(--text-3);font-size:14px";
    p.textContent="Choose up to 3 reminders to appear at the top of tomorrow’s dashboard.";
    body.appendChild(p);

    var opts=document.createElement("div");
    reminders.forEach(function(r){
      var row=document.createElement("label"); row.className="lifeos-top3-plan-row";
      var cb=document.createElement("input"); cb.type="checkbox"; cb.value=String(r.id); cb.checked=existing.indexOf(String(r.id))>=0;
      var title=document.createElement("span"); title.className="lifeos-top3-plan-title"; title.textContent=String(r.title||r.name||"Reminder");
      cb.addEventListener("change",function(){
        var checked=opts.querySelectorAll("input:checked");
        if(checked.length>3){cb.checked=false; if(window.toast) toast("Choose up to 3");}
      });
      row.appendChild(cb); row.appendChild(title); opts.appendChild(row);
    });
    if(!reminders.length){
      var empty=document.createElement("div"); empty.className="empty"; empty.textContent="No available reminders."; opts.appendChild(empty);
    }
    body.appendChild(opts);

    var save=document.createElement("button"); save.className="btn-primary"; save.style.marginTop="16px"; save.textContent="Save Top 3";
    save.onclick=function(){
      s.reminderTop3[tk]=Array.from(opts.querySelectorAll("input:checked")).map(function(x){return String(x.value);}).slice(0,3);
      saveRender(); wrap.remove();
    };
    body.appendChild(save);

    close.onclick=function(){wrap.remove();};
    wrap.addEventListener("click",function(e){if(e.target===wrap) wrap.remove();});

    sheet.appendChild(header); sheet.appendChild(body); wrap.appendChild(sheet); document.body.appendChild(wrap);
  }


  function tick(){
    try{
      showMissed();
      injectTop3();
      decorateReminders();
    }catch(e){}
  }

  // Old DOM-injection disabled — Top 3 and overdue reminders now render inside the Dashboard itself.
})();
</script>

/* ============ VIEWPORT HEIGHT FIX (iOS bottom gap) ============
   iOS Safari can report a visual viewport shorter than the layout viewport while
   its bottom toolbar is visible. Sizing a fixed app directly to that shorter
   visual viewport can expose a blank strip at the bottom. The app therefore
   keeps the layout viewport as its minimum height and uses the visual viewport
   only when it is actually larger. */
function setAppHeight(){
  // Do not size the fixed app to visualViewport.height on iOS. When Safari's
  // bottom toolbar is visible, visualViewport can be shorter than the layout
  // viewport, which creates the exact blank strip/gap this app was showing.
  // Use the layout viewport as the minimum and only grow if visualViewport is
  // genuinely larger (for example after entering standalone/PWA mode).
  const vv = window.visualViewport ? window.visualViewport.height : 0;
  const h = Math.max(window.innerHeight || 0, vv || 0);
  document.documentElement.style.setProperty('--app-height', h + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', ()=>{ setTimeout(setAppHeight, 50); setTimeout(setAppHeight, 300); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setAppHeight);
  window.visualViewport.addEventListener('scroll', setAppHeight);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setAppHeight(); });

ce business that gives me the freedom to choose where I live, what I work on, and how I spend my time.\n\nMy dream is to live in Amed, Bali, building businesses while living a simple, healthy, disciplined lifestyle.\n\n⸻\n\nYear 1 (Age 16-17 | Year 12)\n\nMain Goal\n\nBuild the foundation.\n\nSchool\n\n* Finish NCEA Level 2.\n* Keep university as a backup option.\n\nEcommerce\n\n* Learn ecommerce every day.\n* Learn Meta Ads.\n* Learn Shopify.\n* Learn branding.\n* Learn copywriting.\n* Learn customer service.\n* Learn email marketing.\n* Learn creative strategy.\n* Test as many products as possible.\n* Find proof of concept.\n* Get my first profitable product, even if it’s small.\n\nWork\n\n* Get a weekend job.\n* Save as much money as possible.\n* Keep business and personal money separate.\n* Reinvest business profits.\n\nFitness\n\n* Train 5 to 6 days every week.\n* Eat well.\n* Sleep properly.\n* Build habits that will last for life.\n\nEnd of Year Review\n\nAsk myself:\n\n* Have I found proof of concept?\n* Do I have a weekend job?\n* Have I stayed consistent?\n* What worked?\n* What didn’t?\n* What skills do I need to improve next year?\n\nSuccess by the End of Year 1\n\n* Hundreds of hours spent learning.\n* Multiple products tested.\n* Proof of concept found.\n* First profitable sales.\n* Weekend job secured.\n* Business savings started.\n\n⸻\n\nYear 2 (Age 17-18 | Year 13)\n\nMain Goal\n\nTurn ecommerce into a real business.\n\nSchool\n\n* Finish NCEA Level 3.\n* Graduate.\n\nEcommerce\n\n* Focus on building one strong brand.\n* Improve my website.\n* Improve Meta Ads.\n* Build an email list.\n* Improve customer retention.\n* Continue learning every day.\n* Build systems instead of relying on luck.\n\nWork\n\n* Work weekends.\n* Work as much as possible during school holidays.\n* Save aggressively.\n* Reinvest profits.\n* Build my Bali relocation fund.\n\nFitness\n\n* Continue training consistently.\n* Stay healthy.\n\nMonthly Checklist\n\nEvery month I will:\n\n* Review profit and loss.\n* Review Meta Ads.\n* Test new creatives.\n* Improve the website.\n* Improve conversion rate.\n* Grow the email list.\n* Save money.\n* Review my goals.\n\nEnd of Year Checklist\n\nBefore leaving New Zealand I will:\n\n* Graduate from school.\n* Have a valid passport.\n* Research and apply for the appropriate Indonesian visa.\n* Decide whether to apply for an extended overseas holiday or make any other arrangements needed after finishing school.\n* Book flights.\n* Book my first month of accommodation.\n* Organise travel insurance.\n* Set up a Wise account for international transfers.\n* Make sure my banking is ready for overseas.\n* Back up all business files.\n* Buy any equipment I need.\n* Organise an international SIM or eSIM.\n* Create my monthly budget.\n* Pack only what I need.\n\nSuccess by the End of Year 2\n\n* One established ecommerce brand.\n* Consistent monthly profit.\n* Savings built.\n* Ready for the next chapter.\n\n⸻\n\nYear 3 (Age 18-19)\n\nMove to Amed, Bali\n\nHome\n\nLocation\n\nBunutan, Amed, Bali.\n\nAccommodation\n\nMy goal is a quiet one-bedroom villa or homestay with:\n\n* Air conditioning.\n* Reliable high-speed Wi-Fi.\n* Private bathroom.\n* Small kitchen.\n* Workspace with a desk.\n* Scooter parking.\n* Within 10 minutes of The Lift Bali.\n* Close to local warungs.\n* Monthly accommodation budget of NZ$500 to NZ$800.\n\n⸻\n\nUtilities & Services\n\nGym\n\nThe Lift Bali\n\nTransport\n\nMonthly scooter rental.\n\nInternet\n\n* Home Wi-Fi.\n* Indonesian SIM with mobile data backup.\n\nBanking\n\n* New Zealand bank account.\n* Wise account.\n* Business bank account.\n\nBusiness Software\n\n* Shopify\n* Meta Ads\n* Klaviyo\n* ChatGPT\n* Claude\n* Canva\n* Google Workspace\n* Stripe (or another supported payment provider)\n\n⸻\n\nMonthly Budget\n\nAccommodation: NZ$500 to NZ$800\n\nFood: NZ$300\n\nGym: NZ$95\n\nScooter & fuel: NZ$100\n\nPhone & internet: NZ$35\n\nMiscellaneous: NZ$170\n\nTarget Monthly Living Cost: NZ$1,200 to NZ$1,500\n\n⸻\n\nDaily Routine\n\n6:00 am\nWake up.\n\n6:30 am\nGym at The Lift Bali.\n\n8:00 am\nBreakfast.\n\n9:00 am - 1:00 pm\nGrow the business.\n\n1:00 pm\nLunch.\n\n2:00 pm - 5:00 pm\nContinue working.\n\n5:30 pm\nBeach.\nSwim.\nRelax.\n\n7:00 pm\nDinner.\n\n8:00 pm\nLearning.\nPlanning.\nReading.\n\n10:00 pm\nSleep.\n\n⸻\n\nFirst Month Goals\n\n* Settle into my accommodation.\n* Join The Lift Bali.\n* Rent a scooter.\n* Find my favourite warungs.\n* Find a café to work from occasionally.\n* Build a routine.\n* Stay within budget.\n* Focus on growing the business instead of treating Bali like a holiday.\n\n⸻\n\nSix Month Review\n\nAsk myself:\n\n* Is the business growing?\n* Am I happy here?\n* Am I still learning?\n* Are my finances healthy?\n* What needs improving?\n\nThen update the roadmap.\n\n⸻\n\nYear 4 (Age 19-20)\n\nMain Goal\n\nScale the business.\n\nFocus\n\n* Increase profit.\n* Improve systems.\n* Outsource repetitive work.\n* Build a stronger brand.\n* Continue learning.\n* Start investing.\n* Continue living below my means.\n\nReview my progress every six months and improve the business one step at a time.\n\n⸻\n\nYear 5 (Age 20-21)\n\nMain Goal\n\nCreate long-term freedom.\n\nFocus\n\n* Continue growing the business.\n* Continue training.\n* Continue learning.\n* Build investments.\n* Expand only when the first business is stable.\n* Keep enjoying the lifestyle I’ve worked for.\n\n⸻\n\nMy Rules\n\n1. Learn something every day.\n2. Reinvest before spending.\n3. Stay disciplined.\n4. Stay consistent in the gym.\n5. Build brands, not quick wins.\n6. Save more than I think I’ll need.\n7. Never stop improving.\n8. Don’t compare myself to anyone else.\n9. Review this roadmap every six months.\n10. Build a life based on freedom, not status.\n\n⸻\n\nSuccess Looks Like…\n\nI wake up in Amed.\n\nI train every morning.\n\nI spend my days building a business I’m proud of.\n\nI swim in the ocean after work.\n\nI continue learning.\n\nI have the freedom to choose where I live because I built that freedom myself.\n\n⸻\n\nPlan B\n\nIf things don’t go to plan, I won’t see it as failure.\n\nI’ll return to New Zealand with years of practical experience in ecommerce, marketing, advertising, branding, copywriting, customer service, and running a business.\n\nI’ll continue working, keep building my savings, and enrol in university.\n\nUniversity\n\nI’ll study a degree that supports my long-term goals, such as:\n\n* Bachelor of Commerce (Marketing)\n* Bachelor of Commerce (Finance)\n* Information Systems\n* Computer Science\n\nWhile studying I will:\n\n* Continue running my ecommerce business.\n* Keep testing new ideas.\n* Continue learning.\n* Build my network.\n* Save and invest.\n* Gain real-world experience through internships or work.\n\nAfter graduating, I’ll work in a role that develops valuable business and professional skills while continuing to grow my ecommerce business outside of work.\n\nWhen the business reaches the point where it can support the lifestyle I want, I’ll move back to Amed and continue building the life I originally set out to create.\n\nThe destination stays the same.\n\nThe path may change.\n\nNo matter what happens, I’ll keep moving towards financial freedom, building businesses, and creating a life that gives me the freedom to choose where I live and what I work on.","updatedAt":1785783142264,"category":"Life & Goals"},{"id":"q2socy8t","title":"Christmas’s / birthday list","body":"Birthday \nChristmas","updatedAt":1785056977063,"category":"Personal & Shopping"},{"id":"clgqxzcr","title":"Ecom tools","body":"Creative generation: chat gpt \nGenerate 10 separate images from the prompt below.\nIMPORTANT:\n\t•\tGenerate ONE image at a time.\n\t•\tEach image must be a completely separate generation.\n\t•\tDO NOT make a collage, grid, contact sheet, montage, or image containing multiple pictures.\n\t•\tDO NOT combine the 10 images into one file.\n\t•\tEvery generation must contain only one finished image.\n\t•\tKeep the core subject, product, branding, and overall visual style consistent across all 10 images.\n\t•\tMake each generation visually distinct by changing the composition, camera angle, lighting, background, props, environment, or styling while keeping the product recognizable.\n\t•\tGenerate all 10 images sequentially in this response, one after another.\n\t•\tUse the highest available native resolution for every individual image.\n\t•\tDo not create fake download links inside the images.\n\t•\tDo not put numbers, labels, or links around the images unless specifically requested.\n\t•\tTreat “10 images” as 10 individual image-generation calls, NOT one request for a 10-image composition.\nPROMPT:\n[PASTE YOUR IMAGE PROMPT HERE]\nRequired output:\nImage 1 → separate full-resolution generation\nImage 2 → separate full-resolution generation\nImage 3 → separate full-resolution generation\nImage 4 → separate full-resolution generation\nImage 5 → separate full-resolution generation\nImage 6 → separate full-resolution generation\nImage 7 → separate full-resolution generation\nImage 8 → separate full-resolution generation\nImage 9 → separate full-resolution generation\nImage 10 → separate full-resolution generation","updatedAt":1786848929960,"category":"Business & Ecom"},{"id":"8nvaiaek","title":"YouTube videos","body":"LIFE SKILLS + SELF-IMPROVEMENT\n\n1. How to Speak With Confidence - 10 Secrets to Speaking Confidently\n2. How to speak so that people want to listen | Julian Treasure | TED\n3. How to Be More Charismatic in Everyday Conversations\n4. Charisma Breakdown: How To Be Charismatic In Groups\n5. How to Stop Procrastinating\n6. How to Stop Procrastinating and Finally Take Action\n7. How To Actually Achieve Your Goals in 2025 (Evidence-Based)\n8. Stop Wasting Time – How to Change Your Life in 90 Days\n9. How to Change Your Life with Deep Work (My System)\n10. How I Manage My Time Without Burning Out\n11. 6 Habits to Make 2025 Your Best Year Yet\n12. You’re Destroying Your Mind – How to Control Dopamine\n13. How to Build Discipline\n14. How to Build Self Discipline and Make it Possible\n15. 15 THINGS To Tell Yourself EVERYDAY (Stoic Morning Routine) | STOICISM\n16. The Perfect Morning Routine (According to Science)\n17. How Starting a Morning Routine Boosts Your Self-Leadership Skills & Confidence\n18. How to Build Confidence\n19. How to Become More Confident\n20. How to Stop Caring What Other People Think\n21. How to Deal With Rejection\n22. How to Become Mentally Tough\n23. How to Become More Assertive\n24. How to Talk to Anyone\n25. How to Never Run Out of Things to Say\n26. How to Tell Better Stories\n27. Body Language Expert Explains How to Show Confidence | WIRED\n28. How to Improve Your Communication Skills\n29. How to Build Habits That Last\n30. How to Get Comfortable Being Uncomfortable\n\nBRANDED E-COMMERCE + MARKETING + META\n\n31. What is Branding? How To Build A Successful Brand In 6 Steps\n32. How to Build a Brand From Scratch\n33. How to Find Product Market Fit\n34. How to Find Winning Products\n35. How to Do Product Research for Ecommerce\n36. How To Start An Ecommerce Business\n37. How to Build an Online Store\n38. How to Build a High Converting Shopify Store\n39. How to Design Your Online Store (with Zero Design Experience)\n40. How to Create a Brand Identity\n41. How to Position Your Brand\n42. How to Create a Value Proposition\n43. How to Write Product Descriptions That Sell\n44. Ecommerce Copywriting: How to Write Copy That Converts\n45. How to Create Offers That Sell\n46. Conversion Rate Optimization for Ecommerce\n47. How to Improve Your Shopify Store Conversion Rate (CRO Tips)\n48. How To Analyze Sales In Your Shopify Business\n49. CAC, LTV, AOV and ROAS Explained\n50. Meta Ads for Beginners\n51. META ADS MANAGER Tutorial (Ads on Facebook, Instagram and WhatsApp)\n52. Facebook Ads for Shopify\n53. Meta Ads Complete Tutorial\n54. How To Run Facebook Ads For Ecommerce\n55. Meta
