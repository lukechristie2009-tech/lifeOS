let mergeCandidates=[], mergeSource=null;
function openMergePicker(focusId,date,itemId){
  const src=findItemLocation(focusId,date,itemId); if(!src) return;
  mergeSource={focusId,date,itemId};
  const next=addDaysISO(date,1);
  mergeCandidates=[];
  [date,next].forEach(d=>{
    [...state.lifeFocuses, ...state.ecommerceFocuses].forEach(f=>{
      const day=f.days.find(x=>x.date===d); if(!day) return;
      const eco=isEcommerceFocusId(f.id);
      day.items.forEach(it=>{
        if(it.id===itemId && d===date && f.id===focusId) return;
        if(it.type==='checklist' || it.done || it.refId==='sleep' || it.locked) return;
        if(!eco && it.category==='ecommerce') return;
        if(eco && it.category!=='ecommerce') return;
        mergeCandidates.push({focusId:f.id,date:d,itemId:it.id,title:it.title,time:it.time||it.displayText||''});
      });
    });
  });
  const group=(label,d)=>{
    const rows=mergeCandidates.map((c,i)=>({c,i})).filter(x=>x.c.date===d);
    if(!rows.length) return '';
    return `<div class="section-label">${label}</div><div class="card">${rows.map(({c,i})=>`
      <div class="row" onclick="mergeInto(${i})"><div class="row-text"><div class="row-title">${escapeHtml(c.title)}</div>${c.time?`<div class="row-sub">${escapeHtml(c.time)}</div>`:''}</div><div class="chevron">›</div></div>`).join('')}</div>`;
  };
  const body=group('Today',date)+group('Tomorrow',next);
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="openRoutineActions('${focusId}','${date}','${itemId}')">Back</button><h2 class="long">Merge into…</h2><span></span></div>
    <div class="sheet-body">
      <div class="hint">"${escapeHtml(String(src.item.title).trim())}" will sit in a dropdown under the item you pick, with its own tick box.</div>
      ${body || '<div class="empty"><div class="icon">🤷</div><div class="msg">No other unfinished items to merge into</div></div>'}
    </div>`);
}
function mergeInto(i){
  snap();
  const c=mergeCandidates[i]; const s=mergeSource; if(!c||!s) return;
  const src=findItemLocation(s.focusId,s.date,s.itemId);
  const tgt=findItemLocation(c.focusId,c.date,c.itemId);
  if(!src||!tgt) return;
  const t=tgt.item;
  const entry={
    title:src.item.title,
    snapshot:cloneItem(src.item),
    addedDuration:0,
    subIds:[],
    done:!!src.item.done,
    fromDate:s.date
  };
  if(src.item.duration){ t.duration=(parseInt(t.duration,10)||0)+(parseInt(src.item.duration,10)||0); entry.addedDuration=parseInt(src.item.duration,10)||0; }
  if(!Array.isArray(t.merged)) t.merged=[];
  // If the source itself had things merged into it, bring those along as flat entries.
  if(Array.isArray(src.item.merged) && src.item.merged.length){
    entry.snapshot.merged=[];
    src.item.merged.forEach(m=>t.merged.push(m));
  }
  t.merged.push(entry);
  t.mergedOpen=true;
  src.day.items.splice(src.idx,1);
  saveState(); closeSheet(); render();
  undoToast('Merged into '+String(t.title).trim());
}
function restoreMergedEntry(loc, m, insertAt){
  const t=loc.item;
  const back=cloneItem(m.snapshot||{title:m.title,type:'item',category:t.category,note:''});
  back.id=uid(); back.done=!!m.done;
  if(m.addedDuration) t.duration=Math.max(0,(parseInt(t.duration,10)||0)-m.addedDuration)||undefined;
  if(m.subIds&&m.subIds.length&&Array.isArray(t.subChecklist)) t.subChecklist=t.subChecklist.filter(c=>!m.subIds.includes(c.id));
  loc.day.items.splice(insertAt,0,back);
}
function unmergeOne(focusId,date,itemId,i){
  snap();
  const loc=findItemLocation(focusId,date,itemId); if(!loc||!loc.item.merged||!loc.item.merged[i]) return;
  const m=loc.item.merged.splice(i,1)[0];
  restoreMergedEntry(loc, m, loc.idx+1); // goes back right below the item it was merged into
  loc.day.items.forEach((x,k)=>{x.order=k;});
  saveState(); render();
  undoToast('Split back out');
}
function unmergeItem(focusId,date,itemId){
  snap();
  const loc=findItemLocation(focusId,date,itemId); if(!loc||!loc.item.merged||!loc.item.merged.length) return;
  const list=loc.item.merged.slice();
  loc.item.merged=[];
  list.forEach((m,k)=>restoreMergedEntry(loc, m, loc.idx+1+k));
  loc.day.items.forEach((x,k)=>{x.order=k;});
  saveState(); closeSheet(); render();
  undoToast('Split back out');
}

/* ---------- PANIC BUTTON (restyled) ---------- */
const PANIC_BUTTON_STEPS = [
  { type:'text', icon:'🛑', title:'Pause for a second', body:"You hit the Panic Button — that's already the right move. Let's slow down for a minute before doing anything else." },
  { type:'question', icon:'💭', title:"What's going on right now?", placeholder:'Optional — just naming it can help' },
  { type:'breathing', icon:'🌬️', title:'Breathe', body:'In for 4, hold for 4, out for 4. Follow the circle until the timer runs out.', seconds:30 },
  { type:'question', icon:'🚶', title:'What will you do for the next 10 minutes instead?', placeholder:'e.g. go for a walk, text a friend, tidy your room' },
  { type:'text', icon:'✅', title:'Nice work', body:"That's the streak protected for today. Go do the thing you just said." }
];
let panicStepIdx = 0;
let panicTimerHandle = null;
function openPanicButton(){
  panicStepIdx = 0;
  renderPanicStep();
}
function renderPanicStep(){
  const step = PANIC_BUTTON_STEPS[panicStepIdx];
  const isLast = panicStepIdx === PANIC_BUTTON_STEPS.length-1;
  const dots = PANIC_BUTTON_STEPS.map((_,i)=>`<span class="pn-dot ${i<panicStepIdx?'past':''} ${i===panicStepIdx?'on':''}"></span>`).join('');
  let bodyHtml = '';
  if(step.type==='text'){
    bodyHtml = `<div class="pn-body">${escapeHtml(step.body)}</div>`;
  } else if(step.type==='question'){
    bodyHtml = `<textarea id="panicAnswerInput" class="pn-input" placeholder="${escapeHtml(step.placeholder||'')}"></textarea>`;
  } else if(step.type==='breathing'){
    bodyHtml = `<div class="pn-body">${escapeHtml(step.body)}</div>
      <div class="pn-breath"><div class="pn-ring"></div><div class="pn-circle"><div class="pn-count" id="panicTimer">${step.seconds}</div><div class="pn-phase" id="panicPhase">Breathe in</div></div></div>`;
  }
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closePanicButton()">Cancel</button><h2>Panic Button</h2><span style="width:50px"></span></div>
    <div class="sheet-body">
      <div class="pn-wrap">
        <div class="pn-dots">${dots}</div>
        <div class="pn-icon">${step.icon||''}</div>
        <div class="pn-title">${escapeHtml(step.title)}</div>
        ${bodyHtml}
      </div>
      <button class="pn-next" onclick="panicNextStep()">${isLast?'Done':'Next'}</button>
    </div>
  `);
  if(step.type==='breathing') startPanicTimer(step.seconds);
}
function startPanicTimer(seconds){
  let elapsed = 0;
  if(panicTimerHandle) clearInterval(panicTimerHandle);
  panicTimerHandle = setInterval(()=>{
    elapsed++;
    const left = seconds-elapsed;
    const el = document.getElementById('panicTimer');
    const ph = document.getElementById('panicPhase');
    if(el) el.textContent = left>0 ? left : '✓';
    if(ph){ const p=elapsed%12; ph.textContent = left<=0 ? 'Well done' : (p<4?'Breathe in':p<8?'Hold':'Breathe out'); }
    if(left<=0){ clearInterval(panicTimerHandle); panicTimerHandle=null; }
  }, 1000);
}

/* ---------- toast with optional action (Undo) ---------- */
let toastTimer = null;
function toast(msg, actionLabel, actionFn){
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.innerHTML = '';
  const span = document.createElement('span'); span.textContent = msg; t.appendChild(span);
  t.classList.toggle('has-action', !!actionLabel);
  if(actionLabel){
    const b = document.createElement('button'); b.className='toast-btn'; b.textContent = actionLabel;
    b.onclick = (e)=>{ e.stopPropagation(); t.classList.remove('show'); actionFn && actionFn(); };
    t.appendChild(b);
  }
  t.classList.add('show');
  toastTimer = setTimeout(()=>t.classList.remove('show'), actionLabel ? 4500 : 1700);
}

/* ---------- Undo: snapshot state before a change, offer to restore it ---------- */
let undoSnap = null;
function snap(){ try{ undoSnap = JSON.stringify(state); }catch(e){ undoSnap = null; } }
function undoToast(msg){
  const s = undoSnap;
  if(!s){ toast(msg); return; }
  toast(msg, 'Undo', ()=>{
    state = JSON.parse(s);
    saveState(); closeSheet(); applyAppearance(); render(); toast('Undone');
  });
}

/* ---------- In-app dialogs (replace native confirm / prompt / alert) ---------- */
function uiDialog(html){
  const old = document.getElementById('uiDialog'); if(old) old.remove();
  document.body.insertAdjacentHTML('beforeend', `<div class="lifeos-alert-backdrop ui-dialog" id="uiDialog"><div class="lifeos-alert-card">${html}</div></div>`);
  return document.getElementById('uiDialog');
}
function uiConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const d = uiDialog(`
      <div class="lifeos-alert-title">${escapeHtml(opts.title || 'Are you sure?')}</div>
      <div class="lifeos-alert-msg">${escapeHtml(message)}</div>
      <div class="btn-row">
        <button class="lifeos-alert-btn" data-r="0">${escapeHtml(opts.cancel || 'Cancel')}</button>
        <button class="lifeos-alert-btn ${opts.danger===false?'primary':'danger'}" data-r="1">${escapeHtml(opts.ok || 'Confirm')}</button>
      </div>`);
    d.addEventListener('click', e=>{
      const b = e.target.closest('[data-r]');
      if(b || e.target===d){ d.remove(); resolve(!!(b && b.dataset.r==='1')); }
    });
  });
}
function uiPrompt(title, value, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const d = uiDialog(`
      <div class="lifeos-alert-title">${escapeHtml(title)}</div>
      ${opts.message? `<div class="lifeos-alert-msg">${escapeHtml(opts.message)}</div>`:''}
      <input class="ui-input" id="uiPromptInput" type="${opts.type||'text'}" value="${escapeHtml(value||'')}" placeholder="${escapeHtml(opts.placeholder||'')}" autocomplete="off">
      <div class="btn-row">
        <button class="lifeos-alert-btn" data-r="0">Cancel</button>
        <button class="lifeos-alert-btn primary" data-r="1">${escapeHtml(opts.ok||'Save')}</button>
      </div>`);
    const inp = d.querySelector('#uiPromptInput');
    const done = ok=>{ const v = inp.value; d.remove(); resolve(ok ? v : null); };
    d.addEventListener('click', e=>{
      const b = e.target.closest('[data-r]');
      if(b) done(b.dataset.r==='1'); else if(e.target===d) done(false);
    });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); done(true); } });
    setTimeout(()=>{ try{ inp.focus(); if(inp.select && (opts.type||'text')==='text') inp.select(); }catch(e){} }, 50);
  });
}

/* ---------- Swipe gestures ----------
   Any element with data-swipe can carry data-swipe-right / data-swipe-left
   (a snippet of this app's own JS). Right = complete, left = options/snooze. */
let suppressClickUntil = 0;
(function(){
  let st = null;
  document.addEventListener('touchstart', e=>{
    const el = e.target.closest('[data-swipe]');
    if(!el || e.target.closest('input,textarea,select,button')) { st=null; return; }
    const t = e.touches[0];
    st = {el, x:t.clientX, y:t.clientY, dx:0, active:false, dead:false};
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!st || st.dead) return;
    const t = e.touches[0];
    const dx = t.clientX - st.x, dy = t.clientY - st.y;
    if(!st.active){
      if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ st.dead = true; return; }
      if(Math.abs(dx) < 12) return;
      st.active = true; st.el.classList.add('swiping');
    }
    let d = dx;
    if(d > 0 && !st.el.dataset.swipeRight) d = 0;
    if(d < 0 && !st.el.dataset.swipeLeft) d = 0;
    const a = Math.abs(d); d = Math.sign(d) * (a < 90 ? a : 90 + (a-90)*0.3);
    st.dx = d;
    st.el.style.transform = `translateX(${d}px)`;
    st.el.classList.toggle('swipe-hint-right', d > 70);
    st.el.classList.toggle('swipe-hint-left', d < -70);
  }, {passive:true});
  const end = ()=>{
    if(!st) return;
    const s = st; st = null;
    if(!s.active) return;
    s.el.classList.remove('swiping','swipe-hint-right','swipe-hint-left');
    s.el.style.transform = '';
    suppressClickUntil = Date.now() + 350;
    const code = s.dx > 70 ? s.el.dataset.swipeRight : s.dx < -70 ? s.el.dataset.swipeLeft : null;
    if(code) setTimeout(()=>{ try{ (new Function(code))(); }catch(err){ console.error(err); } }, 140);
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
  document.addEventListener('click', e=>{
    if(Date.now() < suppressClickUntil){ e.stopPropagation(); e.preventDefault(); }
  }, true);
})();


/* ---------- Hold to edit ----------
   Any element with data-hold="<js>" runs that code after a ~0.45s press
   (or a right-click on a computer). Moving the finger cancels it, so
   scrolling and swiping still work. The click that follows is swallowed. */
(function(){
  let h = null;
  const cancel = ()=>{ if(h){ clearTimeout(h.t); h.el.classList.remove('holding'); h = null; } };
  const run = el=>{ suppressClickUntil = Date.now() + 650; try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
    try{ (new Function(el.dataset.hold))(); }catch(err){ console.error(err); } };
  document.addEventListener('pointerdown', e=>{
    if(e.button>0) return;
    const el = e.target.closest('[data-hold]');
    if(!el || e.target.closest('input,textarea,select,.sheet [data-hold] input')) return;
    cancel();
    h = {el, x:e.clientX, y:e.clientY, t:setTimeout(()=>{ const x=h; h=null; if(!x) return; x.el.classList.remove('holding'); run(x.el); }, 450)};
    el.classList.add('holding');
  }, {passive:true});
  document.addEventListener('pointermove', e=>{ if(h && Math.hypot(e.clientX-h.x, e.clientY-h.y) > 10) cancel(); }, {passive:true});
  ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev, cancel, {passive:true}));
  document.addEventListener('scroll', cancel, {passive:true, capture:true});
  document.addEventListener('contextmenu', e=>{
    const el = e.target.closest('[data-hold]'); if(!el) return;
    e.preventDefault(); cancel(); run(el);
  });
})();
function maybeShowHoldTip(){
  try{ if(localStorage.getItem('lifeos-hold-tip')) return; localStorage.setItem('lifeos-hold-tip','1'); }catch(e){ return; }
  setTimeout(()=>toast('Tip: hold anything to edit it'), 1200);
}
/* ---------- Drag a sheet down by its header to close it ---------- */
(function(){
  let st = null;
  const sheet = ()=>document.getElementById('sheet');
  document.addEventListener('touchstart', e=>{
    const h = e.target.closest('#sheet .sheet-header');
    if(!h || e.target.closest('button,input')) return;
    st = {y:e.touches[0].clientY, dy:0};
    sheet().style.transition = 'none';
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!st) return;
    st.dy = Math.max(0, e.touches[0].clientY - st.y);
    sheet().style.transform = `translateY(${st.dy}px)`;
  }, {passive:true});
  document.addEventListener('touchend', ()=>{
    if(!st) return;
    const s = sheet(); const close = st.dy > 110; st = null;
    s.style.transition = 'transform .25s cubic-bezier(.32,.72,0,1)';
    if(close){ s.style.transform = 'translateY(100%)'; setTimeout(()=>{ closeSheet(); s.style.transform=''; s.style.transition=''; }, 230); }
    else { s.style.transform = ''; setTimeout(()=>{ s.style.transition=''; }, 260); }
  });
})();

/* ---------- Reminders: snooze + grouped list ---------- */
function snoozeReminder(id){
  const r = state.reminders.find(x=>String(x.id)===String(id)); if(!r) return;
  snap();
  r.date = addDaysISO(todayISO(),1);
  saveState(); render(); undoToast('Moved to tomorrow');
}
function setDateField(id, v){ const el=document.getElementById(id); if(el) el.value=v; document.querySelectorAll('[data-df="'+id+'"]').forEach(c=>c.classList.toggle('active', c.dataset.v===v)); }
function dateChipsHtml(inputId, current){
  const t=todayISO(), opts=[['Today',t],['Tomorrow',addDaysISO(t,1)],['Next week',addDaysISO(t,7)],['No date','']];
  return `<div class="date-chips">${opts.map(([l,v])=>`<button type="button" class="chip ${current===v?'active':''}" data-df="${inputId}" data-v="${v}" onclick="setDateField('${inputId}','${v}')">${l}</button>`).join('')}</div>`;
}
function reminderRow(r){
  const today = todayISO();
  const late = r.date && r.date < today && !r.done;
  const when = r.date ? (r.date===today ? 'Today' : r.date===addDaysISO(today,1) ? 'Tomorrow' : fmtDM(r.date, r.date.slice(0,4)!==today.slice(0,4))) : '';
  const sub = [when + (r.time? ' '+r.time : ''), r.category, r.repeat? '🔄 '+repeatSummary(r.repeat) : ''].filter(Boolean).join(' · ');
  return `
    <div class="row" data-swipe data-swipe-right="toggleReminder('${r.id}')" ${r.done?'':`data-swipe-left="snoozeReminder('${r.id}')"`} onclick="openReminderDetail('${r.id}')" data-hold="openReminderDetail('${r.id}')">
      <div class="checkbox ${r.done?'checked':''}" onclick="event.stopPropagation();toggleReminder('${r.id}')">${r.done?'✓':''}</div>
      <div class="row-text">
        <div class="row-title ${r.done?'done':''}">${escapeHtml(r.title)}</div>
        <div class="row-sub" ${late?'style="color:var(--red)"':''}>${escapeHtml(sub)}</div>
      </div>
      ${!r.done && r.priority==='High' ? `<span class="pill red">High</span>` : ''}
    </div>`;
}
function renderRemindersList(){
  const cats = ['All', ...state.reminderCategories];
  const list = reminderCategoryFilter==='All' ? state.reminders : state.reminders.filter(r=>r.category===reminderCategoryFilter);
  const today = todayISO(), tmr = addDaysISO(today,1);
  const byDate = (a,b)=> (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||'');
  const open = list.filter(r=>!r.done).sort(byDate);
  const groups = [
    ['Overdue',  open.filter(r=>r.date && r.date<today)],
    ['Today',    open.filter(r=>r.date===today)],
    ['Tomorrow', open.filter(r=>r.date===tmr)],
    ['Upcoming', open.filter(r=>r.date && r.date>tmr)],
    ['No date',  open.filter(r=>!r.date)]
  ];
  const done = list.filter(r=>r.done).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const body = groups.filter(g=>g[1].length).map(([label,items])=>`
    <div class="section-label">${label} · ${items.length}</div>
    <div class="card">${items.map(reminderRow).join('')}</div>`).join('');
  return `
    <div class="scroll-chips" style="margin-top:8px">
      ${cats.map(c=>`<button class="chip ${reminderCategoryFilter===c?'active':''}" onclick="setReminderFilter('${c}')">${escapeHtml(c)}</button>`).join('')}
    </div>
    ${body || `<div class="card" style="margin-top:8px"><div class="empty"><div class="icon">🎉</div><div class="msg">All clear — nothing to do</div></div></div>`}
    ${done.length? `
      <details class="done-group">
        <summary class="section-label">Completed · ${done.length} ›</summary>
        <div class="card">${done.slice(0,60).map(reminderRow).join('')}</div>
      </details>`:''}
  `;
}

/* ---------- Goals: grouped, counts, swipe to complete ---------- */
function renderGoalsList(){
  const head = `<div class="hint" style="margin:10px 20px 0;display:flex;justify-content:space-between"><span>${state.goals.filter(g=>g.done).length} of ${state.goals.length} achieved</span><button class="show-times-btn" onclick="renderGoalCategoryManager()">Edit categories</button></div>`;
  if(!state.goals.length) return head + `<div class="card"><div class="empty"><div class="icon">🎯</div><div class="msg">No goals yet — tap + to add one</div></div></div>`;
  return head + state.goalCategories.map(cat=>{
    const items = state.goals.filter(g=>g.category===cat).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
    if(!items.length) return '';
    const n = items.filter(g=>g.done).length;
    return `<div class="section-label">${escapeHtml(cat)} · ${n}/${items.length}</div><div class="card">${items.map(g=>`
      <div class="row" data-swipe data-swipe-right="toggleGoal('${g.id}')" onclick="openGoalDetail('${g.id}')" data-hold="openGoalDetail('${g.id}')">
        <div class="checkbox ${g.done?'checked':''}" onclick="event.stopPropagation();toggleGoal('${g.id}')">${g.done?'✓':''}</div>
        <div class="row-text">
          <div class="row-title ${g.done?'done':''}">${escapeHtml(g.title)}</div>
          ${g.notes? `<div class="row-sub clamp">${escapeHtml(g.notes)}</div>`:''}
        </div>
      </div>`).join('')}</div>`;
  }).join('');
}
function toggleGoal(id){
  const g = state.goals.find(x=>x.id===id); if(!g) return;
  snap(); g.done = !g.done; saveState(); renderGoals();
  if(g.done) undoToast('Goal achieved 🎉');
}

function inkFor(hex){ // readable text colour on top of an accent fill
  try{
    const n=parseInt(hex.replace('#',''),16), r=n>>16&255, g=n>>8&255, b=n&255;
    const lum=(0.2126*r+0.7152*g+0.0722*b)/255;
    return lum>0.58 ? '#1A0D00' : '#FFFFFF';
  }catch(e){ return '#FFFFFF'; }
}

function hexToRgba(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function resolvedTheme(){
  if(!state) return 'light';
  if(state.theme==='auto') return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  return state.theme==='dark' ? 'dark' : 'light';
}
function applyAppearance(){
  if(!state) return;
  const r = document.documentElement;
  r.setAttribute('data-theme', resolvedTheme());
  const did = DESIGNS.some(d=>d.id===state.design) ? state.design : 'ember';
  r.setAttribute('data-design', isSimpleDesign(did) ? 'simple' : did);
  if(isSimpleDesign(did)) r.setAttribute('data-variant', did); else r.removeAttribute('data-variant');
  if(state.accent){ r.style.setProperty('--accent', state.accent); r.style.setProperty('--accent-soft', hexToRgba(state.accent,.15)); r.style.setProperty('--accent-ink', inkFor(state.accent)); }
  else { r.style.removeProperty('--accent'); r.style.removeProperty('--accent-soft'); r.style.removeProperty('--accent-ink'); }
  const bg = getComputedStyle(r).getPropertyValue('--bg').trim();
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta && bg) meta.setAttribute('content', bg);
}

  let prev = 'ember';
  try{ prev = localStorage.getItem('lifeos-prev-design') || 'ember'; }catch(e){}
  if(isSimpleDesign()){
    if(!DESIGNS.some(d=>d.id===prev && !isSimpleDesign(prev))) prev = 'ember';

    try{ localStorage.setItem('lifeos-prev-design', state.design||'ember'); }catch(e){}

    setDesign(isSimpleDesign(last) && DESIGNS.some(d=>d.id===last) ? last : 'simple');
  }
}

      ${d.term? `<span style="color:${done?d.acc:d.text};font-size:9px">${done?'[x]':'[ ]'}</span>` : `<i style="display:block;width:10px;height:10px;border-radius:${d.cb};${done?`background:${d.acc}`:`border:1.5px solid ${d.text};opacity:.5`};${d.id==='brutal'?'border:1.5px solid #000':''}"></i>`}
      <i style="display:block;height:5px;width:${w}%;border-radius:3px;background:${d.text};opacity:.55"></i></div>`;
  return `<div class="dt-preview" style="background:${d.bg};font-family:${d.font};color:${d.text};height:118px;padding:10px">
    <div style="padding-left:2px;font-size:15px;font-weight:800;${d.italic?'font-style:italic;font-weight:600':''};letter-spacing:-.02em;line-height:1">${d.term?'~/':''}Today</div>
    <div style="margin-top:6px;height:22px;border-radius:${d.r}px;background:${d.hero};border:${d.rule?'none':d.border};box-shadow:${d.shadow};${d.rule?'border-left:2px solid '+d.acc:''};display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:700;color:${d.hero.includes('gradient')&&!d.tiles||d.id==='brutal'?'#fff':d.text}">9:41</div>
    <div style="margin-top:6px;${d.tiles?'':`background:${d.card};border:${d.border};box-shadow:${d.shadow};border-radius:${d.r}px`}">${row(60,true)}${row(40,false)}</div>
  </div>`;
}
function renderDesignPicker(){
  const mode = state.theme==='auto' ? 'auto' : (state.theme==='dark' ? 'dark' : 'light');
  const cur = state.design||'ember';
  const curName = (DESIGNS.find(d=>d.id===cur)||DESIGNS[0]).name;
  return `
    <div class="section-label">Appearance</div>
    <details class="fold" ${designFoldOpen?'open':''} ontoggle="designFoldOpen=this.open">
      <summary class="card"><div class="row"><div class="row-text"><div class="row-title">Design & appearance</div><div class="row-sub">${curName} · ${mode[0].toUpperCase()+mode.slice(1)}</div></div><div class="chevron fold-chev">›</div></div></summary>
    <div class="section-label">Design</div>
    <div class="design-grid">
      ${DESIGNS.map(d=>`
        <button class="design-tile ${cur===d.id?'active':''}" onclick="setDesign('${d.id}')">
          ${designPreview(d)}
          <div class="dt-meta">${cur===d.id?'<span class="dt-check">✓</span>':''}<div class="dt-name">${d.name}</div><div class="dt-desc">${d.desc}</div></div>
        </button>`).join('')}
    </div>
    <div class="section-label">Mode</div>
    <div class="segmented">
      ${[['light','Light'],['dark','Dark'],['auto','Auto']].map(([k,l])=>`<button class="seg-btn ${mode===k?'active':''}" onclick="setThemeMode('${k}')">${l}</button>`).join('')}
    </div>
    <div class="section-label">Accent colour</div>
    <div class="preset-grid">
      ${ACCENT_PRESETS.map(p=>{
        const on=(state.accent||null)===p.c;
        const sw=p.c||(DESIGNS.find(d=>d.id===cur)||DESIGNS[0]).acc;
        return `<button class="preset-tile ${on?'active':''}" onclick="setAccent(${p.c?`'${p.c}'`:'null'})" aria-label="${p.name}">
          <span class="pt-sw" style="background:${hexToRgba(sw,.16)}"><i style="background:${sw}"></i><i style="background:${sw};opacity:.55"></i><i style="background:${sw};opacity:.25"></i></span>
          <span class="pt-name">${p.name}</span></button>`;
      }).join('')}
    </div>
    <div class="card" style="margin-top:10px"><div class="row custom-accent">
      <div class="row-text"><div class="row-title">Custom colour</div><div class="row-sub">Pick any accent. It applies to every screen.</div></div>
      <input type="color" value="${state.accent||(DESIGNS.find(d=>d.id===cur)||DESIGNS[0]).acc}" aria-label="Custom accent colour" onchange="setCustomAccent(this.value)">
    </div></div>
    </details>`;
}
if(window.matchMedia){
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onChange = ()=>{ if(state && state.theme==='auto') applyAppearance(); };
  if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
}


/* ============ INIT ============ */
loadState().then(()=>{
  applyAppearance();
  scanForMissedNotifications();
  maybeShowNextMissedNotification();
});
</script>
</body></html>
