<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="LifeOS">
<meta name="format-detection" content="telephone=no">
<title>LifeOS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,ital,wght@6..72,0,400;6..72,0,500;6..72,1,400&amp;display=swap" rel="stylesheet">
<meta name="theme-color" content="#F2F2F7">
<style>
/* =====================================================================
   LifeOS design system
   - One type scale, one spacing scale, one radius scale.
   - data-theme="light|dark" controls light/dark.
   - data-design="classic|midnight|sand|forest|mono" picks the look.
   Every component reads tokens only, so a design swap restyles the app
   without touching any data.
===================================================================== */
:root{
  /* type scale */
  --fs-xl:30px;   /* page titles */
  --fs-l:20px;    /* card headlines */
  --fs-m:16px;    /* body / row titles */
  --fs-s:13px;    /* secondary text */
  --fs-xs:11px;   /* labels, pills */
  /* spacing */
  --gap:16px;
  --radius:16px;
  --radius-sm:11px;
  --radius-pill:100px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tabbar-h:56px;

  /* status colours (shared by every design) */
  --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --purple:#AF52DE; --pink:#FF2D55;

  /* Classic (default) — light */
  --accent:#007AFF;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(0,122,255,.12);
  --hero-1:#0A84FF; --hero-2:#0060DF;
  --streak-1:#FF9500; --streak-2:#FF3B30;
  --bg:#F2F2F7; --card:#FFFFFF; --card-2:#F2F2F7; --fill:rgba(120,120,128,.12);
  --text:#000000; --text-2:#3C3C43; --text-3:#8E8E93;
  --sep:rgba(60,60,67,.12);
  --tabbar:rgba(249,249,249,.88);
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --blue:var(--accent);
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card-2:#2C2C2E; --fill:rgba(120,120,128,.24);
  --text:#FFFFFF; --text-2:#EBEBF5; --text-3:#8E8E93;
  --sep:rgba(84,84,88,.55);
  --tabbar:rgba(22,22,24,.86);
  --shadow:none;
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18);
}

/* =================== Base =================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);overscroll-behavior:none;}
body{
  margin:0;position:fixed;inset:0;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:var(--fs-m);line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{display:none;}

#app{height:var(--app-height,100dvh);display:flex;flex-direction:column;}
.page-wrap{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-top:calc(var(--safe-top) + 6px);
  padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 24px);
}
.page{display:none;}
.page.active{display:block;animation:fadeIn .22s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* =================== Headers & labels =================== */
.header{padding:8px 64px 14px 20px;position:relative;}
#globalSearchBtn{display:none;}
.header .gs-btn{position:absolute;top:10px;right:16px;}
.header h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15;}
.header .sub{color:var(--text-3);font-size:var(--fs-s);font-weight:500;margin-top:3px;}

.section-label{
  font-size:var(--fs-xs);font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em;
  padding:22px 20px 8px;
}
.section-label-row{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 20px 8px;}
.section-label-row .section-label{padding:0;}
.show-times-btn{background:none;border:none;color:var(--accent);font-size:var(--fs-s);font-weight:500;padding:0;}

/* =================== Cards & rows =================== */
.card{background:var(--card);border-radius:var(--radius);margin:0 var(--gap);overflow:hidden;box-shadow:var(--shadow);}
.card + .card{margin-top:10px;}
.sheet-body .card{margin:0 0 10px;}

.row{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;min-height:48px;
  position:relative;
}
.row + .row::before,.row-group + .row::before,.merge-panel + .row::before,.sub-panel + .row::before{
  content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);
}
.row[onclick]:active,.row[onclick]:active{background:var(--fill);}
.row-text{flex:1;min-width:0;}
.row-title{font-size:var(--fs-m);font-weight:500;line-height:1.3;overflow-wrap:anywhere;}
.row-title.done{color:var(--text-3);text-decoration:line-through;}
.row-sub{font-size:var(--fs-s);color:var(--text-3);margin-top:2px;line-height:1.35;overflow-wrap:anywhere;}
.row-sub:empty{display:none;}
.row-value{color:var(--text-3);font-size:var(--fs-m);flex-shrink:0;text-align:right;}
.row-meta{font-size:12px;color:var(--accent);margin-top:3px;}
.chevron{color:var(--text-3);opacity:.55;font-size:20px;line-height:1;flex-shrink:0;transition:transform .2s;}

.checkbox{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--text-3);opacity:.9;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
  transition:transform .15s,background .15s;
}
.checkbox:active{transform:scale(.88);}
.checkbox.checked{background:var(--green);border-color:var(--green);opacity:1;}

.pill{display:inline-block;font-size:var(--fs-xs);font-weight:600;padding:3px 9px;border-radius:var(--radius-pill);background:var(--fill);color:var(--text-2);white-space:nowrap;flex-shrink:0;}
.pill.blue{background:var(--accent-soft);color:var(--accent);}
.pill.green{background:rgba(52,199,89,.15);color:var(--green);}
.pill.red{background:rgba(255,59,48,.14);color:var(--red);}
.pill.orange{background:rgba(255,149,0,.15);color:var(--orange);}
.pill.purple{background:rgba(175,82,222,.15);color:var(--purple);}
.pill.gray{background:var(--fill);color:var(--text-3);}

/* small inline action chip (checklist / merged toggles) */
.mini-chip{
  border:none;background:var(--fill);color:var(--text-3);
  font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;
  white-space:nowrap;flex-shrink:0;
}
.mini-chip.on{background:var(--accent-soft);color:var(--accent);}

/* nested panels under a row (merged items + sub-checklists) */
.merge-panel,.sub-panel{position:relative;padding:2px 16px 10px 52px;}
.merge-panel{border-left:0;}
.nested-row{display:flex;align-items:center;gap:10px;padding:8px 0;position:relative;}
.nested-row + .nested-row::before{content:"";position:absolute;top:0;left:30px;right:0;height:1px;background:var(--sep);}
.nested-row .checkbox{width:20px;height:20px;font-size:11px;}
.nested-row .nr-title{flex:1;min-width:0;font-size:15px;line-height:1.3;}
.nested-row .nr-title.done{color:var(--text-3);text-decoration:line-through;}
.nested-row .nr-sub{font-size:12px;color:var(--text-3);}
.nested-link{background:none;border:none;color:var(--accent);font-size:var(--fs-s);font-weight:600;padding:8px 0 2px;}
.nested-link.danger{color:var(--red);}
.nested-actions{display:flex;gap:18px;}
.icon-btn{background:none;border:none;color:var(--text-3);font-size:15px;padding:4px 6px;line-height:1;flex-shrink:0;}
.icon-btn.danger{color:var(--red);}
.merge-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);}

/* =================== Dashboard hero =================== */
.hero-card{
  margin:0 var(--gap);border-radius:calc(var(--radius) + 4px);
  padding:20px;color:#fff;
  background:linear-gradient(140deg,var(--hero-1),var(--hero-2));
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
.hero-card .greet{font-size:var(--fs-m);font-weight:600;opacity:.92;}
.hero-card .date{display:none;}
.hero-card .time{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}
.hero-card .quote{
  font-size:15px;font-weight:500;line-height:1.4;opacity:.95;
  margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22);
}
:root[data-design="mono"][data-theme="dark"] .hero-card{color:#fff;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px var(--gap) 0;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.stat-label{font-size:var(--fs-s);color:var(--text-3);margin-top:2px;}

/* =================== Tab bar & FAB =================== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--tabbar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
  padding-bottom:var(--safe-bottom);
}
.tab{
  flex:1;height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text-3);font-size:10px;font-weight:500;
}
.tab.active{color:var(--accent);}
.tab svg{width:24px;height:24px;}

.fab{
  position:fixed;right:18px;bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 16px);
  width:52px;height:52px;border-radius:50%;border:none;z-index:40;
  background:var(--accent);color:var(--accent-ink);font-size:28px;font-weight:300;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform .15s;
}
.fab:active{transform:scale(.92);}

.gs-btn{
  position:fixed;top:calc(var(--safe-top) + 12px);right:16px;z-index:45;
  width:36px;height:36px;border-radius:50%;padding:0;border:none;
  background:var(--card);color:var(--text-2);box-shadow:0 1px 4px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
}
.gs-btn svg{width:17px;height:17px;}
.gs-btn:active{transform:scale(.92);}

/* =================== Segmented control =================== */
.segmented{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:0 var(--gap) 4px;}
.seg-btn{
  flex:1;border:none;background:none;border-radius:8px;
  padding:7px 2px;font-size:var(--fs-s);font-weight:600;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
:root[data-theme="dark"] .seg-btn.active{background:#636366;}
.segmented.five .seg-btn{font-size:12px;}

/* =================== Empty state =================== */
.empty{text-align:center;padding:30px 24px;color:var(--text-3);}
.empty .icon{font-size:30px;margin-bottom:6px;}
.empty .msg{font-size:var(--fs-s);line-height:1.4;}

/* =================== Calendar =================== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
.cal-day-label{font-size:var(--fs-xs);color:var(--text-3);text-align:center;font-weight:600;padding-bottom:2px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:var(--fs-s);font-weight:600;background:var(--card);color:var(--text);}
.cal-day.empty{background:transparent;}
.cal-day.green{background:rgba(52,199,89,.22);color:var(--green);}
.cal-day.yellow{background:rgba(255,204,0,.24);color:#A07C00;}
.cal-day.red{background:rgba(255,59,48,.18);color:var(--red);}
.cal-day.nodata{opacity:.5;}
.cal-day.future{opacity:.25;}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--text-3);}
.cal-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0;}
.cal-legend .l-g::before{background:var(--green);} .cal-legend .l-y::before{background:var(--yellow);}
.cal-legend .l-r::before{background:var(--red);} .cal-legend .l-n::before{background:var(--fill);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;}
.cal-nav .t{font-size:var(--fs-m);font-weight:600;}

/* =================== Top 3 / alerts =================== */
.lifeos-top3-plan-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--sep);}
.lifeos-top3-plan-row:last-child{border-bottom:0;}
.lifeos-top3-plan-row input{width:20px;height:20px;accent-color:var(--accent);}
.lifeos-top3-plan-title{flex:1;font-size:var(--fs-m);}
.top3-num{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:rgba(255,149,0,.15);color:var(--orange);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}

.lifeos-alert-backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:28px;animation:fadeIn .2s;}
.lifeos-alert-card{background:var(--card);border-radius:18px;width:100%;max-width:320px;padding:20px 18px 14px;box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center;}
.lifeos-alert-title{font-size:17px;font-weight:700;margin-bottom:6px;}
.lifeos-alert-msg{white-space:pre-line;font-size:var(--fs-s);color:var(--text-2);line-height:1.45;margin-bottom:16px;}
.lifeos-alert-date{width:100%;border:none;border-radius:var(--radius-sm);padding:12px;font-size:16px;color:var(--text);background:var(--card-2);margin-bottom:14px;}
.lifeos-alert-btns{display:flex;flex-direction:column;gap:8px;}
.lifeos-alert-btn{width:100%;border:none;border-radius:var(--radius-sm);padding:13px;font-size:15px;font-weight:600;background:var(--card-2);color:var(--text);}
.lifeos-alert-btn.primary{background:var(--accent);color:var(--accent-ink);}
.lifeos-alert-btn.dismiss{background:none;color:var(--text-3);font-weight:500;}

/* =================== Sheets =================== */
.sheet-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.38);display:none;align-items:flex-end;}
.sheet-backdrop.open{display:flex;animation:fadeIn .2s;}
.sheet{
  background:var(--bg);width:100%;max-height:92dvh;max-height:92vh;
  border-radius:16px 16px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(28px + var(--safe-bottom));
  animation:slideUp .32s cubic-bezier(.32,.72,0,1);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
.sheet-header{
  display:grid;grid-template-columns:minmax(64px,auto) 1fr minmax(64px,auto);align-items:center;gap:8px;
  padding:10px 12px;position:sticky;top:0;z-index:2;
  background:var(--bg);border-bottom:.5px solid var(--sep);
}
.sheet-header::before{
  content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:36px;height:5px;border-radius:3px;background:var(--sep);
}
.sheet-header > :first-child{justify-self:start;}
.sheet-header > :last-child{justify-self:end;}
.sheet-header h2{font-size:17px;font-weight:600;margin:6px 0 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sheet-header h2.long{font-size:15px;}
.sheet-header > button:first-child,.sheet-header > button:last-child,.sheet-header > span{margin-top:6px;}
.sheet-btn{background:none;border:none;color:var(--accent);font-size:16px;padding:6px 4px;}
.sheet-btn.bold{font-weight:600;}
.sheet-btn:disabled{opacity:.3;}
.sheet-body{padding:16px;}
.sheet-body > .section-label{padding:16px 4px 8px;}
.sheet-body > .section-label:first-child{padding-top:0;}
.hint{font-size:var(--fs-s);color:var(--text-3);line-height:1.45;margin:0 4px 14px;}

/* =================== Note page =================== */
.note-page{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);pointer-events:none;}
.note-page.open{transform:none;pointer-events:auto;}
.note-page-header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 8px) 8px 8px 4px;border-bottom:.5px solid var(--sep);}
.note-back-btn{display:flex;align-items:center;gap:2px;background:none;border:none;color:var(--accent);font-size:17px;padding:6px 8px;}
.note-header-actions{display:flex;gap:2px;}
.note-save-btn{background:none;border:none;color:var(--accent);font-size:17px;font-weight:600;padding:6px 10px;}
.note-delete-btn{background:none;border:none;color:var(--red);font-size:16px;padding:6px 10px;}
.note-page-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:12px 20px calc(24px + var(--safe-bottom));}
.note-title-input{border:none;background:transparent;color:var(--text);font-size:24px;font-weight:700;padding:6px 0;outline:none;}
.note-cat-select{border:none;background:var(--fill);color:var(--text-2);font-size:var(--fs-s);font-weight:600;padding:6px 10px;border-radius:8px;margin:4px 0 8px;align-self:flex-start;}
.note-body-textarea{flex:1;min-height:55vh;border:none;background:transparent;color:var(--text);font-size:16px;line-height:1.55;padding:6px 0;outline:none;resize:none;}

/* =================== Forms =================== */
.field{margin-bottom:16px;}
.field > label{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin:0 4px 6px;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field textarea,.field select,.xinput{
  width:100%;background:var(--card);border:none;border-radius:var(--radius-sm);
  padding:12px 14px;font-size:16px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;
  min-height:46px;
}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
.field textarea{resize:vertical;min-height:84px;line-height:1.45;}
.field input:focus,.field textarea:focus,.xinput:focus{box-shadow:0 0 0 2px var(--accent-soft);}
.row input[type=time],.row select{
  border:none;background:var(--fill);color:var(--text);border-radius:8px;padding:6px 8px;font-size:15px;-webkit-appearance:none;
}
.inline-row{display:flex;gap:8px;align-items:center;}
.inline-row > input{flex:1;}
.inline-row > .num{width:84px;flex:none;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:8px 14px;border-radius:var(--radius-pill);border:none;
  background:var(--card);color:var(--text-2);font-size:14px;font-weight:500;
  box-shadow:inset 0 0 0 1px var(--sep);
}
.chip.active{background:var(--accent);color:var(--accent-ink);box-shadow:none;}

.toggle{width:51px;height:31px;border-radius:100px;background:var(--fill);position:relative;border:none;flex-shrink:0;transition:background .2s;}
.toggle.on{background:var(--green);}
.toggle .knob{width:27px;height:27px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s;}
.toggle.on .knob{left:22px;}

.btn-primary{
  width:100%;border:none;border-radius:var(--radius-sm);padding:14px;
  background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:600;transition:opacity .15s;
}
.btn-primary:active{opacity:.75;}
.btn-secondary{width:100%;border:none;border-radius:var(--radius-sm);padding:14px;background:var(--card);color:var(--accent);font-size:16px;font-weight:600;}
.btn-danger{width:100%;border:none;border-radius:var(--radius-sm);padding:14px;background:var(--card);color:var(--red);font-size:16px;font-weight:600;}
.btn-stack{display:flex;flex-direction:column;gap:8px;}
.btn-pair{display:flex;gap:8px;}
.btn-pair > *{flex:1;}

.search-bar{margin:0 var(--gap) 10px;background:var(--fill);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;color:var(--text-3);}
.search-bar input{border:none;background:none;outline:none;font-size:16px;flex:1;color:var(--text);}

.progress-bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px;}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}

.scroll-chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--gap) 8px;scrollbar-width:none;}
.scroll-chips .chip{flex-shrink:0;}

/* =================== Data panel =================== */
.expand-card .expand-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
.expand-card .expand-body{display:none;padding:0 16px 14px;}
.expand-card.open .expand-body{display:block;}
.expand-card .caret{transition:transform .2s;color:var(--text-3);}
.expand-card.open .caret{transform:rotate(90deg);}
.subitem{background:var(--card-2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;font-size:14px;line-height:1.45;}
.subitem .k{color:var(--text-3);font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.link-row{color:var(--accent);font-size:15px;padding:4px 0;}
.recipe-line{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-bottom:1px solid var(--sep);}
.recipe-line:last-child{border-bottom:none;}

/* =================== Discipline streak =================== */
.streak-card{margin:0 var(--gap);border-radius:calc(var(--radius) + 4px);padding:18px 18px 12px;color:#fff;background:linear-gradient(140deg,var(--streak-1),var(--streak-2));}
.streak-card .sc-label{font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.9;}
.streak-card .sc-num{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:2px;}
.sc-actions{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin-top:14px;}
.panic-btn{
  width:100%;border:none;border-radius:14px;padding:14px;
  background:#fff;color:#C8001A;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 6px 16px rgba(0,0,0,.2);transition:transform .12s;
}
.panic-btn:active{transform:scale(.97);}
.panic-btn .pb-dot{width:9px;height:9px;border-radius:50%;background:#FF3B30;animation:pbPulse 1.6s infinite;}
.panic-btn .pb-sub{display:none;}
@keyframes pbPulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.6);}70%{box-shadow:0 0 0 10px rgba(255,59,48,0);}100%{box-shadow:0 0 0 0 rgba(255,59,48,0);}}
.sc-reset{background:none;border:none;color:rgba(255,255,255,.85);font-size:var(--fs-s);font-weight:600;padding:9px;}

/* Panic sheet */
.pn-wrap{background:var(--card);border-radius:20px;padding:22px 20px 24px;text-align:center;}
.pn-dots{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
.pn-dot{width:7px;height:7px;border-radius:50%;background:var(--sep);transition:all .25s;}
.pn-dot.past{background:var(--red);opacity:.45;}
.pn-dot.on{background:var(--red);width:22px;border-radius:7px;}
.pn-icon{font-size:42px;line-height:1;margin-bottom:10px;}
.pn-title{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin-bottom:10px;}
.pn-body{font-size:15px;line-height:1.5;color:var(--text-2);}
.pn-input{width:100%;min-height:96px;margin-top:6px;border:none;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;background:var(--card-2);color:var(--text);resize:none;outline:none;text-align:left;}
.pn-breath{position:relative;width:180px;height:180px;margin:20px auto 4px;display:flex;align-items:center;justify-content:center;}
.pn-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,59,48,.22),rgba(255,59,48,0) 70%);animation:pnBreath 12s ease-in-out infinite;}
.pn-circle{width:124px;height:124px;border-radius:50%;background:linear-gradient(135deg,#FF6B5E,#FF3B30);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(255,59,48,.3);animation:pnBreath 12s ease-in-out infinite;}
.pn-count{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.pn-phase{font-size:13px;font-weight:600;margin-top:6px;}
@keyframes pnBreath{0%{transform:scale(.82);}33%{transform:scale(1.1);}66%{transform:scale(1.1);}100%{transform:scale(.82);}}
.pn-next{width:100%;margin-top:14px;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#FF6B5E,#FF3B30);}
.pn-next:active{transform:scale(.98);}

/* =================== Main focus =================== */
.mf-card{margin:0 var(--gap) 12px;border-radius:var(--radius);padding:14px 16px;background:var(--card);box-shadow:var(--shadow);border-left:4px solid var(--orange);}
.mf-card.empty{border-left-color:var(--sep);text-align:left;padding:14px 16px;color:inherit;}
.mf-label{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);}
.mf-row{display:flex;align-items:center;gap:12px;margin-top:8px;}
.mf-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--orange);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;}
.mf-card.done .mf-check{background:var(--green);border-color:var(--green);}
.mf-text{font-size:17px;font-weight:600;line-height:1.3;flex:1;min-width:0;overflow-wrap:anywhere;}
.mf-card.done .mf-text{color:var(--text-3);text-decoration:line-through;}
.mf-empty{font-size:15px;color:var(--text-3);margin-top:6px;}

/* =================== Timer =================== */
.tm-banner{margin:0 var(--gap) 10px;border-radius:var(--radius);padding:12px 16px;background:linear-gradient(135deg,#34C759,#16A34A);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.tm-b-l{font-size:var(--fs-xs);font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em;}
.tm-b-t{font-size:15px;font-weight:600;margin-top:2px;}
.tm-b-c{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
.xt-title{text-align:center;font-size:18px;font-weight:600;margin:6px 0 4px;}
.xt-clock{text-align:center;font-size:64px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0 10px;}
.xt-bar{height:8px;background:var(--fill);border-radius:8px;overflow:hidden;margin:0 4px;}
.xt-bar > div{height:100%;width:0;background:var(--green);border-radius:8px;transition:width .5s;}
.xt-goal{text-align:center;font-size:var(--fs-s);color:var(--text-3);margin:8px 0 14px;min-height:16px;}
.xchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
.xchip{border:none;border-radius:var(--radius-pill);padding:8px 14px;font-size:14px;font-weight:600;background:var(--fill);color:var(--text-2);}
.xchip.on{background:var(--accent);color:var(--accent-ink);}
.xbtn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;margin-top:10px;}
.xbtn.green{background:var(--green);color:#fff;}
.xbtn.gray{background:var(--card);color:var(--text);}
.xbtn.link{background:none;color:var(--red);font-weight:500;font-size:15px;}

.row-more{
  background:var(--fill);border:none;color:var(--text-2);
  width:28px;height:28px;border-radius:50%;font-size:15px;line-height:1;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;letter-spacing:-1px;
}
.row-more:active{opacity:.6;}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 14px);transform:translateX(-50%) translateY(8px);
  background:rgba(30,30,32,.92);color:#fff;padding:10px 18px;border-radius:var(--radius-pill);
  font-size:14px;font-weight:500;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:calc(100% - 40px);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%);}

/* =================== Awards =================== */
.present-card{margin:0 var(--gap);border-radius:calc(var(--radius) + 4px);padding:24px 20px;background:linear-gradient(140deg,#AF52DE,#FF2D55);color:#fff;text-align:center;}
.present-card.locked{background:var(--card);color:var(--text);box-shadow:var(--shadow);}
.present-card .pc-eyebrow{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9;}
.present-card.locked .pc-eyebrow{color:var(--text-3);}
.present-card .pc-icon{font-size:52px;margin:12px 0 8px;display:inline-block;}
.present-card .pc-icon.opening{animation:giftShake .5s ease;}
@keyframes giftShake{0%,100%{transform:rotate(0);}20%{transform:rotate(-8deg);}40%{transform:rotate(8deg);}60%{transform:rotate(-6deg);}80%{transform:rotate(6deg);}}
@keyframes giftPop{0%{transform:scale(.6) rotate(-10deg);opacity:0;}60%{transform:scale(1.15) rotate(4deg);opacity:1;}100%{transform:none;}}
.present-card .pc-msg{font-size:var(--fs-m);font-weight:600;}
.present-card .pc-sub{font-size:var(--fs-s);opacity:.85;margin-top:6px;line-height:1.4;}
.present-card.locked .pc-sub{color:var(--text-3);opacity:1;}
.present-card .pc-pct{font-size:32px;font-weight:700;letter-spacing:-.02em;}
.present-card .pc-progress{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:12px 4px 0;}
.present-card .pc-progress .fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s;}
.pc-open-btn{margin-top:14px;background:#fff;color:#AF52DE;border:none;padding:13px 30px;border-radius:var(--radius-pill);font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.pc-open-btn:active{transform:scale(.96);}
.pc-reward-reveal{margin-top:14px;background:rgba(255,255,255,.16);border-radius:14px;padding:14px;}
.pc-reward-reveal .rr-label{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
.pc-reward-reveal .rr-title{font-size:18px;font-weight:700;margin-top:6px;}
.pc-reward-reveal .rr-note{font-size:12px;opacity:.85;margin-top:6px;}
.carry-box{text-align:left;margin-top:14px;border-top:1px solid var(--sep);padding-top:10px;}
.carry-box .carry-list{max-height:220px;overflow-y:auto;}

.ri-emoji{font-size:24px;flex-shrink:0;width:30px;text-align:center;}
.reward-item.used .row-title{color:var(--text-3);text-decoration:line-through;}
.reward-use-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--radius-pill);padding:7px 14px;font-size:13px;font-weight:600;flex-shrink:0;}
.reward-used-pill{color:var(--green);font-size:13px;font-weight:700;flex-shrink:0;}

.medal-card{align-items:flex-start !important;gap:14px !important;}
.medal-card .mc-icon{font-size:26px;width:46px;height:46px;border-radius:13px;background:var(--card-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.medal-card.locked-medal .mc-icon{opacity:.45;filter:grayscale(1);}
.medal-card .mc-body{flex:1;min-width:0;}
.medal-card .mc-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.medal-card .mc-name{font-size:var(--fs-m);font-weight:600;}
.tier-pill{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-xs);font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);}
.tier-pill.tier-none{background:var(--fill);color:var(--text-3);}
.tier-pill.tier-bronze{background:rgba(205,127,50,.18);color:#CD7F32;}
.tier-pill.tier-silver{background:rgba(160,160,168,.2);color:#8E8E93;}
.tier-pill.tier-gold{background:rgba(255,204,0,.2);color:#B8860B;}
.tier-pill.tier-platinum{background:rgba(90,200,250,.2);color:#3AA9D9;}
.medal-card .mc-desc{font-size:var(--fs-s);color:var(--text-3);margin-top:2px;}
.medal-card .mc-progress-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.medal-card .mc-progress-row .progress-bar{flex:1;margin-top:0;}
.medal-card .mc-nums{font-size:12px;color:var(--text-3);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
.medal-card .mc-next{font-size:12px;color:var(--text-3);margin-top:5px;}
.medal-card .mc-maxed{font-size:12px;color:var(--green);font-weight:600;margin-top:5px;}
.medal-tiers-row{display:none;}
.row.tile{background:var(--card);border-radius:var(--radius-sm);margin-top:8px;}
.row.tile::before{display:none;}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.note-preview{white-space:pre-wrap;font-size:var(--fs-s);color:var(--text-2);line-height:1.5;padding:12px 16px;}

.medal-unlock-banner{text-align:center;padding:10px 4px 4px;}
.medal-unlock-banner .mub-icon{font-size:60px;animation:giftPop .5s cubic-bezier(.32,1.6,.4,1);}
.medal-unlock-banner .mub-title{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-top:6px;}
.medal-unlock-banner .mub-name{font-size:20px;font-weight:700;margin-top:8px;}
.medal-unlock-banner .mub-detail{font-size:14px;color:var(--text-3);margin-top:6px;}
.medal-unlock-banner .mub-hype{font-size:14px;font-weight:600;color:var(--orange);margin-top:14px;}

.quotes-accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.quotes-accordion-body.open{max-height:6000px;}

/* =================== Design picker =================== */
.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 var(--gap);}
.design-tile{
  font-family:-apple-system,system-ui,sans-serif;border:none;text-align:left;padding:0;border-radius:var(--radius);overflow:hidden;
  background:var(--card);box-shadow:inset 0 0 0 1.5px var(--sep);color:var(--text);
}
.design-tile.active{box-shadow:inset 0 0 0 2.5px var(--accent);}
.design-tile .dt-preview{display:block;overflow:hidden;}
.design-tile .dt-bar{height:9px;border-radius:5px;width:60%;}
.design-tile .dt-rows{display:flex;gap:5px;}
.design-tile .dt-rows i{display:block;height:20px;flex:1;border-radius:6px;}
.design-tile .dt-meta{padding:9px 12px 11px;}
.design-tile .dt-name{font-size:15px;font-weight:600;}
.design-tile .dt-desc{font-size:12px;color:var(--text-3);margin-top:1px;}
.design-tile .dt-check{float:right;color:var(--accent);font-weight:700;}

/* =====================================================================
   DESIGNS — each one changes typography, shapes, surfaces, navigation
   and component styling, not just colour. Classic = the base styles above.
===================================================================== */
.header h1,.mf-text,.row-title,.pn-title{text-wrap:balance;}
.row-sub,.hint,.quote{text-wrap:pretty;}

/* ---------- swipe feedback (all designs) ---------- */
[data-swipe]{transition:transform .22s cubic-bezier(.2,.8,.2,1),background-color .15s;touch-action:pan-y;}
[data-swipe].swiping{transition:none;}
.swipe-hint-right{background-image:linear-gradient(90deg,rgba(52,199,89,.28),transparent 70%) !important;}
.swipe-hint-left{background-image:linear-gradient(270deg,var(--accent-soft),transparent 70%) !important;}

/* ---------- undo toast ---------- */
.toast.has-action{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;}
.toast .toast-btn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:100px;padding:7px 14px;font-size:14px;font-weight:700;}

/* ---------- in-app dialogs ---------- */
.ui-dialog .lifeos-alert-title{color:var(--text);}
.ui-dialog .ui-input{width:100%;border:none;border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;color:var(--text);background:var(--card-2);margin-bottom:14px;outline:none;}
.ui-dialog .lifeos-alert-btn.danger{background:var(--red);color:#fff;}
.ui-dialog .btn-row{display:flex;gap:8px;}
.ui-dialog .btn-row > *{flex:1;}

/* ---------- quick add grid ---------- */
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qa-btn{border:none;background:var(--card);color:var(--text);border-radius:var(--radius);padding:16px 14px;text-align:left;box-shadow:var(--shadow);}
.qa-btn .qa-i{font-size:24px;display:block;margin-bottom:8px;}
.qa-btn .qa-t{font-size:15px;font-weight:600;}
.qa-btn .qa-s{font-size:12px;color:var(--text-3);margin-top:2px;}
.qa-btn:active{transform:scale(.97);}

.date-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.date-chips .chip{padding:6px 12px;font-size:13px;}
details.fold > summary{list-style:none;cursor:pointer;}
details.fold > summary::-webkit-details-marker{display:none;}
details.fold[open] .fold-chev{transform:rotate(90deg);}
details.done-group summary{list-style:none;cursor:pointer;}
details.done-group summary::-webkit-details-marker{display:none;}
.tip-row{display:flex;align-items:center;gap:10px;margin:8px var(--gap) 0;padding:10px 14px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:500;}
.tip-row button{margin-left:auto;white-space:nowrap;background:none;border:none;color:inherit;font-weight:700;font-size:13px;}

/* =====================================================================
   GLASS — vivid gradient wallpaper, frosted translucent cards,
   floating pill tab bar, big soft radii.
===================================================================== */
:root[data-design="glass"]{
  --accent:#6B4BFF; --accent-soft:rgba(107,75,255,.14);
  --hero-1:rgba(255,255,255,.38); --hero-2:rgba(255,255,255,.18);
  --bg:#E9E4FF; --card:rgba(255,255,255,.62); --card-2:rgba(255,255,255,.55); --fill:rgba(60,40,140,.08);
  --text:#16112E; --text-2:#3A335C; --text-3:#6E6890; --sep:rgba(60,40,140,.10);
  --tabbar:rgba(255,255,255,.6); --shadow:0 8px 30px rgba(70,40,160,.10);
  --radius:24px; --radius-sm:16px;
  --font:-apple-system,"SF Pro Display",system-ui,sans-serif;
}
:root[data-design="glass"][data-theme="dark"]{
  --accent:#A08BFF; --accent-soft:rgba(160,139,255,.2);
  --bg:#0B0820; --card:rgba(255,255,255,.08); --card-2:rgba(255,255,255,.1); --fill:rgba(255,255,255,.1);
  --text:#F4F1FF; --text-2:#D9D3F5; --text-3:#968FBA; --sep:rgba(255,255,255,.09);
  --tabbar:rgba(30,22,70,.55); --shadow:0 8px 30px rgba(0,0,0,.3);
  --hero-1:rgba(255,255,255,.14); --hero-2:rgba(255,255,255,.05);
}
[data-design="glass"] body{
  background:
    radial-gradient(120% 60% at 0% 0%,#FFB8E0 0%,transparent 55%),
    radial-gradient(90% 60% at 100% 10%,#9EC5FF 0%,transparent 55%),
    radial-gradient(100% 70% at 50% 100%,#C7B4FF 0%,transparent 60%),
    #ECE7FF;
}
[data-design="glass"][data-theme="dark"] body{
  background:
    radial-gradient(120% 60% at 0% 0%,#4A1D6E 0%,transparent 55%),
    radial-gradient(90% 60% at 100% 10%,#123A7A 0%,transparent 55%),
    radial-gradient(100% 70% at 50% 100%,#2D1A6B 0%,transparent 60%),
    #07051A;
}
[data-design="glass"] html{background:transparent;}
[data-design="glass"] .card,[data-design="glass"] .stat-card,[data-design="glass"] .mf-card,
[data-design="glass"] .present-card.locked,[data-design="glass"] .qa-btn,[data-design="glass"] .design-tile{
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.55);
}
[data-design="glass"][data-theme="dark"] .card,[data-design="glass"][data-theme="dark"] .stat-card,[data-design="glass"][data-theme="dark"] .mf-card,
[data-design="glass"][data-theme="dark"] .qa-btn{border-color:rgba(255,255,255,.1);}
[data-design="glass"] .hero-card,[data-design="glass"] .streak-card{
  color:var(--text);border:1px solid rgba(255,255,255,.6);
  backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
}
[data-design="glass"] .streak-card{background:linear-gradient(140deg,rgba(255,140,90,.55),rgba(255,70,120,.45));color:#fff;}
[data-design="glass"] .hero-card .quote{border-top-color:var(--sep);}
[data-design="glass"] .hero-card .time{font-size:52px;font-weight:600;letter-spacing:-.04em;}
[data-design="glass"] .mf-card{border-left:1px solid rgba(255,255,255,.55);}
[data-design="glass"] .section-label{text-transform:none;letter-spacing:0;font-size:15px;font-weight:700;color:var(--text);padding-top:24px;}
[data-design="glass"] .header h1{font-size:34px;font-weight:800;letter-spacing:-.035em;}
[data-design="glass"] .tabbar{
  left:14px;right:14px;bottom:calc(var(--safe-bottom) + 8px);border-radius:30px;padding-bottom:0;
  border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(40,20,120,.18);
}

/* =====================================================================
   BENTO — playful tiles. Every row is its own rounded block, pastel

===================================================================== */
:root[data-design="bento"]{

[data-design="bento"] .header h1{font-size:34px;font-weight:800;letter-spacing:-.02em;}
[data-design="bento"] .section-label{text-transform:none;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--text);padding:24px 20px 10px;}
[data-design="bento"] .section-label-row .section-label{padding:0;}
[data-design="bento"] .card{background:none;box-shadow:none;overflow:visible;}
[data-design="bento"] .card > .row,[data-design="bento"] .card > .merge-panel,[data-design="bento"] .card > .sub-panel,[data-design="bento"] .card > details,[data-design="bento"] .card > .empty{

}

[data-design="bento"] .card > .merge-panel,[data-design="bento"] .card > .sub-panel{margin-top:-14px;border-top-left-radius:0;border-top-right-radius:0;padding-top:4px;}
[data-design="bento"] .row + .row::before,[data-design="bento"] .merge-panel + .row::before,[data-design="bento"] .sub-panel + .row::before{display:none;}
[data-design="bento"] .row{min-height:58px;padding:14px 16px;}

[data-design="bento"] .checkbox{width:28px;height:28px;border-radius:9px;border:none;background:var(--card-2);opacity:1;}
[data-design="bento"] .checkbox.checked{background:var(--accent);}
[data-design="bento"] .nested-row .checkbox{width:22px;height:22px;border-radius:7px;}
[data-design="bento"] .merge-panel,[data-design="bento"] .sub-panel{padding-left:58px;}
[data-design="bento"] .hero-card{background:linear-gradient(135deg,#FFD9C2,#FFC2D4);color:#3A1A10;border-radius:28px;}

[data-design="bento"] .hero-card .time{font-weight:800;font-size:50px;}
[data-design="bento"] .hero-card .quote{border-top-color:rgba(58,26,16,.15);font-weight:600;}

[data-design="bento"] .stat-card:nth-child(2){background:#DCE6FF;}

[data-design="bento"] .stat-card{border-radius:24px;padding:18px;}

.merged-contents{margin-top:6px;display:flex;flex-direction:column;gap:4px;}

.merged-check{font-size:var(--fs-s);color:var(--text-2);}
.merged-check.done{text-decoration:line-through;opacity:.6;}
.note-link{background:none;border:0;padding:2px 0;margin-top:2px;color:var(--blue);font-size:var(--fs-s);font-weight:600;cursor:pointer;text-align:left;}

/* =====================================================================
   LIFEOS 2.0 — shared components (token-driven, work in every design)
   .ring        circular progress (SVG, driven by --p / stroke-dashoffset)
   .dash-hero   dashboard header: greeting, date, ring, focus chips
   .xcard       expandable dashboard card (collapsed summary / expanded body)
   .act-*       Activities hub cards
   .subnav      back bar shown on pages opened from Activities
===================================================================== */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ring svg{display:block;transform:rotate(-90deg);}
.ring .ring-track{stroke:var(--fill);}
.ring .ring-bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1);}
.ring .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.ring .ring-num{font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}
.ring .ring-cap{font-size:var(--fs-xs);color:var(--text-3);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}

.dash-hero{margin:0 var(--gap);padding:20px;border-radius:calc(var(--radius) + 6px);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden;}
.dash-hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 120% at 100% 0%,var(--accent-soft),transparent 60%);}
.dash-hero > *{position:relative;}
.dh-top{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.dh-greet{font-size:var(--fs-s);font-weight:600;color:var(--text-3);}
.dh-time{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums;}
.dh-day{font-size:var(--fs-s);color:var(--text-2);font-weight:500;margin-top:6px;}
.dh-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.dh-chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--fill);border:none;color:var(--text);text-align:left;max-width:100%;}
.dh-chip small{font-size:var(--fs-xs);color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.dh-chip span{font-size:var(--fs-s);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;}
.dh-quote{font-size:14px;line-height:1.45;color:var(--text-2);margin-top:16px;padding-top:14px;border-top:1px solid var(--sep);}
.dh-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px var(--gap) 0;}
.dh-stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
.dh-stat .ds-num{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.dh-stat .ds-lab{font-size:var(--fs-s);color:var(--text-3);margin-top:2px;}
.dh-next{margin:10px var(--gap) 0;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft);display:flex;align-items:center;gap:12px;}
.dh-next .dn-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 4px var(--accent-soft);}
.dh-next .dn-k{font-size:var(--fs-xs);font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;}
.dh-next .dn-t{font-size:var(--fs-m);font-weight:600;line-height:1.3;overflow-wrap:anywhere;}
.dh-next .dn-time{margin-left:auto;font-size:var(--fs-s);color:var(--text-2);font-weight:600;white-space:nowrap;}

/* expandable dashboard card */
.xcard{background:var(--card);border-radius:var(--radius);margin:0 var(--gap);overflow:hidden;box-shadow:var(--shadow);}
.xcard + .xcard{margin-top:10px;}
.xcard-head{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px;cursor:pointer;width:100%;background:none;border:none;color:inherit;text-align:left;font:inherit;}
.xcard-head:active{background:var(--fill);}
.xcard-title{font-size:var(--fs-m);font-weight:600;line-height:1.25;}
.xcard-sub{font-size:var(--fs-s);color:var(--text-3);margin-top:2px;line-height:1.3;overflow-wrap:anywhere;}
.xcard-text{flex:1;min-width:0;}
.xcard-meter{width:64px;height:5px;border-radius:5px;background:var(--fill);overflow:hidden;flex-shrink:0;}
.xcard-meter > i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s ease;}
.xcard-chev{color:var(--text-3);opacity:.6;font-size:20px;line-height:1;transition:transform .2s;flex-shrink:0;}
.xcard.open .xcard-chev{transform:rotate(90deg);}
.xcard-body{display:none;border-top:1px solid var(--sep);}
.xcard.open .xcard-body{display:block;}
.xcard-body > .card{margin:0;border-radius:0;box-shadow:none;background:none;}
.xcard-body > .hint{padding:8px 16px;margin:0;}

/* Activities hub */
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 var(--gap);}
.act-card{background:var(--card);border:none;border-radius:var(--radius);padding:16px;text-align:left;color:var(--text);box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;min-height:132px;position:relative;font:inherit;transition:transform .15s;}
.act-card:active{transform:scale(.97);}
.act-card.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;}
.act-ico{width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.act-ico svg{width:22px;height:22px;}
.act-name{font-size:var(--fs-m);font-weight:600;line-height:1.2;}
.act-stat{font-size:var(--fs-s);color:var(--text-3);line-height:1.3;margin-top:2px;overflow-wrap:anywhere;}
.act-meter{height:4px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:auto;}
.act-meter > i{display:block;height:100%;background:var(--accent);border-radius:4px;}
.act-card.wide .act-meter{display:none;}
.act-card .act-body{flex:1;min-width:0;display:flex;flex-direction:column;}

/* back bar for pages opened from Activities */
.subnav{display:none;align-items:center;gap:6px;padding:calc(var(--safe-top) + 8px) 64px 4px 10px;}
#app.has-subnav .subnav{display:flex;}
#app.has-subnav .page-wrap{padding-top:2px;}
.subnav button{background:none;border:none;color:var(--accent);font-size:var(--fs-m);font-weight:600;padding:8px 10px;border-radius:10px;display:flex;align-items:center;gap:2px;}
.subnav button:active{background:var(--accent-soft);}
.subnav button svg{width:18px;height:18px;}

/* theme presets (Settings) */
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 var(--gap);}
.preset-tile{border:none;background:var(--card);border-radius:var(--radius-sm);padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text);font:inherit;box-shadow:var(--shadow);}
.preset-tile.active{box-shadow:inset 0 0 0 2px var(--accent);}
.preset-tile .pt-sw{width:100%;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:5px;}
.preset-tile .pt-sw i{display:block;width:12px;height:12px;border-radius:50%;}
.preset-tile .pt-name{font-size:var(--fs-s);font-weight:600;}
.custom-accent{display:flex;align-items:center;gap:12px;}
.custom-accent input[type=color]{width:44px;height:34px;border:none;padding:0;background:none;border-radius:8px;}

/* =====================================================================
   EMBER — default 2.0 design. Near-black, warm orange accent, soft
   rounded cards, floating pill nav. Dark is native; a warm light
   variant is provided for Light mode.
===================================================================== */
:root[data-design="ember"]{
  --accent:#FF7A1A; --accent-ink:#1A0D00; --accent-soft:rgba(255,122,26,.16);
  --bg:#08070A; --card:rgba(24,17,14,.74); --card-2:rgba(255,255,255,.06); --fill:rgba(255,255,255,.07);
  --text:#F6F3EF; --text-2:#D6D1CA; --text-3:#9A938B;
  --sep:rgba(255,255,255,.09); --tabbar:rgba(22,15,12,.82); --shadow:none;
  --radius:8px; --radius-sm:6px; --tabbar-h:60px;
  --hero-1:#FF7A1A; --hero-2:#E2520B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",sans-serif;
}

  --bg:#FFF4EA; --card:rgba(255,255,255,.78); --card-2:rgba(60,30,10,.05); --fill:rgba(60,30,10,.06);
  --text:#1B1612; --text-2:#463C33; --text-3:#85796D;
  --sep:rgba(60,30,10,.12); --tabbar:rgba(255,250,244,.9); --shadow:none;
}
[data-design="ember"] body{

    radial-gradient(75% 52% at 4% 86%,rgba(255,104,20,.50),transparent 64%),

    radial-gradient(100% 34% at 50% 104%,rgba(255,168,60,.30),transparent 70%),
    radial-gradient(60% 30% at 92% 8%,rgba(255,110,30,.10),transparent 70%),
    linear-gradient(180deg,#07060A 0%,#0E0807 52%,#1A0C06 100%);
  background-attachment:fixed;
}

html[data-design="ember"]{background:var(--bg);}
[data-design="ember"] .header{padding-top:12px;}
[data-design="ember"] .header h1{font-size:32px;font-weight:700;letter-spacing:-.03em;}

[data-design="ember"] .card,[data-design="ember"] .stat-card,[data-design="ember"] .dh-stat,[data-design="ember"] .xcard,[data-design="ember"] .act-card,[data-design="ember"] .dash-hero,[data-design="ember"] .mf-card,[data-design="ember"] .dh-chip,[data-design="ember"] .dh-next,[data-design="ember"] .rt{
  border:1px solid var(--sep);
  -webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%);
}

[data-design="ember"] .btn-primary{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);font-weight:700;}
[data-design="ember"] .btn-secondary,[data-design="ember"] .btn-danger{border-radius:var(--radius);}
[data-design="ember"] .field input,[data-design="ember"] .field textarea,[data-design="ember"] .field select{border-radius:var(--radius-sm);}
[data-design="ember"] .segmented{background:var(--card);border:1px solid var(--sep);border-radius:var(--radius);padding:3px;}
[data-design="ember"] .seg-btn{border-radius:var(--radius-sm);padding:8px 2px;}
[data-design="ember"] .seg-btn.active,[data-design="ember"][data-theme="dark"] .seg-btn.active{background:var(--accent);color:var(--accent-ink);box-shadow:none;}
[data-design="ember"] .streak-card{border-radius:var(--radius);background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 90%,#fff),color-mix(in srgb,var(--accent) 66%,#300));color:var(--accent-ink);}
[data-design="ember"] .panic-btn{border-radius:var(--radius-sm);}
[data-design="ember"] .page-wrap{padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 44px);}

[data-design="ember"] .tab{border-radius:10px;margin:5px 2px;height:calc(var(--tabbar-h) - 10px);font-size:11px;font-weight:600;}
[data-design="ember"] .tab.active{background:var(--accent-soft);color:var(--accent);}
[data-design="ember"] .fab{bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 34px);background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 38%,transparent);}
[data-design="ember"] .sheet,[data-design="ember"] .note-page{background:#120D0B;border-radius:16px 16px 0 0;}
