function addRoutineItem(){
  const title=document.getElementById('rtTitleNew').value.trim();
  if(!title){ toast('Enter a title'); return; }
  const val=document.getElementById('rtTimeNew').value.trim();
  const note=document.getElementById('rtNoteNew').value.trim();
  const newItem={id:uid(), title, time:'', displayText:'', note, category:'routine', hidden:false};
  if(/^\d{1,2}:\d{2}$/.test(val)) newItem.time=val; else newItem.displayText=val;
  const list = activeRoutine();
  const lastIdx = list.findIndex(t=>t.locked==='last');
  if(lastIdx>-1) list.splice(lastIdx,0,newItem);
  else list.push(newItem);
  saveState(); closeSheet(); renderFocus(); renderSettings(); render(); toast('Added');
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lifeos-backup-'+todayISO()+'.json';
  a.click();
  toast('Exported');
}
function backupData(){ exportData(); }
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      state = Object.assign(defaultState(), imported);
      saveState();
      document.documentElement.setAttribute('data-theme', state.theme);
      render();
      toast('Import successful');
    }catch(err){ toast('Invalid file'); }
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(!confirm('This will permanently delete all your data. Continue?')) return;
  state = defaultState();
  saveState();
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
  toast('All data reset');
}

function saveGymEditor(){
  const g = state.data.gym || (state.data.gym = {});
  const order = [1,2,3,4,5,6,0];
  const oldSplit = getGymSplit();
  const oldEx = g.exercises || GYM_EXERCISES;
  const newSplit = {};
  const newEx = {};

  order.forEach(d=>{
    const oldName = oldSplit[d] || '';
    const name = document.getElementById(`gymSplit_${d}`).value.trim() || oldName || 'Rest';
    const lines = document.getElementById(`gymEx_${d}`).value.split('\n').map(s=>s.trim()).filter(Boolean);
    newSplit[d] = name;
    newEx[name] = lines;

    // If the workout was renamed, carry its existing routine forward unless
    // the user changed the routine in the editor.
    if(!lines.length && oldName && oldEx[oldName]) newEx[name] = [...oldEx[oldName]];
  });

  g.split = newSplit;
  g.exercises = newEx;
  g.progression = document.getElementById('gymProgression').value.trim();
  g.exerciseNotes = document.getElementById('gymNotes').value.trim();

  saveState();
  closeSheet();
  renderSettings();
  render();
  toast('Gym split updated');
}

function renderSkillsData(){
  const skills=state.skills||[];
  return skills.length ? skills.map(sk=>`<div class="subitem"><div class="k">${escapeHtml(sk.name)}</div>${escapeHtml(sk.category||'General')} · ${Math.max(0,Math.min(100,Number(sk.progress)||0))}% · ${sk.sessions||0} sessions${sk.notes?'<br>'+escapeHtml(sk.notes):''}</div>`).join('') : '<div class="subitem">No skills yet</div>';
}

function renderRugbyData(){
  const r = state.data.rugby;
  return `
    <div class="subitem"><div class="k">Season</div>${state.activeProfileId==='rugby'?'ON — Rugby Season profile active':'OFF'}</div>
    <div class="subitem"><div class="k">Training</div>${r.trainingDays.join(', ')}</div>
    <div class="subitem"><div class="k">Games</div>${escapeHtml(r.gameDay)}</div>
    ${r.notes? `<div class="subitem"><div class="k">Notes</div>${escapeHtml(r.notes)}</div>`:''}
    <button class="btn-primary" style="margin-top:10px" onclick="openRugbyEditor()">Edit</button>
  `;
}
function openRugbyEditor(){
  const r=state.data.rugby;
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Cancel</button><h2>Edit Rugby</h2><button class="sheet-btn bold" onclick="saveRugbyEditor()">Save</button></div>
    <div class="sheet-body">
      <div class="field"><label>Season</label><div class="chip-row" id="rugSeasonRow">
        <button class="chip ${r.season==='off'?'active':''}" data-cat="off" onclick="selectChip(this,'rugSeasonRow')">Off</button>
        <button class="chip ${r.season==='on'?'active':''}" data-cat="on" onclick="selectChip(this,'rugSeasonRow')">On</button>
      </div></div>
      <div class="field"><label>Training Days (comma separated)</label><textarea id="rugTraining">${r.trainingDays.join(', ')}</textarea></div>
      <div class="field"><label>Game Day</label><input type="text" id="rugGame" value="${escapeHtml(r.gameDay)}"></div>
      <div class="field"><label>Notes</label><textarea id="rugNotes">${escapeHtml(r.notes||'')}</textarea></div>
    </div>
  `);
}
function saveRugbyEditor(){
  const r=state.data.rugby;
  r.season = document.querySelector('#rugSeasonRow .chip.active')?.dataset.cat || 'off';
  r.trainingDays = document.getElementById('rugTraining').value.split(',').map(s=>s.trim()).filter(Boolean);
  r.gameDay = document.getElementById('rugGame').value.trim();
  r.notes = document.getElementById('rugNotes').value.trim();
  // keep the Rugby Season profile in sync with this on/off switch
  if(r.season==='on') state.activeProfileId = 'rugby';
  else if(state.activeProfileId==='rugby') state.activeProfileId = 'school';
  saveState(); closeSheet(); renderFocus(); renderSettings(); render(); toast('Saved');
}

function renderEcommerceData(){
  const e = state.data.ecommerceData;
  return `
    <div class="subitem"><div class="k">Businesses</div>${e.businesses.length? e.businesses.join(', ') : 'None yet'}</div>
    <div class="subitem"><div class="k">Products</div>${e.products.length? e.products.join(', ') : 'None yet'}</div>
    <div class="subitem"><div class="k">Suppliers</div>${e.suppliers.length? e.suppliers.join(', ') : 'None yet'}</div>
    <div class="subitem"><div class="k">Useful Links</div>${e.links.length? e.links.map(l=>`<div class="link-row">${escapeHtml(l)}</div>`).join('') : 'None yet'}</div>
    <button class="btn-primary" style="margin-top:10px" onclick="openEcommerceEditor()">Edit</button>
  `;
}
function openEcommerceEditor(){
  const e=state.data.ecommerceData;
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Cancel</button><h2>Edit Ecommerce Data</h2><button class="sheet-btn bold" onclick="saveEcommerceEditor()">Save</button></div>
    <div class="sheet-body">
      <div class="field"><label>Businesses (comma separated)</label><textarea id="ecomBiz">${e.businesses.join(', ')}</textarea></div>
      <div class="field"><label>Products (comma separated)</label><textarea id="ecomProd">${e.products.join(', ')}</textarea></div>
      <div class="field"><label>Suppliers (comma separated)</label><textarea id="ecomSup">${e.suppliers.join(', ')}</textarea></div>
      <div class="field"><label>Useful Links (one per line)</label><textarea id="ecomLinks" style="min-height:80px">${e.links.join('\n')}</textarea></div>
    </div>
  `);
}
function saveEcommerceEditor(){
  const e=state.data.ecommerceData;
  e.businesses = document.getElementById('ecomBiz').value.split(',').map(s=>s.trim()).filter(Boolean);
  e.products = document.getElementById('ecomProd').value.split(',').map(s=>s.trim()).filter(Boolean);
  e.suppliers = document.getElementById('ecomSup').value.split(',').map(s=>s.trim()).filter(Boolean);
  e.links = document.getElementById('ecomLinks').value.split('\n').map(s=>s.trim()).filter(Boolean);
  saveState(); closeSheet(); renderSettings(); toast('Saved');
}

/* ============ MASTER RENDER ============ */
function render(){
  if(!state) return;
  renderDashboard();
  if(document.getElementById('page-focus').classList.contains('active') || focusTab) renderFocus();
  renderGoals();
  renderSettings();
}

/* ============ CLOCK ============ */
setInterval(()=>{
  const el = document.getElementById('clockTime');
  if(el){
    const now = new Date();
    el.textContent = now.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }
}, 15000);

/* ============ LIVE TIMETABLE REFRESH ============ */
setInterval(()=>{
  if(!state) return;
  const dashPage = document.getElementById('page-dashboard');
  if(dashPage && dashPage.classList.contains('active')) renderDashboard();
}, 30000);

/* ============ INIT ============ */
loadState().then(()=>{
  document.documentElement.setAttribute('data-theme', state.theme);
});
</script>
</body>
</html>
