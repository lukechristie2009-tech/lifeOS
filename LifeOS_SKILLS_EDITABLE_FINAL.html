/* ============ DAILY REVIEW ============ */
/* ---- FULL DAILY REVIEW (additive) ----
   Everything below gathers a real, live snapshot of a given date's actual
   LifeOS data (routine, reminders, Top 3, learning, focuses) so the review
   is never based on fake/static data. Nothing here changes how routines,
   reminders, skills or focuses are stored — it only reads them. */
let reviewRescheduledIds = new Set();

function findFocusDayForDate(focuses, dateStr){
  for(const f of (focuses||[])){
    const day = (f.days||[]).find(d=>d.date===dateStr);
    if(day) return {focus:f, day};
  }
  return null;
}

function isReminderTop3(stats, reminder){
  return stats.top3Items.some(r=>String(r.id)===String(reminder.id));
}

function computeDailyReviewStats(dateStr){
  const lifeMatch = findFocusDayForDate(state.lifeFocuses, dateStr);
  const ecomMatch = findFocusDayForDate(state.ecommerceFocuses, dateStr);

  // Prefer the actual stored day (with real done/skillId/checklist data);
  // fall back to a freshly generated day only when no stored day exists
  // (mirrors the same fallback the Dashboard already uses for today).
  const lifeItemsAll = lifeMatch ? lifeMatch.day.items.filter(it=>it.category!=='ecommerce') : buildLifeFocusDayItems(dateStr);
  const ecomItemsAll = ecomMatch ? ecomMatch.day.items.filter(it=>it.category==='ecommerce') : buildEcommerceDayItems(dateStr);
  const mergedRoutine = mergeRoutineForDay(lifeItemsAll, ecomItemsAll);

  const routineCompleted = mergedRoutine.filter(it=>it.done);
  const routineMissed = mergedRoutine.filter(it=>!it.done);

  const remindersForDate = (state.reminders||[]).filter(r=>{
    const d = r.date || r.dueDate;
    return d===dateStr && !r.dismissed;
  });
  const remindersCompleted = remindersForDate.filter(r=> r.done||r.completed);
  const remindersMissed = remindersForDate.filter(r=> !(r.done||r.completed));

  const top3Ids = (state.reminderTop3 && Array.isArray(state.reminderTop3[dateStr])) ? state.reminderTop3[dateStr].map(String) : [];
  const reminderMap = {};
  (state.reminders||[]).forEach(r=>{ reminderMap[String(r.id)] = r; });
  const top3Items = top3Ids.map(id=>reminderMap[id]).filter(Boolean);
  const top3Completed = top3Items.filter(r=> r.done||r.completed);
  const top3Missed = top3Items.filter(r=> !(r.done||r.completed));

  const learningItem = mergedRoutine.find(it=>it.refId==='skilllearning') || null;
  const learningDone = !!(learningItem && learningItem.done);
  const learningSkill = (learningItem && learningItem.skillId) ? (state.skills||[]).find(sk=>sk.id===learningItem.skillId) : null;
  const learningProgressLabel = (learningSkill && window.LifeOSSkillProgressLabel) ? window.LifeOSSkillProgressLabel(learningSkill) : '';

  const lifeFocus = lifeMatch ? lifeMatch.focus : null;
  const lifeDay = lifeMatch ? lifeMatch.day : null;
  const ecomFocus = ecomMatch ? ecomMatch.focus : null;
  const ecomDay = ecomMatch ? ecomMatch.day : null;

  const routineTotal = mergedRoutine.length;
  const remindersTotal = remindersForDate.length;
  const top3Total = top3Items.length;
  const learningTotal = learningItem ? 1 : 0;
  const completedUnits = routineCompleted.length + remindersCompleted.length + top3Completed.length + (learningDone?1:0);
  const totalUnits = routineTotal + remindersTotal + top3Total + learningTotal;
  const overallPct = totalUnits>0 ? Math.round((completedUnits/totalUnits)*100) : 0;

  return {
    dateStr, mergedRoutine,
    routineCompleted, routineMissed, routineTotal,
    remindersForDate, remindersCompleted, remindersMissed, remindersTotal,
    top3Items, top3Completed, top3Missed, top3Total,
    learningItem, learningDone, learningSkill, learningProgressLabel,
    lifeFocus, lifeDay, ecomFocus, ecomDay,
    overallPct
  };
}

  return `<div id="drStars" style="display:flex;justify-content:center;gap:1px;flex-wrap:wrap">${stars}</div>
    <div id="drRatingLabel" style="margin-top:8px;font-size:15px;color:var(--text-3)">${selected? selected+'/10' : 'Tap to rate your day'}</div>`;
}

      <span class="pill ${done?'green':'red'}">${done?'✓ Done':'⚠ Missed'}</span>

  }).join('');
}

function reviewMoveReminderTomorrow(dateStr, reminderId){
  const newDate = addDaysISO(dateStr, 1);
  if(window.LifeOSRescheduleReminder) window.LifeOSRescheduleReminder(reminderId, newDate);
  reviewRescheduledIds.add(String(reminderId));

    set.add(String(reminderId));
    state.dailyReviews[dateStr].rescheduledReminderIds = Array.from(set);
    saveState();
  }
  toast('Moved to tomorrow');
  openDailyReviewEditor(dateStr);
}

  const target=Math.max(1,Math.floor(Number(document.getElementById('skillEditTargetSessions').value)||1));

  sk.masterySessions=target;

function saveSkillLearning(focusId,date,itemId){
  const focus=findAnyFocus(focusId); if(!focus)return;
  const day=focus.days.find(d=>d.date===date); if(!day)return;
  const item=day.items.find(i=>i.id===itemId); if(!item)return;
  const newId=document.getElementById('skillLearningSelect').value;
  const oldId=item.skillId||null;
  if(oldId===newId){
    item.done=!!newId;
  }else{
    if(oldId){const old=state.skills.find(sk=>sk.id===oldId);if(old){
      if(window.LifeOSUpdateSkillProgress) window.LifeOSUpdateSkillProgress(old, false);
      old.learnedDates=(old.learnedDates||[]).filter(d=>d!==date);
    }}
    item.skillId=newId||null;
    item.done=!!newId;
    if(newId){const sk=state.skills.find(sk=>sk.id===newId);if(sk){
      if(window.LifeOSUpdateSkillProgress) window.LifeOSUpdateSkillProgress(sk, true);
      sk.learnedDates=Array.from(new Set([...(sk.learnedDates||[]),date])).sort();
    }}
  }
  saveState(); closeSheet(); render(); toast(newId?'Skill logged':'Skill cleared');
}

function routineRow(it, lifeFocusId, ecomFocusId, date){
  const focusId = it.category==='ecommerce' ? ecomFocusId : lifeFocusId;
  const editable = !!focusId;
  if(it.type==='checklist'){
    const list = it.checklist||[];
    const doneCount = list.filter(c=>c.done).length;
    const clickAttr = editable? `onclick="toggleRoutineChecklistExpand('${focusId}','${date}','${it.id}')"` : '';
    return `
      <div class="row" style="${editable?'cursor:pointer':'opacity:.7'}" ${clickAttr}>
        <div class="row-text">
          <div class="row-title">${escapeHtml(it.title)}</div>
          <div class="row-sub">${it.expanded? 'Tap to collapse' : (list.length? doneCount+'/'+list.length+' done':'')}</div>
        </div>
        <div class="chevron" style="transform:rotate(${it.expanded?90:0}deg)">›</div>
      </div>
      ${it.expanded? `<div style="padding:0 16px 10px">${list.map(c=>`
        <div class="row" style="padding:8px 0;border-bottom:1px solid var(--sep)" ${editable?`onclick="event.stopPropagation();toggleChecklistChild('${focusId}','${date}','${it.id}','${c.id}')"`:''}>
          <div class="checkbox ${c.done?'checked':''}" style="${editable?'':'opacity:.5'}">${c.done?'✓':''}</div>
          <div class="row-text"><div class="row-title ${c.done?'done':''}">${escapeHtml(c.title)}</div></div>
        </div>`).join('')}</div>`:''}
    `;
  }
  const timeLabel = showRoutineTimes ? (it.time || it.displayText || '') : '';
  const cbAttr = editable? `onclick="toggleRoutineItem('${focusId}','${date}','${it.id}')"` : '';
  const skill = it.refId==='skilllearning' && it.skillId ? state.skills.find(sk=>sk.id===it.skillId) : null;
  const rowClick = editable && it.refId==='skilllearning' ? `onclick="openSkillLearningSheet('${focusId}','${date}','${it.id}')"` : '';
  return `
    <div class="row" ${rowClick}>
      <div class="checkbox ${it.done?'checked':''}" style="${editable?'':'opacity:.5'}" ${it.refId==='skilllearning' && editable ? 'onclick="event.stopPropagation();toggleRoutineItem(\''+focusId+'\',\''+date+'\',\''+it.id+'\')"' : cbAttr}>${it.done?'✓':''}</div>
      <div class="row-text">
        <div class="row-title ${it.done?'done':''}">${escapeHtml(it.title)}</div>
        <div class="row-sub">${timeLabel? escapeHtml(timeLabel)+(skill?' · ':''):''}${skill? 'Learned: '+escapeHtml(skill.name):escapeHtml(it.note||'')}</div>
      </div>
    </div>`;
}

function toggleShowRoutineTimes(){

function toggleRoutineItem(focusId, date, itemId){
  const focus = findAnyFocus(focusId);
  if(itemId && focus){
    const day = focus.days.find(d=>d.date===date);
    const item = day && day.items.find(i=>i.id===itemId);
    if(item && item.refId==='skilllearning'){ openSkillLearningSheet(focusId,date,itemId); return; }
  }
  if(!focus) return;
  const day = focus.days.find(d=>d.date===date);
  if(!day) return;
  const item = day.items.find(i=>i.id===itemId);
  if(!item) return;
  item.done = !item.done;
  saveState();
  render();
}
function toggleRoutineChecklistExpand(focusId, date, itemId){
  const focus = findAnyFocus(focusId);
  if(!focus) return;
  const day = focus.days.find(d=>d.date===date);
  if(!day) return;
  const item = day.items.find(i=>i.id===itemId);
  if(!item) return;
  item.expanded = !item.expanded;
  saveState();
  render();
}
function toggleChecklistChild(focusId, date, itemId, childId){
  const focus = findAnyFocus(focusId);
  if(!focus) return;
  const day = focus.days.find(d=>d.date===date);
  if(!day) return;
  const item = day.items.find(i=>i.id===itemId);
  if(!item || !item.checklist) return;
  const c = item.checklist.find(x=>x.id===childId);
  if(!c) return;
  c.done = !c.done;
  item.done = item.checklist.every(x=>x.done);
  saveState();
  render();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- Live Today's Timetable ---- */
function fmtRange(start,end){
  const f=t=>{ let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0) hh=12; return hh+':'+String(m).padStart(2,'0')+' '+ap; };
  return f(start)+'–'+f(end);
}
function renderTodayTimetableCard(){
  const now = new Date();
  const dow = now.getDay();
  const blocks = getDaySchedule(dow);
  if(!blocks){
    return `
      <div class="section-label">Today's Timetable</div>
      <div class="card"><div class="empty"><div class="icon">🎒</div><div class="msg">No school today.</div></div></div>
    `;
  }
  const nm = nowMinutes();
  let currentIdx = -1;
  blocks.forEach((b,i)=>{
    if(nm>=timeToMinutes(b.start) && nm<timeToMinutes(b.end)) currentIdx=i;
  });
  let upNextHtml='';
  if(currentIdx>-1){
    const cur = blocks[currentIdx];
    if(cur.type==='break'){
      const next = blocks.slice(currentIdx+1).find(b=>b.type==='period');
      if(next) upNextHtml = `<div class="tt-upnext">Up Next: <b>${escapeHtml(next.subject)}</b> at ${fmtRange(next.start,next.end).split('–')[0]}</div>`;
    }
  }
  const rows = blocks.map((b,i)=>{
    const done = timeToMinutes(b.end)<=nm;
    const isCurrent = i===currentIdx;
    const cls = ['tt-row', b.type==='break'?'tt-break':'', isCurrent?'tt-current':'', (done && !isCurrent)?'tt-done':''].filter(Boolean).join(' ');
    const label = b.type==='period' ? escapeHtml(b.subject) : escapeHtml(b.label);
    return `<div class="${cls}"><div class="tt-time">${fmtRange(b.start,b.end)}</div><div class="tt-title">${label}</div></div>`;
  }).join('');
  return `
    <div class="section-label">Today's Timetable</div>
    <div class="card" id="todayTimetableCard">${rows}</div>
    ${upNextHtml}
  `;
}

function focusMoveItem(idx,dir){

  // themselves, everything else moves among itself) so the two systems

/* Overall + per-category completion score for a Weekly Focus. Ecommerce
   completion is pulled from whichever Ecommerce Focus day(s) fall within this
   week's Monday–Sunday range, since Ecommerce Focus is a separate, independently
   dated track (see the comment above buildLifeFocusDayItems/buildEcommerceDayItems). */
function computeWeeklyScore(focus){
  const cat = {routine:{done:0,total:0}, gym:{done:0,total:0}, school:{done:0,total:0}, ecommerce:{done:0,total:0}};
  function tally(items){
    items.forEach(it=>{
      const key = it.category==='gym' ? 'gym' : it.category==='school' ? 'school' : it.category==='ecommerce' ? 'ecommerce' : 'routine';
      if(it.type==='checklist' && Array.isArray(it.checklist) && it.checklist.length){
        cat[key].total += it.checklist.length;
        cat[key].done += it.checklist.filter(c=>c.done).length;
      } else {
        cat[key].total++;
        if(it.done) cat[key].done++;
      }
    });
  }
  focus.days.forEach(d=> tally(d.items));
  state.ecommerceFocuses.forEach(ef=>{
    (ef.days||[]).forEach(d=>{
      if(d.date>=focus.startDate && d.date<=focus.endDate) tally(d.items.filter(it=>it.category==='ecommerce'));
    });
  });
  const total = cat.routine.total+cat.gym.total+cat.school.total+cat.ecommerce.total;
  const done = cat.routine.done+cat.gym.done+cat.school.done+cat.ecommerce.done;
  const pct = t=> t.total ? Math.round(t.done/t.total*100) : null;
  return {
    overall: total ? Math.round(done/total*100) : 0,
    routine: pct(cat.routine), gym: pct(cat.gym), school: pct(cat.school), ecommerce: pct(cat.ecommerce)
  };
}

/* ---- Editable Goal Categories (add / rename / delete / reorder) ---- */
function renderGoalCategoryManager(){
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet();renderGoals();">Close</button><h2>Goal Categories</h2><span></span></div>
    <div class="sheet-body">
      <div class="row-sub" style="padding:0 2px 10px">Rename, reorder, delete, or add categories. Goals in a deleted category move to the first remaining one.</div>
      <div class="card">
        ${state.goalCategories.map((c,i)=>`
          <div class="row">
            <div class="row-text">
              <input type="text" value="${escapeHtml(c)}" style="border:none;background:transparent;font-size:15px;font-weight:500;width:100%;color:var(--text);font-family:inherit" onchange="renameGoalCategory(${i},this.value)">
            </div>
            <button class="sheet-btn" onclick="moveGoalCategory(${i},-1)">↑</button>
            <button class="sheet-btn" onclick="moveGoalCategory(${i},1)">↓</button>
            <button class="sheet-btn" style="color:var(--red)" onclick="deleteGoalCategory(${i})">Delete</button>
          </div>`).join('')}
      </div>
      <div class="field"><label>New Category</label><input type="text" id="newGoalCat" placeholder="e.g. Finance"></div>
      <button class="btn-primary" onclick="addGoalCategory()">+ Add Category</button>
    </div>
  `);
}
function renameGoalCategory(i,val){
  val=(val||'').trim(); if(!val) return;
  const old = state.goalCategories[i];
  if(old===val) return;
  state.goalCategories[i]=val;
  state.goals.forEach(g=>{ if(g.category===old) g.category=val; });
  saveState(); toast('Renamed');
}
function moveGoalCategory(i,dir){
  const n=i+dir; if(n<0||n>=state.goalCategories.length) return;
  [state.goalCategories[i],state.goalCategories[n]]=[state.goalCategories[n],state.goalCategories[i]];
  saveState(); renderGoalCategoryManager();
}
function deleteGoalCategory(i){
  if(state.goalCategories.length<=1){ toast('Keep at least one category'); return; }
  const cat = state.goalCategories[i];
  const fallback = state.goalCategories.find((c,idx)=>idx!==i);
  state.goals.forEach(g=>{ if(g.category===cat) g.category=fallback; });
  state.goalCategories.splice(i,1);
  saveState(); renderGoalCategoryManager();
}
function addGoalCategory(){
  const el=document.getElementById('newGoalCat');
  const val=(el.value||'').trim();
  if(!val) return;
  if(state.goalCategories.includes(val)){ toast('Already exists'); return; }
  state.goalCategories.push(val);
  saveState(); renderGoalCategoryManager();
}
function toggleGoal(id){ const g=state.goals.find(x=>x.id===id); g.done=!g.done; saveState(); renderGoals(); }
function openNewGoalSheet(){

function toggleTheme(){
  state.theme = state.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  saveState(); renderSettings();
}

function openEditRoutineItem(id){
  const t = activeRoutine().find(x=>x.id===id);
  if(!t) return;
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Close</button><h2>Edit Task</h2>${t.locked!=='last'?`<button class="sheet-btn bold" style="color:var(--red)" onclick="removeRoutineItem('${id}')">Delete</button>`:'<span style="width:40px"></span>'}</div>
    <div class="sheet-body">
      <div class="field"><label>Title</label><input type="text" id="rtTitle" value="${escapeHtml(t.title)}"></div>
      <div class="field"><label>Time (e.g. 07:00) or display text (e.g. Before Ecommerce)</label><input type="text" id="rtTime" value="${escapeHtml(t.time||t.displayText||'')}"></div>
      <div class="field"><label>Note</label><textarea id="rtNote">${escapeHtml(t.note||'')}</textarea></div>
      <div class="row" style="padding:0 0 16px">
        <div class="row-text row-title">Show in Routine</div>
        <button class="toggle ${t.hidden?'':'on'}" id="rtHiddenToggle" onclick="this.classList.toggle('on')"><div class="knob"></div></button>
      </div>
      <button class="btn-primary" onclick="saveRoutineItem('${id}')">Save</button>
    </div>
  `);
}
function saveRoutineItem(id){
  const t = activeRoutine().find(x=>x.id===id);
  if(!t) return;
  t.title = document.getElementById('rtTitle').value.trim();
  const val = document.getElementById('rtTime').value.trim();
  if(/^\d{1,2}:\d{2}$/.test(val)){ t.time=val; t.displayText=''; } else { t.time=''; t.displayText=val; }
  t.note = document.getElementById('rtNote').value.trim();
  t.hidden = !document.getElementById('rtHiddenToggle').classList.contains('on');
  saveState(); closeSheet(); renderFocus(); renderSettings(); render(); toast('Saved');
}
function removeRoutineItem(id){
  const list = activeRoutine();
  const t = list.find(x=>x.id===id);
  if(t && t.locked==='last'){ toast('Sleep must stay the final routine item'); return; }
  getActiveProfile().routine = list.filter(t=>t.id!==id);
  saveState(); closeSheet(); renderFocus(); renderSettings(); render(); toast('Removed');
}
function moveRoutineTemplateItem(id, dir){
  const list = activeRoutine();
  const idx = list.findIndex(t=>t.id===id);
  const n = idx+dir;
  if(idx<0||n<0||n>=list.length) return;
  if(list[idx].locked==='last' || list[n].locked==='last') return; // Sleep stays last
  [list[idx],list[n]] = [list[n],list[idx]];
  saveState(); renderFocus(); renderSettings();
}
function openAddRoutineItem(){
  openSheet(`
    <div class="sheet-header"><button class="sheet-btn" onclick="closeSheet()">Cancel</button><h2>Add Task</h2><button class="sheet-btn bold" onclick="addRoutineItem()">Add</button></div>
    <div class="sheet-body">
      <div class="field"><label>Title</label><input type="text" id="rtTitleNew"></div>
      <div class="field"><label>Time (e.g. 07:00) or display text (e.g. Before Ecommerce)</label><input type="text" id="rtTimeNew"></div>
      <div class="field"><label>Note</label><textarea id="rtNoteNew"></textarea></div>
    </div>
  `);
}
function addRoutineItem(){
  const title=document.getElementById('rtTitleNew').value.trim();
  if(!title){ toast('Enter a title'); return; }
  const val=document.getElementById('rtTimeNew').value.trim();
  const note=document.getElementById('rtNoteNew').value.trim();
  const newItem={id:uid(), title, time:'', displayText:'', note, category:'routine', hidden:false};
  if(/^\d{1,2}:\d{2}$/.test(val)) newItem.time=val; else newItem.displayText=val;
  const list = activeRoutine();
  const lastIdx = list.findIndex(t=>t.locked==='last');
  if(lastIdx>-1) list.splice(lastIdx,0,newItem);
  else list.push(newItem);
  saveState(); closeSheet(); renderFocus(); renderSettings(); render(); toast('Added');
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lifeos-backup-'+todayISO()+'.json';
  a.click();
  toast('Exported');
}
function backupData(){ exportData(); }
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      state = Object.assign(defaultState(), imported);
      saveState();
      document.documentElement.setAttribute('data-theme', state.theme);
      render();
      toast('Import successful');
    }catch(err){ toast('Invalid file'); }
  };
  reader.readAsText(file);
}
function resetAllData(){
  if(!confirm('This will permanently delete all your data. Continue?')) return;
  state = defaultState();
  saveState();
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
  toast('All data reset');
}

function openGymEditor(){
  const g = state.data.gym || (state.data.gym = {});
  const split = getGymSplit();
  const ex = g.exercises || GYM_EXERCISES;
  const order = [1,2,3,4,5,6,0];
  openSheet(`
    <div class="sheet-header">
      <button class="sheet-btn" onclick="closeSheet()">Cancel</button>
      <h2>Gym Split & Routines</h2>
      <button class="sheet-btn bold" onclick="saveGymEditor()">Save</button>
    </div>

      <div class="field">
        <label>How this works</label>
        <div class="row-sub">Change the split name for each day and the exercises underneath it. The Dashboard will use these saved values automatically.</div>
      </div>
      ${order.map(d=>{
        const name = split[d] || '';
        const list = ex[name] || [];
        return `
          <div class="field">
            <label>${DAY_NAMES[d]} · Workout Name</label>
            <input type="text" id="gymSplit_${d}" value="${escapeHtml(name)}">
          </div>
          <div class="field">
            <label>${DAY_NAMES[d]} · Exercises (one per line)</label>
            <textarea id="gymEx_${d}" style="min-height:110px">${escapeHtml(list.join('\n'))}</textarea>
          </div>
        `;
      }).join('')}
      <div class="field">
        <label>Progression</label>
        <textarea id="gymProgression" style="min-height:90px">${escapeHtml(g.progression || GYM_PROGRESSION)}</textarea>
      </div>
      <div class="field">
        <label>Exercise Notes</label>
        <textarea id="gymNotes" style="min-height:100px">${escapeHtml(g.exerciseNotes||'')}</textarea>
      </div>
    </div>
  `);
}

function saveGymEditor(){
  const g = state.data.gym || (state.data.gym = {});
  const order = [1,2,3,4,5,6,0];
  const oldSplit = getGymSplit();
  const oldEx = g.exercises || GYM_EXERCISES;
  const newSplit = {};
  const newEx = {};

  order.forEach(d=>{
    const oldName = oldSplit[d] || '';
    const name = document.getElementById(`gymSplit_${d}`).value.trim() || oldName || 'Rest';
    const lines = document.getElementById(`gymEx_${d}`).value.split('\n').map(s=>s.trim()).filter(Boolean);
    newSplit[d] = name;
    newEx[name] = lines;

    // If the workout was renamed, carry its existing routine forward unless
    // the user changed the routine in the editor.
    if(!lines.length && oldName && oldEx[oldName]) newEx[name] = [...oldEx[oldName]];
  });

  g.split = newSplit;
  g.exercises = newEx;
  g.progression = document.getElementById('gymProgression').value.trim();
  g.exerciseNotes = document.getElementById('gymNotes').value.trim();

  saveState();
  closeSheet();
  renderSettings();
  render();
  toast('Gym split updated');
}

  renderDashboard();
  if(document.getElementById('page-focus').classList.contains('active') || focusTab) renderFocus();
  renderGoals();
  renderSettings();
}

/* ============ CLOCK ============ */
setInterval(()=>{
  const el = document.getElementById('clockTime');
  if(el){
    const now = new Date();
    el.textContent = now.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  }
}, 15000);

/* ============ LIVE TIMETABLE REFRESH ============ */
setInterval(()=>{
  if(!state) return;
  const dashPage = document.getElementById('page-dashboard');
  if(dashPage && dashPage.classList.contains('active')) renderDashboard();
  scanForMissedNotifications();
  maybeShowNextMissedNotification();
}, 30000);

/* ============ INIT ============ */
loadState().then(()=>{
  document.documentElement.setAttribute('data-theme', state.theme);
  scanForMissedNotifications();
  maybeShowNextMissedNotification();
});
</script>
